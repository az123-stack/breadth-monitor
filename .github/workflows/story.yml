name: Story chapter

# Saves a story chapter to docs/story.json. Dispatched by `python -m breadth.story publish --push` from the Claude scheduled
# tasks (they can dispatch workflows but not write repo files directly). The chapter text arrives base64-encoded.
on:
  workflow_dispatch:
    inputs:
      slot: { description: "am or pm", required: true }
      date: { description: "YYYY-MM-DD", required: true }
      branch: { description: "A, B, W or none", required: true }
      title: { description: "Chapter title", required: true }
      md_b64: { description: "Chapter markdown, base64", required: true }

permissions:
  contents: write

concurrency:
  group: story
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save the chapter
        env:
          SLOT: ${{ inputs.slot }}
          CDATE: ${{ inputs.date }}
          BRANCH: ${{ inputs.branch }}
          TITLE: ${{ inputs.title }}
          MD: ${{ inputs.md_b64 }}
        run: python -m breadth.story publish --slot "$SLOT" --date "$CDATE" --branch "$BRANCH" --title "$TITLE" --md-b64 "$MD"
      - name: Commit
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add docs/story.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Story: ${{ inputs.date }} ${{ inputs.slot }} chapter"
          for i in 1 2 3; do
            git push -q && break
            git pull -q --rebase -X theirs || { git rebase --abort; break; }
          done
