name: FINRA short volume

# Free FINRA daily short sale volume (off-exchange) -> data/finra/*.parquet + data/finra_daily.csv.
# Run by hand once with recent = 0 to backfill every day in our bars (~500 files, a few minutes);
# the daily update tops it up afterwards.
on:
  workflow_dispatch:
    inputs:
      recent:
        description: "Only the last N trading days (0 = every missing day)"
        required: false
        default: "0"

concurrency:
  group: breadth-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  finra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch FINRA files
        env:
          RECENT: ${{ github.event.inputs.recent || '0' }}
        run: python -m breadth.finra --recent "$RECENT"
      - name: Commit
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add -A data/finra data/finra_daily.csv
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "FINRA short volume $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git push && exit 0; git pull --rebase || { git rebase --abort; exit 1; }; done
          exit 1
