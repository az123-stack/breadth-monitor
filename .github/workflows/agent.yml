name: Agent input

# Saves a Catalyst / Macro / Review agent answer to docs/agent/<kind>.json, then rebuilds the page so the Decision Cards
# (and data/decision_log.csv) include it. Dispatched by `python -m breadth.agentfiles publish --push` from the Claude
# scheduled tasks (they can dispatch workflows but not write repo files). The JSON arrives base64-encoded and is
# validated again here; an invalid file is never written.
#
# Two jobs on purpose: GitHub keeps only the NEWEST pending run in a concurrency queue and cancels older pending ones.
# The save job is not queued (it can't be cancelled, so no agent answer is ever lost). Rebuilds queue in their OWN group
# (so they can never cancel a waiting daily update); a cancelled pending rebuild is harmless because the newer one
# includes every saved file. The rebuild waits for any running daily update, then rebuilds on the latest main and, if the
# push races another commit, starts over from the new main (it never overwrites newer generated files).
# Both jobs fail loudly (red run) if they can't push.
on:
  workflow_dispatch:
    inputs:
      kind: { description: "catalysts, macro_brief, review, plan or reclass", required: true }
      b64: { description: "Agent JSON, base64", required: true }

permissions:
  contents: write
  actions: read          # to see whether a daily update is running

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt     # belt and braces: the save path itself is stdlib-only (tested)
      - name: Validate and save
        env:
          KIND: ${{ inputs.kind }}
          B64: ${{ inputs.b64 }}
        run: python -m breadth.agentfiles save --kind "$KIND" --b64 "$B64"
      - name: Commit the agent file
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add docs/agent
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Agent input: $KIND"
          for i in 1 2 3 4 5; do
            if git push -q; then exit 0; fi
            sleep $((i * 3))
            git pull -q --rebase || { echo "rebase failed"; exit 1; }
          done
          echo "could not push the agent file"; exit 1

  rebuild:
    needs: save
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: agent-rebuild
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Wait for any running daily update (up to 20 min)
        run: |
          for i in $(seq 1 40); do
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=5" --jq '[.workflow_runs[]|select(.status=="in_progress" or .status=="queued")]|length')
            [ "$n" = "0" ] && exit 0
            echo "daily update running ($n); waiting"; sleep 30
          done
          echo "::warning::daily update still running after 20 minutes; rebuilding anyway (the push step retries on the newest main)"
      - name: Rebuild on the latest main and push (start over if main moved)
        env:
          KIND: ${{ inputs.kind }}
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            if [ "$KIND" = "review" ]; then python -m breadth.layers macro && python -m breadth.layers log; fi
            python -m breadth.update --rebuild-only
            git add docs data
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -qm "Rebuild with agent input ($KIND)"
            if git push -q; then exit 0; fi
            echo "main moved; rebuilding again"
          done
          echo "could not push the rebuild"; exit 1
