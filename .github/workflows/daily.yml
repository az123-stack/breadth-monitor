name: Breadth update

on:
  schedule:
    # 10:17 UTC Tue–Sat = 6:17 AM ET in summer (5:17 AM in winter).
    # Each run picks up the previous trading day, so Saturday's run covers Friday.
    - cron: "17 10 * * 2-6"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Calendar days of history to load (first run: 730). Leave 0 for a normal update."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: breadth-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # a 2-year backfill on the free plan takes ~2 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and rebuild dashboard
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
        run: |
          if [ "$BACKFILL_DAYS" != "0" ]; then
            python -m breadth.update --backfill-days "$BACKFILL_DAYS"
          else
            python -m breadth.update
          fi

      - name: Commit results
        if: always()   # keep partial backfill progress even if a later step failed
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Breadth update $(date -u +%Y-%m-%d)"
            git push
          fi
