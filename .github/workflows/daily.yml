name: Breadth update

on:
  schedule:
    # Evening runs grab the day's bars soon after Massive publishes them; the
    # overnight run is a backup. Off the busy top of the hour (GitHub delays or
    # skips scheduled runs when busy). ET shown for summer; winter is 1 hour earlier.
    # A day that isn't published yet is skipped and picked up by the next run;
    # a rerun with nothing new just rebuilds the page in a couple of minutes.
    - cron: "37 22 * * 1-5"   # 6:37 PM ET Mon-Fri
    - cron: "7 1 * * 2-6"     # 9:07 PM ET Mon-Fri (backup)
    - cron: "7 6 * * 2-6"     # 2:07 AM ET (last backup)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Calendar days of history to load (first run: 730). Leave 0 for a normal update."
        required: false
        default: "0"
      wait_until:
        description: "Evening runs: wait for today's data until this ET time (e.g. 01:00), checking every 15 min. Blank = don't wait."
        required: false
        default: ""
      extend_history:
        description: "Refetch older history for long-term returns (one-off, ~70 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: breadth-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # a 2-year backfill on the free plan takes ~2 hours
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data and rebuild dashboard
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}
          EXTEND: ${{ github.event.inputs.extend_history || 'false' }}
          WAIT_UNTIL: ${{ github.event.inputs.wait_until || '' }}
        run: |
          if [ "$BACKFILL_DAYS" != "0" ]; then
            python -m breadth.update --backfill-days "$BACKFILL_DAYS"
          elif [ "$EXTEND" = "true" ]; then
            python -m breadth.update --extend-history
          elif [ -n "$WAIT_UNTIL" ]; then
            python -m breadth.update --wait-until "$WAIT_UNTIL"
          else
            python -m breadth.update
          fi

      - name: Commit results
        if: always()   # keep partial backfill progress even if a later step failed
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Breadth update $(date -u +%Y-%m-%d)"
            # If code was pushed while this ran, replay our data commit on top
            # (generated files from this run win any conflict).
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs || { git rebase --abort; exit 1; }
            done
          fi
