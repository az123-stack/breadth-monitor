name: Monthly levels (warehouse)

# Raw Yahoo monthly bars for the trade warehouse's point-in-time overhead-supply variable (tools/warehouse/monthly.py).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-levels
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Fetch monthly bars
        run: python tools/warehouse/monthly.py
      - name: Commit
        run: |
          git config user.name "breadth-bot"
          git config user.email "breadth-bot@users.noreply.github.com"
          git add data/warehouse/monthly.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -qm "Warehouse monthly levels $(TZ=America/New_York date +%Y-%m-%d)"
          for i in 1 2 3; do
            git push -q && break
            git pull -q --rebase -X theirs || { git rebase --abort; break; }
          done
