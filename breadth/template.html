<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --border: #e3e1dc;
  --grid: #ebe9e4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --up: #2a78d6;
  --down: #e34948;
  --s1: #2a78d6;
  --s2: #eb6834;
  --neutral-mid: #f0efec;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --tint-strong: 34%;
  --tint-light: 14%;
  --pos: #16a34a; --neg: #dc2626;
  --t1: 16%; --t2: 32%; --t3: 52%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --up: #3987e5; --down: #e66767; --s1: #3987e5; --s2: #d95926; --neutral-mid: #383835;
    --tint-strong: 40%; --tint-light: 18%;
    --pos: #22c55e; --neg: #ef4444; --t1: 18%; --t2: 34%; --t3: 55%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --up: #3987e5; --down: #e66767; --s1: #3987e5; --s2: #d95926; --neutral-mid: #383835;
  --tint-strong: 40%; --tint-light: 18%;
  --pos: #22c55e; --neg: #ef4444; --t1: 18%; --t2: 34%; --t3: 55%;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--text-secondary); font-size: 13px; }
.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }

/* Regime */
.regime { display: grid; grid-template-columns: 6px 1fr; overflow: hidden; margin-bottom: 14px; }
.regime .bar { background: var(--tone); }
.regime .body { padding: 16px 18px; }
.regime .label { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
.regime .label svg { flex: none; color: var(--tone); }
.regime .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 4px; }
.regime p { margin: 6px 0 0; color: var(--text-secondary); max-width: 760px; }
.regime ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; }
.tile .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
.tiles.tiles4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 900px) { .tiles.tiles4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .v { font-size: 22px; } }

/* Charts */
.charts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
.chart { padding: 14px 16px 8px; position: relative; min-width: 0; }
.chart h2, .tablecard h2 { font-size: 14px; font-weight: 600; margin: 0; }
.chart .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 1px; vertical-align: 3px; width: 14px; }
.legend .lgtoggle { font: inherit; color: inherit; background: none; border: 1px solid var(--border); border-radius: 999px; padding: 1px 9px; cursor: pointer; }
.legend .lgtoggle:hover { color: var(--text-primary); }
.legend .lgtoggle.off { opacity: .45; text-decoration: line-through; }
.chart .plot { display: flex; align-items: flex-start; }
.chart .scroller { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-bottom: 4px; }
.chart .scroller { cursor: grab; scrollbar-color: var(--text-muted) var(--grid); }
.chart .scroller.dragging { cursor: grabbing; user-select: none; }
.chart .scroller::-webkit-scrollbar { height: 10px; }
.chart .scroller::-webkit-scrollbar-track { background: var(--grid); border-radius: 5px; }
.chart .scroller::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 5px; }
.chartbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.chartbar .range { font-size: 13px; color: var(--text-secondary); }
.chartbar .range b { color: var(--text-primary); font-weight: 600; }
.navbtns { display: inline-flex; gap: 6px; }
.navbtns button { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; }
.navbtns button:hover { background: var(--neutral-mid); }
.navbtns button:disabled { opacity: .4; cursor: default; }
.chart svg { display: block; overflow: visible; }
.chart svg.yaxis { flex: none; }
.chart .hint { font-size: 11.5px; color: var(--text-muted); margin-left: auto; }
.chart svg text { fill: var(--text-muted); font-size: 11px; font-family: Inter, system-ui, sans-serif; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  opacity: 0; transition: opacity .08s; white-space: nowrap; z-index: 2;
}
.tip b { display: block; margin-bottom: 3px; font-weight: 600; }
.tip div { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
.tip span:last-child { color: var(--text-primary); }

/* Table */
.tablecard { padding: 14px 0 0; }
.tablecard .head { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 10px; gap: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle button { background: none; border: 0; padding: 5px 10px; font: inherit; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--neutral-mid); color: var(--text-primary); font-weight: 600; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--grid); }
th { position: sticky; top: 0; background: var(--surface-1); font-weight: 600; color: var(--text-secondary); font-size: 11.5px; vertical-align: bottom; line-height: 1.25; }
th small { display: block; font-weight: 400; color: var(--text-muted); }
td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
td.grp, th.grp { border-left: 1px solid var(--border); }
td.u2 { background: color-mix(in srgb, var(--up) var(--tint-strong), transparent); }
td.u1 { background: color-mix(in srgb, var(--up) var(--tint-light), transparent); }
td.d2 { background: color-mix(in srgb, var(--down) var(--tint-strong), transparent); }
td.d1 { background: color-mix(in srgb, var(--down) var(--tint-light), transparent); }
.key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); padding: 10px 16px 14px; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
.signals { padding: 14px 16px 10px; margin-bottom: 14px; }
.signals .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.signals h2 { font-size: 14px; font-weight: 600; margin: 0; }
.signals .more { background: none; border: 0; color: var(--text-secondary); font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; }
.sig { display: grid; grid-template-columns: 22px 92px 1fr; gap: 4px 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 8px 4px; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
.sig:hover { background: var(--neutral-mid); }
.sig svg { margin-top: 1px; }
.sig .d { color: var(--text-secondary); font-size: 13px; }
.sig .t { font-weight: 600; font-size: 13.5px; }
.sig .t small { display: block; font-weight: 400; color: var(--text-secondary); font-size: 12.5px; margin-top: 1px; }
.sig.minor .t { font-weight: 500; }
@media (max-width: 520px) { .sig { grid-template-columns: 22px 1fr; } .sig .d { grid-column: 2; } .sig .t { grid-column: 2; } }
/* ---------- green/red return fills ---------- */
.g1 { background: color-mix(in srgb, var(--pos) var(--t1), transparent); }
.g2 { background: color-mix(in srgb, var(--pos) var(--t2), transparent); }
.g3 { background: color-mix(in srgb, var(--pos) var(--t3), transparent); font-weight: 600; }
.r1 { background: color-mix(in srgb, var(--neg) var(--t1), transparent); }
.r2 { background: color-mix(in srgb, var(--neg) var(--t2), transparent); }
.r3 { background: color-mix(in srgb, var(--neg) var(--t3), transparent); font-weight: 600; }
.sbar { display: inline-block; width: 54px; height: 6px; border-radius: 3px; background: var(--grid); vertical-align: middle; margin-right: 6px; overflow: hidden; }
.sbar i { display: block; height: 100%; border-radius: 3px; }
.sval { display: inline-block; min-width: 22px; text-align: right; }
.bucket .bstr { white-space: nowrap; }
.regcard { padding: 14px 16px; margin-bottom: 12px; }
.regcard .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.regcard .regnow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
.regcard p { margin: 6px 0 10px; font-size: 14px; }
.wocard.act { border-left: 4px solid var(--good); }
.wocard.watch { border-left: 4px solid var(--warning); }
.revflag { background: color-mix(in srgb, var(--warning) 30%, transparent) !important; border-color: color-mix(in srgb, var(--warning) 60%, transparent) !important; font-weight: 700; }
.revn { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 999px; background: var(--warning); color: #1a1a1a; font-size: 11px; text-align: center; }
.revcard.on { border-color: color-mix(in srgb, var(--warning) 60%, transparent); background: color-mix(in srgb, var(--warning) 10%, var(--card-bg, transparent)); }
.revcard ul { margin: 6px 0 4px; padding-left: 20px; }
.revcard li { margin: 3px 0; }
.picks { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; margin-top: 8px; }
.pick { border: 1px solid var(--grid); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.phead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pnum { font-weight: 700; color: var(--text-muted); }
.pt { font-size: 20px; font-weight: 800; letter-spacing: .3px; }
.pscore { margin-left: auto; font-weight: 800; font-size: 18px; font-family: "JetBrains Mono", ui-monospace, monospace; }
.pwhy { font-size: 13px; margin: 8px 0; color: var(--text-secondary); }
.pplan { font-size: 13px; }
.pplan > div { display: grid; grid-template-columns: 58px minmax(0, 1fr); padding: 3px 0; border-top: 1px solid var(--grid); }
.pplan > div > span { min-width: 0; overflow-wrap: anywhere; }
.pplan > div > span:first-child { color: var(--text-muted); font-weight: 600; }
.pparts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin-top: 8px; font-size: 11px; color: var(--text-muted); }
.pparts span { position: relative; padding: 2px 4px; border-radius: 4px; overflow: hidden; background: var(--grid); }
.pparts span i { position: absolute; left: 0; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 30%, transparent); }
.pparts b { position: relative; font-weight: 600; color: var(--text-secondary); }
.pbv { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; vertical-align: 1px; }
.pbv.focus { background: color-mix(in srgb, var(--good) 35%, transparent); }
.pbv.selective { background: color-mix(in srgb, var(--warning) 30%, transparent); }
.pbv.avoid { background: color-mix(in srgb, var(--critical) 28%, transparent); }
.pbv.unproven { background: var(--grid); color: var(--text-secondary); }
.dlay { display: grid; grid-template-columns: 14px 84px minmax(0, 1fr); gap: 0 6px; padding: 4px 0; border-top: 1px solid var(--grid); font-size: 13px; align-items: baseline; }
.dlay > span:nth-child(2) { color: var(--text-muted); font-weight: 600; }
.dlay > span:last-child { min-width: 0; overflow-wrap: anywhere; }
.ddot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--text-muted); }
.ddot.good { background: var(--good); } .ddot.bad { background: var(--critical); } .ddot.neutral { background: var(--neutral-mid); border: 1px solid var(--text-muted); }
.ddot.info { background: var(--s1); } .ddot.unknown { background: transparent; border: 1px dashed var(--text-muted); }
.dtag { font-size: 10px; padding: 1px 5px; border-radius: 6px; background: var(--grid); color: var(--text-secondary); margin-left: 4px; white-space: nowrap; }
.dsum { font-size: 12px; margin: 4px 0 6px; }
.pbtab td.pbwhy { white-space: normal; min-width: 280px; font-size: 12.5px; color: var(--text-secondary); }
.pbtab tr.pbdim td { opacity: .7; }
.tg { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 1px 6px; border-radius: 999px; margin: 1px 2px 1px 0; white-space: nowrap;
  background: color-mix(in srgb, var(--s1, #4a7) 18%, transparent); color: var(--text-primary); border: 1px solid transparent; }
.tg.tg-warn { background: color-mix(in srgb, var(--warning) 25%, transparent); }
.tg.tg-help { border-color: var(--good); }
.tg.tg-hurt { border-color: var(--critical); }
.igrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.itile { border: 1px solid var(--grid); border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; min-width: 0; }
.itile small { color: var(--text-muted); font-size: 11.5px; }
.itile b { font-size: 18px; font-family: "JetBrains Mono", ui-monospace, monospace; }
.itile .meta { font-size: 11px; }
.up { color: var(--good); } .dn { color: var(--critical); }
.ibars { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 3px 16px; }
.ibar { display: grid; grid-template-columns: 1fr 80px 64px; align-items: center; gap: 6px; font-size: 12.5px; }
.ibar i { height: 8px; border-radius: 4px; display: block; }
.ibar i.up, .ibp i.up { background: color-mix(in srgb, var(--good) 60%, transparent); } .ibar i.dn, .ibp i.dn { background: color-mix(in srgb, var(--critical) 60%, transparent); }
.ibar b { text-align: right; font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 600; }
.ibp { display: inline-block; width: 50px; height: 7px; margin-right: 6px; vertical-align: middle; }
.ibp i { display: block; height: 100%; border-radius: 3px; }
.isplit { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 12px; }
.ih { font-size: 13px; margin: 12px 0 4px; }
@media (max-width: 520px) { .icard table.grid td.l { white-space: normal; min-width: 110px; } .icard table.grid td.l small { display: block; } .icard table.grid th, .icard table.grid td { padding-left: 5px; padding-right: 5px; } }
.ibtns { margin: 6px 0; }
.tsbtns { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tsbtns button { font: inherit; font-size: 12.5px; font-weight: 600; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--grid); background: var(--surface, transparent); color: var(--text-primary); cursor: pointer; }
.ang { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 6px; border-radius: 999px; margin: 1px 2px 1px 0; background: var(--grid); color: var(--text-secondary); white-space: nowrap; }
.ang.on { background: color-mix(in srgb, var(--pos) 35%, transparent); color: var(--text-primary); }
.magcell small { display: block; color: var(--text-muted); font-size: 11px; }
.btgrid td.l small { display: block; color: var(--text-muted); font-weight: 400; }
.btgrid tr.basel td { color: var(--text-secondary); }
.regpill { font-weight: 700; font-size: 15px; padding: 3px 12px; border-radius: 999px; }
.regpill.strong { background: color-mix(in srgb, var(--good) 25%, transparent); }
.regpill.mixed { background: color-mix(in srgb, var(--warning) 28%, transparent); }
.regpill.weak { background: color-mix(in srgb, var(--critical) 25%, transparent); }
@media (max-width: 520px) { .regtab td.l, .regtab th.l { position: static; min-width: 150px; } .regtab td { white-space: nowrap; } }
.regtab th.nowcol { color: var(--text-primary); box-shadow: inset 0 -2px 0 var(--s1); }
.ck { display: inline-block; width: 17px; height: 17px; line-height: 17px; text-align: center; border-radius: 4px; font-size: 10.5px; font-weight: 700; margin-right: 2px; background: var(--grid); color: var(--text-muted); }
.ck.on { background: color-mix(in srgb, var(--pos) 35%, transparent); color: var(--text-primary); }
.hright { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
@media (max-width: 520px) { .hright { align-items: flex-start; } }
.xopen, .xbtns button { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-primary); cursor: pointer; }
.xbtns button.primary { background: var(--s1); border-color: var(--s1); color: #fff; }
.xmodal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow-y: auto; }
.xbox { width: 100%; max-width: 640px; padding: 16px 18px; }
.xhead { display: flex; justify-content: space-between; align-items: center; }
.xhead h2 { margin: 0; font-size: 17px; }
.xclose { background: none; border: 0; font-size: 18px; cursor: pointer; color: var(--text-secondary); }
.xlist { display: grid; gap: 2px; margin: 10px 0; }
.xrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: start; padding: 7px 4px; border-top: 1px solid var(--grid); cursor: pointer; }
.xrow input { margin-top: 3px; }
.xrow small { display: block; color: var(--text-muted); font-size: 12px; margin-top: 1px; }
.xrow .xgroups { color: var(--text-secondary); }
.xcount { white-space: nowrap; font-size: 12.5px; padding-top: 2px; }
.xsum { margin: 6px 0; }
.xprev { width: 100%; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11.5px; background: var(--surface-0); color: var(--text-secondary); border: 1px solid var(--border); border-radius: 8px; padding: 8px; resize: vertical; }
.xbtns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.xopens { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.kqsec { margin-top: 6px; }
.rocard { margin-bottom: 12px; padding: 0; } .rocard > summary { cursor: pointer; list-style: none; padding: 14px 16px; }
.rocard > summary::-webkit-details-marker { display: none; }
.rocard .roh { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.rocard .rot { font-size: 17px; font-weight: 650; } .rocard .rov { margin-top: 4px; font-size: 14px; color: var(--text-secondary); }
.rocard.now { border-color: var(--s1); } .rocard .rob { padding: 0 16px 14px; }
.rocard .rob .ih { margin-top: 14px; } .rol { margin: 6px 0 0; padding-left: 18px; line-height: 1.55; } .rol li { margin: 2px 0; }
.rogo { white-space: nowrap; font-size: 12.5px; }
.rocols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin-top: 6px; }
.rocol { border: 1px solid var(--border, rgba(127,127,127,.25)); border-radius: 10px; padding: 8px 10px; }
.rosched { flex-wrap: wrap; } .rosched details ul { margin: 4px 0; }
.databar { margin-bottom: 10px; padding: 10px 14px; border: 1px solid var(--warning); background: color-mix(in srgb, var(--warning) 10%, var(--surface-1)); }
.datacard { border-left: 3px solid var(--warning); padding: 12px 16px; }
.stcard { margin-bottom: 12px; } .stcols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }

<body>
<div class="wrap" id="app"></div>
<script>
const DATA = /*__DATA__*/null;

const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const fmtK = (v) => v == null ? "–" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v >= 1e3 ? Math.round(v / 1e3) + "K" : String(Math.round(v));
const fmt = (v, d = 0) => v == null ? "–" : Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
const ord = (n) => n == null ? "" : n + (["th","st","nd","rd"][(n % 100 - 20) % 10] || ["th","st","nd","rd"][n % 100] || "th");
const shortDate = (s) => { const d = new Date(s + "T12:00:00"); return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }); };
const longDate = (s) => { const d = new Date(s + "T12:00:00"); return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }); };

const TONES = {
  bull:    { color: "var(--good)",     icon: '<path d="M4 14l5-5 4 4 7-7M14 6h6v6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' },
  bear:    { color: "var(--critical)", icon: '<path d="M4 8l5 5 4-4 7 7M14 16h6v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' },
  warn:    { color: "var(--warning)",  icon: '<path d="M12 3l9.5 17h-19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.2v.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
  neutral: { color: "var(--text-muted)", icon: '<path d="M4 12h16M4 7h10M4 17h13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
};

let TAB = "readout";
try { const h = location.hash.slice(1); if (["readout", "breadth", "premarket", "intraday", "trades", "themes", "rotation", "browse", "setups", "stocks"].includes(h)) TAB = h; } catch (e) {}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!DATA || !DATA.rows || !DATA.rows.length) {
    app.innerHTML = '<div class="card empty">No data yet. Run the backfill workflow once to load history.</div>';
    return;
  }
  const last = DATA.rows[DATA.rows.length - 1], gen = new Date(DATA.generated);
  app.append($(`<header>
    <div><h1>Market Monitor</h1>
    <div class="meta">Data through ${longDate(last.date)}</div></div>
    <div class="hright"><div class="meta">Updated ${gen.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} · ${fmt(DATA.history_days)} days of history</div>
    <div class="xopens">${DATA.themes && DATA.themes.setup_review && DATA.themes.setup_review.flag ? `<button class="xopen revflag" title="The market has shifted since the trade setups were chosen">${DATA.themes.setup_review.reasons.some(r => r.kind === "thrust") ? "⚡ Thrust · review setups" : "⚑ Review setups"} <span class="revn">${DATA.themes.setup_review.reasons.length}</span></button>` : ""}${DATA.themes && DATA.themes.trade_setups ? '<button class="xopen tsopen" title="All Trade Setups lists, one section per setup">⬇ Trade Setups</button>' : ""}${DATA.kq ? '<button class="xopen kqopen">⬇ KQ list</button>' : ""}${DATA.themes ? '<button class="xopen tvopen">⬇ TradingView list</button>' : ""}</div></div>
  </header>`));
  const xo = app.querySelector(".tvopen"); if (xo) xo.addEventListener("click", openExport);
  const ko = app.querySelector(".kqopen"); if (ko) ko.addEventListener("click", openKQ);
  const tso = app.querySelector(".tsopen"); if (tso) tso.addEventListener("click", () => {
    const X = DATA.themes.trade_setups, P = DATA.themes.playbook || {};
    const rank = Object.fromEntries((P.rows || []).map(r => [r.key, r.rank]));
    const picks = (P.picks || []).map(c => c.t);
    tsDownload("trade-setups", [...(picks.length ? [{ name: "Today's top picks", ticks: picks }] : []),
      ...X.setups.slice().sort((a, b) => (rank[a.key] || 9) - (rank[b.key] || 9)).map(s => ({ name: s.name, ticks: s.top })),
      ...(DATA.themes.hve ? [{ name: "Record volume - up days (warning list)", ticks: DATA.themes.hve.rows.filter(r => r.chg > 0).map(r => r.t) },
        { name: "Record volume - down days", ticks: DATA.themes.hve.rows.filter(r => r.chg < 0).map(r => r.t) },
        { name: "Record volume - short watch (turn triggered)", ticks: DATA.themes.hve.rows.filter(r => r.short && r.short.state === "triggered").map(r => r.t) },
        { name: "Record volume - short watch (spike, waiting)", ticks: DATA.themes.hve.rows.filter(r => r.profile === "spike" && !(r.short && r.short.state === "triggered")).map(r => r.t) }] : [])]);
  });
  const rf = app.querySelector(".revflag"); if (rf) rf.addEventListener("click", () => {
    const b = app.querySelector('nav.tabs button[data-tab="trades"]'); if (b) b.click();
    setTimeout(() => { const c = document.querySelector(".revcard"); if (c) c.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50);
  });
  const tabs = $(`<nav class="tabs" role="tablist">
    <button role="tab" data-tab="readout">Read-out</button>
    <button role="tab" data-tab="breadth">Breadth</button>
    <button role="tab" data-tab="premarket">Pre-market</button>
    <button role="tab" data-tab="intraday">Intraday</button>
    <button role="tab" data-tab="trades">Trade Setups</button>
    <button role="tab" data-tab="themes">Themes</button>
    <button role="tab" data-tab="rotation">Rotation</button>
    <button role="tab" data-tab="browse">Browse</button>
    <button role="tab" data-tab="setups">Setups</button>
    <button role="tab" data-tab="stocks">Stocks</button></nav>`);
  app.append(tabs);
  const panel = $('<div class="panel"></div>');
  app.append(panel);
  const show = () => {
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === TAB));
    panel.innerHTML = "";
    if (TAB === "themes") renderThemes(panel);
    else if (TAB === "stocks") renderStocks(panel);
    else if (TAB === "browse") renderBrowse(panel);
    else if (TAB === "setups") renderSetups(panel);
    else if (TAB === "trades") renderTrades(panel);
    else if (TAB === "intraday") renderIntraday(panel);
    else if (TAB === "premarket") renderPremarket(panel);
    else if (TAB === "rotation") renderRotation(panel);
    else if (TAB === "readout") renderReadout(panel);
    else renderBreadth(panel);
    reapplySorts(panel);
  };
  tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    TAB = b.dataset.tab;
    try { history.replaceState(null, "", "#" + TAB); } catch (e) {}
    show();
  }));
  show();
}

/* ---------- Macro drivers strip ---------- */
const MACRO_SCALE = { d1: 0.015, d5: 0.04, d30: 0.1, d90: 0.2 };
function macroVal(m) {
  if (m.unit === "pct") return m.last.toFixed(2) + "%";
  const v = Math.abs(m.last), d = v >= 1000 ? 0 : v >= 100 ? 1 : v >= 10 ? 2 : 3;
  return (m.unit === "$" ? "$" : "") + Number(m.last).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
}
function macroChg(m, k) {
  const v = m[k];
  if (v == null) return '<span class="meta">–</span>';
  if (m.unit === "pct") {                       // yields: basis points
    const bp = Math.round(v * 100), c = tint(v, MACRO_SCALE[k] * 4);
    return `<span class="mchg ${c}">${bp > 0 ? "+" : ""}${bp} bp</span>`;
  }
  return `<span class="mchg ${tint(v, MACRO_SCALE[k])}">${pct(v)}</span>`;
}
function sparkSVG(vals, w = 120, h = 30) {
  const v = vals.filter(x => x != null);
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (y - lo) / span * (h - 6)).toFixed(1)}`);
  const [lx, ly] = pts[pts.length - 1].split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><polyline points="${pts.join(" ")}" fill="none" stroke="var(--s1)" stroke-width="1.5" stroke-linejoin="round"/><circle cx="${lx}" cy="${ly}" r="2.5" fill="var(--s1)"/></svg>`;
}
const subStrength = () => { const M = {}; ((DATA.themes || {}).subthemes || []).forEach(r => { M[r.theme] = r; }); return M; };
function macroStrip(compact) {
  const L = DATA.macro || [];
  if (!L.length) return $('<div></div>');
  const SM = subStrength();
  const tiles = L.map(m => {
    const drv = (m.drives || []).map(n => SM[n] ? `<span class="mdrv" title="${esc(n)}: Theme Strength ${SM[n].strength ?? "–"}, rank ${SM[n].s_rank ?? "–"}">${esc(n)} <b class="${(SM[n].strength ?? 50) >= 70 ? "up" : (SM[n].strength ?? 50) <= 30 ? "dn" : ""}">${SM[n].strength == null ? "–" : Math.round(SM[n].strength)}</b></span>` : "").join("");
    const pos = m.pos == null ? "" : `<div class="mrange" title="Where it sits in its 1-year range (low to high)"><i style="left:${Math.round(m.pos * 100)}%"></i></div>`;
    return `<div class="mtile" title="${esc(m.label)} · ${esc(m.src)} · close ${esc(m.date)}">
      <div class="mtop"><span class="mk">${esc(m.label)}${m.src.startsWith("ETF") ? ` <small>${esc(m.src)}</small>` : ""}</span>${sparkSVG(m.spark.slice(compact ? -40 : -90), compact ? 64 : 110, compact ? 22 : 30)}</div>
      <div class="mv2 num">${macroVal(m)}</div>
      <div class="mchgs"><span>1D ${macroChg(m, "d1")}</span><span>5D ${macroChg(m, "d5")}</span><span>1M ${macroChg(m, "d30")}</span>${compact ? "" : `<span>3M ${macroChg(m, "d90")}</span>`}</div>
      ${compact ? "" : pos + (drv ? `<div class="mdrvs">${drv}</div>` : "")}</div>`;
  }).join("");
  const asof = L.map(m => m.date).sort().pop();
  const el = $(`<section class="card mstrip${compact ? " compact" : ""}"><div class="kicker">Macro drivers · closes through ${shortDate(asof)}${compact ? ' · <a href="#rotation" class="mgo">full view on Rotation ›</a>' : ""}</div>
    <div class="mgrid">${tiles}</div>
    ${compact ? "" : `<div class="note" style="padding:8px 0 0">Futures and index closes from Yahoo Finance, refreshed in the morning run. The 3-2-1 crack spread is the refining margin in $/bbl: (2 × gasoline + 1 × diesel − 3 × crude) ÷ 3, so it rises when fuel outruns crude. The bar under each value shows where it sits in its 1-year range. Each tile lists the sub-themes it drives with their Theme Strength today (green 70+, red 30 or less). Tiles marked ETF fell back to the ETF in our own data because the futures feed was missing.</div>`}</section>`);
  const go = el.querySelector(".mgo");
  if (go) go.addEventListener("click", (e) => { e.preventDefault(); const b = document.querySelector('nav.tabs button[data-tab="rotation"]'); if (b) { b.click(); window.scrollTo(0, 0); } });
  return el;
}

/* ---------- small line chart used by the pair panel ---------- */
function lineChart(dates, series, opts = {}) {
  const Wc = 720, Hc = opts.h || 200, m = { t: 12, r: 64, b: 22, l: 44 };
  const el = $(`<div class="lc">${opts.title ? `<div class="lct">${opts.title}</div>` : ""}<div class="lcbox"></div></div>`);
  const all = series.flatMap(s => s.vals.filter(v => v != null));
  if (!all.length) return el;
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
  const n = dates.length, x = (i) => m.l + i * (Wc - m.l - m.r) / Math.max(1, n - 1), y = (v) => m.t + (hi - v) / (hi - lo) * (Hc - m.t - m.b);
  const svg = S("svg", { viewBox: `0 0 ${Wc} ${Hc}`, width: "100%", role: "img", "aria-label": opts.title || "chart" });
  el.querySelector(".lcbox").append(svg);
  const step = (hi - lo) / 4;
  for (let k = 0; k <= 4; k++) {
    const v = lo + k * step;
    S("line", { x1: m.l, x2: Wc - m.r, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, svg);
    const t = S("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end" }, svg); t.textContent = (opts.fmt || (v => v.toFixed(0)))(v);
  }
  if (opts.ref != null && opts.ref > lo && opts.ref < hi) S("line", { x1: m.l, x2: Wc - m.r, y1: y(opts.ref), y2: y(opts.ref), stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "2 3" }, svg);
  const ticks = Math.min(6, n);
  for (let k = 0; k < ticks; k++) {
    const i = Math.round(k * (n - 1) / Math.max(1, ticks - 1));
    const t = S("text", { x: x(i), y: Hc - 5, "text-anchor": k === 0 ? "start" : k === ticks - 1 ? "end" : "middle" }, svg); t.textContent = shortDate(dates[i]);
  }
  series.forEach(s => {
    let d = "", pen = false;
    s.vals.forEach((v, i) => { if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
    S("path", { d, fill: "none", stroke: s.color, "stroke-width": s.w || 2, "stroke-dasharray": s.dash || "", "stroke-linejoin": "round" }, svg);
    for (let i = n - 1; i >= 0; i--) if (s.vals[i] != null) {
      if (!s.dash) S("circle", { cx: x(i), cy: y(s.vals[i]), r: 4, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
      if (s.label) { const t = S("text", { x: x(i) + 8, y: y(s.vals[i]) + 4, class: "lclab" }, svg); t.textContent = s.label; }
      break;
    }
  });
  const tip = $('<div class="tip"></div>'); el.append(tip);
  const cross = S("line", { y1: m.t, y2: Hc - m.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 }, svg);
  const hit = S("rect", { x: m.l, y: 0, width: Wc - m.l - m.r, height: Hc, fill: "transparent" }, svg);
  const move = (ev) => {
    const p = ev.touches ? ev.touches[0] : ev, r = svg.getBoundingClientRect();
    const sx = (p.clientX - r.left) * Wc / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.round((sx - m.l) / ((Wc - m.l - m.r) / Math.max(1, n - 1)))));
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    tip.innerHTML = `<b>${longDate(dates[i])}</b>` + series.filter(s => s.name).map(s => `<div><span><i class="lsw" style="background:${s.color}"></i>${esc(s.name)}</span><span class="num">${s.vals[i] == null ? "–" : (opts.fmt || (v => v.toFixed(1)))(s.vals[i])}</span></div>`).join("");
    const er = el.getBoundingClientRect(), px = r.left - er.left + x(i) * r.width / Wc, tw = tip.offsetWidth;
    tip.style.left = (px + 14 + tw < er.width - 4 ? px + 14 : Math.max(4, px - 14 - tw)) + "px";
    tip.style.top = (r.top - er.top + 4) + "px"; tip.style.opacity = 1;
  };
  const leave = () => { cross.setAttribute("opacity", 0); tip.style.opacity = 0; };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", leave);
  return el;
}

/* ---------- Pair charts ---------- */
function groupByKey() {
  const T = DATA.themes, M = {};
  (T.themes || []).forEach(r => { if (r.px) M["t:" + r.theme] = { ...r, kind: "Theme" }; });
  (T.subthemes || []).forEach(r => { if (r.px) M["s:" + r.theme] = { ...r, kind: "Sub-theme" }; });
  return M;
}
// Starter pairs: [first, second, category, what a RISING line means, what a FALLING line means]
const STARTER_PAIRS = [
  ["s:Refiners", "s:Shale E&P", "Energy", "fuel margins are the better oil trade (fuel prices outrunning crude)", "the crude price itself is the better trade (drillers win)"],
  ["s:Natural Gas Producers", "s:Shale E&P", "Energy", "gas is the stronger commodity right now", "oil is the stronger commodity right now"],
  ["s:Gold Mid-tiers", "s:Gold Majors & Royalties", "Metals", "traders are taking more risk inside gold: the smaller, riskier miners lead in a healthy gold run", "money is hiding in the safest gold names: a cautious or tiring gold move"],
  ["s:Silver Miners", "s:Gold Majors & Royalties", "Metals", "silver is outrunning gold, which usually happens late and hot in a metals run", "gold is leading: the calmer, more defensive part of metals"],
  ["s:Copper Miners", "s:Gold Majors & Royalties", "Metals", "growth beats fear: copper (the economy metal) over gold (the safety metal)", "fear beats growth: money prefers the safety of gold"],
  ["s:Regional & Community Banks", "s:Money-center Banks", "Financials", "confidence in the domestic economy and credit; small banks lead in good times", "stress or caution: money sticks with the biggest, safest banks"],
  ["s:Mid-cap Biotech", "s:Large-cap Biotech", "Health", "risk appetite in health care: speculative biotech is being bought", "caution: money prefers big, profitable biotech"],
  ["s:AI Applications & Platforms", "s:AI Accelerators & GPUs", "AI", "the AI trade is spreading from the chips to the software that uses them", "the chip makers are still where the AI money goes"],
  ["s:Neoclouds & GPU Hosting", "s:Hyperscalers", "AI", "speculative AI names are running: a hot, risk-on AI tape", "the safe AI giants lead: a more cautious AI trade"],
  ["s:Data Center Power & Cooling", "s:AI Accelerators & GPUs", "AI", "the 'picks and shovels' of AI (power, cooling) are leading the chips", "the chips lead the infrastructure around them"],
  ["s:Homebuilders", "s:Building Products", "Housing", "new-home demand is leading (often when rates fall)", "repair and remodel suppliers lead the builders"],
  ["s:Defense Tech & Electronics", "s:Defense Primes", "Defense", "money favors the newer, faster-growing defense names", "money favors the big, established contractors"],
  ["s:Bitcoin Miners", "s:Crypto Exchanges & Brokers", "Crypto", "the high-beta end of crypto is leading: a hot crypto tape", "the steadier crypto businesses lead"],
  ["t:TECH - Semiconductors", "t:TECH - Software", "Tech", "hardware beats software", "software beats hardware"],
];
const pairCorr = (A, B, n = 120) => {          // correlation of daily returns, last n sessions
  const k = Math.min(n, A.px.length - 1, B.px.length - 1), ra = [], rb = [];
  for (let i = A.px.length - k; i < A.px.length; i++) { ra.push(A.px[i] / A.px[i - 1] - 1); rb.push(B.px[i] / B.px[i - 1] - 1); }
  const ma = ra.reduce((s, x) => s + x, 0) / k, mb = rb.reduce((s, x) => s + x, 0) / k;
  let sab = 0, saa = 0, sbb = 0;
  for (let i = 0; i < k; i++) { const a = ra[i] - ma, b = rb[i] - mb; sab += a * b; saa += a * a; sbb += b * b; }

  H = view < 560 ? 190 : 210;
  charts.append(chartBreakouts(rows));
  charts.append(chartTrend(rows));
  charts.append(chartRatios(rows));
  charts.append(chartT2108(rows));
  charts.append(chartHighsLows(rows));
  charts.append(chartNearHigh(rows));
  if (rows.some(r => r.dv_net != null)) charts.append(chartMoney(rows));
  if (VT && rows.some(r => r.vtilt10 != null)) charts.append(chartTilt(rows, VT));
  syncScroll([...charts.querySelectorAll(".scroller")], bar, rows);
  app.append(table(rows));

  app.append($(`<footer>
    <b>Definitions.</b> Universe: US common stocks, close ≥ $3. 4% days: close ≥ 4% above (or below) the prior close on volume above the prior day and ≥ 100k.
    5/10-day ratio: sum of 4% up days ÷ sum of 4% down days over the window. 25%/qtr: change over 65 trading days; month: 20 days; 34-day: 13%.
    Slower metrics and T2108 use stocks with 20-day avg volume ≥ 100k.
    New 52-week highs / lows: liquid stocks with a year of history whose high (low) beat every day of the prior year; "near a high" = close within 3% of the 52-week high.
    Leadership narrowing: SPY within 1% of its 52-week high while the 10-day average of stocks near their highs is 40%+ below its 60-day peak. New highs take over: the 10-day average of new highs moves above new lows for 3 days after weeks of lows leading. Table shading compares each value with your own history (darker = beyond the 10th/90th percentile).
    Money in or out: each stock's dollar volume (close × volume, $3+ stocks) counted toward rising or falling stocks; "$ in falling" = the falling side's share, net $ = rising − falling. Every share sold has a buyer, so this shows which side was in control, not cash literally leaving. 60%+ in falling stocks = money leaving, 40% or less = coming in.
    Who won the close: for $3+ stocks trading $5M+/day, where each closed in its day's high–low range (−1 low, +1 high), weighted by dollar volume; "bought back" = share of stocks down 1%+ that still closed in the top half, "sold into" = share of stocks up 1%+ that closed in the bottom half. Percentiles vs the chart window. Tested Oct 2024–Oct 2026: it describes the day but did not predict SPY over the next 5–21 sessions, so read it as today's scoreboard, not a signal.
    Volume tilt: among $3+ stocks trading $5M+/day, the ones that moved more than half their usual daily range up vs down; for each side the median volume vs that stock's own 50-day average; tilt = log of up-side ÷ down-side × 100, averaged over 10 days. Low = bottom 20% of our history, high = top 20%. "After a thrust" = within 25 sessions of a major Breadth thrust / Follow-through. Evidence = SPY from the next open to the close 21 sessions later, recomputed every morning.
    Regime thresholds are starter values; calibrate them in <code>breadth/config.py</code>.
    · <a href="breadth.csv">Download full history (CSV)</a></footer>`));
}

/* ---------- Washout thrust: a breadth thrust out of a deep washout, and the high-beta leaders list ---------- */
function washoutCard(X) {
  const R = X.rules, cur = X.current, pc = (v, d = 0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
  const cond = (pull, tlo) => `SPY pullback ${pc(pull, 1)} (needs ${pc(-R.pullback)} or deeper) · T2108 low ${tlo ?? "–"} (needs ≤ ${R.t2108})`;
  const rule = `${R.top} stocks with RS ≥ ${R.min_rs} and the highest 60-day beta to SPY ($5+, $${R.dvol / 1e6}M+/day), bought the next open, held ~${R.window} sessions`;
  const fin = X.events.filter(e => e.done), dp = fin.filter(e => e.deep), sh = fin.filter(e => !e.deep);
  const avg = (L, k) => L.length ? L.reduce((a, e) => a + (e[k] || 0), 0) / L.length : null;

    const P = cur.picks || [];
    body = `<p class="meta" style="margin:6px 0">${rule}. ${cur.basket == null ? "" : `So far: list ${pc(cur.basket, 1)} (median ${pc(cur.basket_med, 1)}) vs all stocks ${pc(cur.all, 1)}, SPY ${pc(cur.spy, 1)}.`}</p>
      <div class="scroll"><table class="grid"><thead><tr><th class="l">Stock</th><th>RS<small>thrust day</small></th><th>Beta<small>to SPY, 60d</small></th><th>Since entry</th></tr></thead><tbody>
      ${P.map(p => `<tr><td class="l tname">${p.t}<small>${esc((p.name || "").slice(0, 26))}</small></td><td class="num ${rsTint(p.rs)}">${p.rs ?? "–"}</td><td class="num">${p.beta.toFixed(1)}</td><td class="num">${pc(p.ret, 1)}</td></tr>`).join("")}</tbody></table></div>`;
  } else if (X.state === "shallow") {
    cls = "watch";
    head = `<b>Thrust, but not a washout thrust.</b> The ${longDate(cur.date)} thrust came after a shallow dip (${cond(cur.pullback, cur.t2108_low)}). After the ${X.shallow_n} shallow thrusts on file, the high-beta leaders list averaged ${pc(avg(sh, "basket"), 1)} in a month vs ${pc(avg(sh, "all"), 1)} for all stocks (no real edge, for far more risk): don't chase the most volatile names on this one; your normal setups and the post-thrust playbook still apply.`;
  } else {
    head = `No washout thrust in the last ${R.window} sessions. Setup today: ${cond(X.now.pullback, X.now.t2108_low)}. A thrust only counts here if it comes out of a washout that deep.`;
  }

    <td class="l">${e.deep ? '<span class="tg ppull">washout</span>' : '<span class="tg pother">shallow</span>'}</td>
    <td class="num">${e.basket == null ? "–" : pc(e.basket, 1)}${e.done || e.basket == null ? "" : `<small>${e.held} sess.</small>`}</td><td class="num">${pc(e.all, 1)}</td><td class="num">${pc(e.spy, 1)}</td></tr>`).join("");
  const now = (X.now.list || []).map(p => p.t).join(", ");
  return $(`<section class="card regcard wocard ${cls}"><div class="kicker">Washout thrust · experimental</div>

      <p class="meta" style="margin:6px 0">Study (Oct 2026, ~2 years of data): no group or "hub" moves before the others (they all bottom with SPY), and plain RS leaders lagged right after thrusts, the momentum-crash pattern where the most market-sensitive stocks lead the rebound. What paid was this list — ${rule} — but only when the thrust came out of a deep washout. Only ${X.deep_n} such events so far, so treat this as a strong hint, not a proven rule; names in the list have dropped as much as 79–90% in a month.</p>

/* ---------- small SVG chart kit ---------- */
function syncScroll(list, bar, rows) {
  let lock = false;
  const range = bar.querySelector(".range"), btns = bar.querySelectorAll("button");
  const label = () => {
    const sc = list[0];
    const i0 = Math.max(0, Math.floor((sc.scrollLeft - M.l) / pxDay));
    const i1 = Math.min(rows.length - 1, Math.floor((sc.scrollLeft + sc.clientWidth - M.l) / pxDay) - 1);
    const fmtD = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    range.innerHTML = `Showing <b>${fmtD(rows[i0].date)}</b> – <b>${fmtD(rows[Math.max(i0, i1)].date)}</b>`;
    const max = sc.scrollWidth - sc.clientWidth;
    btns[0].disabled = sc.scrollLeft <= 1;
    btns[1].disabled = btns[2].disabled = sc.scrollLeft >= max - 1;
  };
  const setAll = (v) => { list.forEach(o => { o.scrollLeft = v; }); label(); };
  list.forEach(sc => {
    sc.addEventListener("scroll", () => {
      if (lock) return; lock = true;
      list.forEach(o => { if (o !== sc) o.scrollLeft = sc.scrollLeft; });
      label();
      requestAnimationFrame(() => { lock = false; });
    }, { passive: true });
    // Click-and-drag to pan (mouse); touch devices already swipe natively.
    let drag = null;
    sc.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      drag = { x: e.clientX, left: sc.scrollLeft, moved: false };
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 3) { drag.moved = true; sc.classList.add("dragging"); }
      if (drag.moved) setAll(drag.left - dx);
    });
    window.addEventListener("pointerup", () => { if (drag) { drag = null; sc.classList.remove("dragging"); } });
  });
  btns.forEach(b => b.addEventListener("click", () => {
    const sc = list[0], page = sc.clientWidth * 0.8;
    const v = b.dataset.go === "end" ? sc.scrollWidth : sc.scrollLeft + Number(b.dataset.go) * page;
    list.forEach(o => o.scrollTo({ left: v, behavior: "smooth" }));
  }));
  scrollToIndex = (i) => {
    if (i == null) return;
    const sc = list[0], v = M.l + i * pxDay - sc.clientWidth / 2;
    list.forEach(o => o.scrollTo({ left: v, behavior: "smooth" }));
    list[0].closest(".charts").scrollIntoView({ behavior: "smooth", block: "start" });
  };
  requestAnimationFrame(() => setAll(list[0].scrollWidth));
}
let W = 1100, H = 210, pxDay = 7;
const M = { t: 14, r: 26, b: 24, l: 26 };
const AXW = 40;          // fixed y-axis column outside the scroll area
function frame(title, legend, height = H) {
  const el = $(`<div class="card chart"><h2>${title}</h2><div class="legend">${legend}</div><div class="plot"><div class="scroller"></div></div></div>`);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${height}`);
  svg.setAttribute("width", W); svg.setAttribute("height", height);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", title);
  el.querySelector(".scroller").append(svg);
  const ax = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ax.setAttribute("class", "yaxis"); ax.setAttribute("viewBox", `0 0 ${AXW} ${height}`);
  ax.setAttribute("width", AXW); ax.setAttribute("height", height);
  el.querySelector(".plot").append(ax);
  const tip = $('<div class="tip"></div>'); el.append(tip);
  return { el, svg, ax, tip, h: height, scroller: el.querySelector(".scroller") };
}
const S = (tag, attrs, parent) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.append(n); return n; };

function yLabel(c, yy, text) { const tx = S("text", { x: 4, y: yy + 4 }, c.ax); tx.textContent = text; }
function axes(c, rows, y, ticks, fmtY) {
  const svg = c.svg, h = c.h;
  const g = S("g", {}, svg);
  ticks.forEach(t => {
    S("line", { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }, g);
    yLabel(c, y(t), fmtY(t));
  });
  const n = rows.length, x = (i) => M.l + (i + 0.5) * (W - M.l - M.r) / n;
  const step = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(W / 130))));
  for (let i = n - 1; i >= 0; i -= step) {
    const tx = S("text", { x: x(i), y: h - 6, "text-anchor": "middle" }, g); tx.textContent = shortDate(rows[i].date);
  }
  return x;
}

function hover(c, rows, x, lines) {
  const n = rows.length, bw = (W - M.l - M.r) / n;
  const cross = S("line", { y1: M.t, y2: c.h - M.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 }, c.svg);
  const hit = S("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: c.h, fill: "transparent" }, c.svg);
  const move = (ev) => {
    const pt = ev.touches ? ev.touches[0] : ev;
    const r = c.svg.getBoundingClientRect();
    const sx = (pt.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.floor((sx - M.l) / bw)));
    const row = rows[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    c.tip.innerHTML = `<b>${longDate(row.date)}</b>` + lines.map(([lab, f]) => `<div><span>${lab}</span><span class="num">${f(row)}</span></div>`).join("")
      + (EVBY[row.date] || []).map(e => `<div style="margin-top:4px"><span style="color:${EV_STYLE[e.kind].color};font-weight:600">● ${e.label}</span><span></span></div>`).join("");
    const er = c.el.getBoundingClientRect();     // SVG elements have no offsetTop/Left
    const px = r.left - er.left + x(i) * r.width / W;
    const tw = c.tip.offsetWidth;
    const right = px + 14 + tw < er.width - 4;    // sit beside the crosshair, flip near the edge
    c.tip.style.left = (right ? px + 14 : Math.max(4, px - 14 - tw)) + "px";
    c.tip.style.top = (r.top - er.top + 4) + "px";
    c.tip.style.opacity = 1;
  };
  const leave = () => { cross.setAttribute("opacity", 0); c.tip.style.opacity = 0; };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", leave);
}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); return Math.ceil((v || 1) / p * 2) / 2 * p; }
function path(rows, x, y, key) {
  let d = "", pen = false;
  rows.forEach((r, i) => { const v = r[key]; if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
  return d;
}
function endLabel(svg, x, y, rows, key, text, color) {
  for (let i = rows.length - 1; i >= 0; i--) if (rows[i][key] != null) {
    S("circle", { cx: x(i), cy: y(rows[i][key]), r: 4, fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    return;
  }
}

function chartBreakouts(rows) {
  const c = frame("Stocks up / down 4%+ per day",
    '<span><i style="background:var(--up)"></i>Up 4%+</span><span><i style="background:var(--down)"></i>Down 4%+</span><span><i class="line" style="background:var(--text-secondary)"></i>40-day avg of up 4%+</span><span><i class="line" style="background:var(--text-muted);height:0;border-top:2px dashed var(--text-muted)"></i>Thrust level (2× avg)</span>');
  // Scale to normal days, not the rare spike: cap at the 95th percentile of the
  // window (or the thrust line), and label any bar that runs past the top.
  const vals = rows.flatMap(r => [r.up4 || 0, r.dn4 || 0]).sort((a, b) => a - b);
  const p95 = vals[Math.floor(vals.length * 0.95)] || 1;
  const thrustMax = Math.max(...rows.map(r => (r.up4_avg40 || 0) * 2));
  const mx = niceMax(Math.max(p95, thrustMax) * 1.05);
  const mid = M.t + (c.h - M.t - M.b) / 2, half = (c.h - M.t - M.b) / 2;
  const cap = (v) => Math.min(v, mx);
  const y = (v) => mid - cap(v) / mx * half;
  const yd = (v) => mid + cap(v) / mx * half;
  const x = axes(c, rows, y, [mx, mx / 2, 0], v => fmt(v));
  [mx / 2, mx].forEach(t => { S("line", { x1: M.l, x2: W - M.r, y1: yd(t), y2: yd(t), stroke: "var(--grid)" }, c.svg); yLabel(c, yd(t), fmt(t)); });
  const bw = (W - M.l - M.r) / rows.length, w = Math.max(1, bw - 2);
  const clipped = [];
  rows.forEach((r, i) => {
    const x0 = x(i) - w / 2;
    if (r.up4) S("rect", { x: x0, y: y(r.up4), width: w, height: mid - y(r.up4), rx: Math.min(2, w / 3), fill: "var(--up)" }, c.svg);
    if (r.dn4) S("rect", { x: x0, y: mid, width: w, height: yd(r.dn4) - mid, rx: Math.min(2, w / 3), fill: "var(--down)" }, c.svg);
    if (r.up4 > mx) clipped.push([i, r.up4, true]);
    if (r.dn4 > mx) clipped.push([i, r.dn4, false]);
  });
  S("line", { x1: M.l, x2: W - M.r, y1: mid, y2: mid, stroke: "var(--text-muted)", "stroke-width": 1 }, c.svg);
  eventLines(c, x, false);
  const thr = rows.map(r => ({ v: r.up4_avg40 != null ? r.up4_avg40 * 2 : null }));
  S("path", { d: path(thr, x, y, "v"), fill: "none", stroke: "var(--text-muted)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, c.svg);
  S("path", { d: path(rows, x, y, "up4_avg40"), fill: "none", stroke: "var(--text-secondary)", "stroke-width": 2, "stroke-linejoin": "round" }, c.svg);
  clipped.forEach(([i, v, up]) => {
    const tx = S("text", { x: x(i), y: up ? M.t - 2 : c.h - M.b + 12, "text-anchor": "middle", style: "fill:var(--text-primary);font-weight:600" }, c.svg);
    tx.textContent = fmt(v) + (up ? " ▲" : " ▼");
  });
  hover(c, rows, x, [["Up 4%+", r => fmt(r.up4)], ["Down 4%+", r => fmt(r.dn4)], ["40-day avg", r => fmt(r.up4_avg40)], ["Thrust level", r => r.up4_avg40 == null ? "–" : fmt(r.up4_avg40 * 2)]]);
  return c.el;

function csvSplit(line) {

  for (let i = 0; i < line.length; i++) {
    const ch = line[i];

    else if (ch === '"') q = true; else if (ch === ",") { out.push(cur); cur = ""; } else cur += ch;
  }

}

function parseLiveCSV(text) {
  const prices = {}, rows = {}, anchors = {}; let spyTime = null, asof = null, cols = null;
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    const f = csvSplit(line), k = (f[0] || "").replace(/^"|"$/g, "");
    if (k === "ticker") { cols = f.map(x => x.toLowerCase()); return; }
    if (k === "_spytime") { spyTime = f[1]; return; }
    if (k === "_asof") { asof = f[1]; (cols || []).forEach((c, i) => { if (/^at\d+$/.test(c) && f[i] && f[i] !== "0") anchors[c] = f[i]; }); return; }
    if (!k || k[0] === "_") return;
    const key = k.toUpperCase(), r = {};
    (cols || ["ticker", "price"]).forEach((c, i) => { if (i === 0 || c === "symbol") return;
      if (/^at\d+$/.test(c)) { r[c] = parseAnchor(f[i], key); return; }   // frozen "TICKER|price|volume" at 10:00 / 11:00 ET
      r[c] = liveNum(f[i]); });
    if (r.price != null && r.price > 0) prices[key] = r.price;
    rows[key] = r;
  });

  const m = spyTime && spyTime.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) spyDate = `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  return { prices, rows, spyTime, spyDate, asof, anchors };
}
// Sheet columns at10 / at11 freeze each row as "TICKER|price|volume" the first time the sheet recalculates after

}

async function fetchLive() {

function liveMetrics(T, prices) {

    const ret = (k) => (ix[k] != null && r[ix[k]]) ? p / r[ix[k]] - 1 : null;
    const m = { price: p, today: p / c1 - 1, d3: ret("c3"), d5: ret("c5"), d15: ret("c15"), d20: ret("c20"), d30: ret("c30"),

function liveRating(T, m, r, ix) {

}

  const inp = rows.map(r => {
    const mem = r.members.filter(t => M[t]);

    H.forEach(([n, w]) => { const md = med(mem.map(t => M[t]["d" + n])); const b = bench ? bench["d" + n] : null; if (md != null && b != null) { rel += w * (md - b); ws += w; } });
    const part = mem.length ? (mem.filter(t => M[t].e21 > 0).length + mem.filter(t => M[t].e50 > 0).length) / (2 * mem.length) : null;
    return { rel: ws ? rel / ws : null, part, lead: med(mem.map(t => M[t].rsr)), n: mem.length };
  });
  const pr = { rel: pctRank(inp.map(x => x.rel)), part: pctRank(inp.map(x => x.part)), lead: pctRank(inp.map(x => x.lead)) };
  rows.forEach((r, i) => {
    let s = 100 * (W.rel * pr.rel[i] + W.part * pr.part[i] + W.lead * pr.lead[i]);
    const k = Math.min(1, inp[i].n / 5); s = 50 + (s - 50) * k;
    r.strength = Math.round(s * 10) / 10; r.rel = inp[i].rel; r.part = inp[i].part; r.lead = inp[i].lead;

}

setInterval(() => { if (document.visibilityState === "visible" && (TAB === "premarket" || (TAB === "readout" && roPhase() === "pre"))) fetchPM(); }, 2 * 60 * 1000);

function boxSpark(r) {

  const x0 = x(r.bs), x1 = x(r.be);
  return `<svg class="boxspark" width="${W}" height="${Ht}" viewBox="0 0 ${W} ${Ht}" aria-label="Price with the box marked">
    <rect x="${x0}" y="${y(r.top)}" width="${(x1 - x0).toFixed(1)}" height="${(y(r.bot) - y(r.top)).toFixed(1)}" fill="var(--neutral-mid)" opacity=".7"/>
    <line x1="${x0}" x2="${W - 1}" y1="${y(r.top)}" y2="${y(r.top)}" stroke="var(--good)" stroke-dasharray="3 2" stroke-width="1"/>
    <line x1="${x0}" x2="${x1}" y1="${y(r.bot)}" y2="${y(r.bot)}" stroke="var(--critical)" stroke-dasharray="3 2" stroke-width="1"/>
    <polyline points="${pts}" fill="none" stroke="var(--text-primary)" stroke-width="1.3"/>${r.bo != null && px[r.bo] != null ? `<circle cx="${x(r.bo)}" cy="${y(px[r.bo])}" r="2.5" fill="var(--good)"/>` : ""}</svg>`;

    <div class="note" style="padding:8px 0 0">Every qualifying stock, not just the top 5; each new signal (not on that list in the prior 5 sessions) counts once. ATH Magnet, Pullback and Rotation: buy the close, stop 1 ADR below, sell ${B.hold} sessions later. ${B.exits ? `Qullamaggie Flag: ${B.exits.kq}. Minervini VCP: ${B.exits.vcp} (the backtest uses a 100/150-day template, since only a year of bars is stored).` : ""} R = result ÷ the risk to the stop. <b>Hit high</b> = traded at or above its 52-week high within ${B.hold} sessions (the backtest can't see older all-time highs). <b>+1 ADR</b> = rallied one ADR above entry within ${B.hold} sessions — the move a short-dated option needs. <b>After a thrust</b> = the 25 sessions after a major Breadth thrust or Follow-through (overlaps the regime columns). No commissions, slippage or option pricing; small samples, especially in strong breadth and after thrusts. Past results, not a promise.</div></section>`);
}

/* ---------- Stocks tab ---------- */
function renderStocks(app) {
  if (!DATA.themes) { app.append($('<div class="card empty">Stock data isn\'t available yet. It appears after the next data run.</div>')); return; }
  const T = getT(), U = UI.stocks;
  app.append(liveBar());
  const themesList = T.themes.map(t => t.theme).sort(), subList = (T.subthemes || []).map(t => t.theme).sort();
  const cols = stockCols();
  const card = $(`<section class="card tcard"><div class="head"><h2>Stocks <span class="meta">· ${T.counts.stocks} in your themes</span></h2>
    <div class="filters"></div></div>
    <div class="scroll"><table class="grid"><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="more-row"></div>
    <div class="note">Under each ticker: company · sub-theme · strongest theme.
    <b>RS Rating</b> (1–99): weighted 3/6/9/12-month performance (40/20/20/20) ranked against ~3,000 liquid US stocks; ★ = RS line vs SPY at a 1-year high, ⚑ = that while price is still below its high (strength leading price). RS Δ = change over 5 days.
    <b>Tightness</b>: ADR % = average daily range; Tight = last 5 days' range in ADRs (under 1.5× is a tight coil); Vol dry = 5-day ÷ 50-day volume (under 0.8 is drying up); Off high = distance from the 52-week high. Bold EMA distances are within −3% to +1%.
    3M % and Sheet setup are your sheet's original RS and setup score, kept for comparison.</div></section>`);
  const f = card.querySelector(".filters");
  f.append(chips("RS", [["All", "All"], ["80", "RS 80+"], ["90", "RS 90+"]], U, "tier", () => { U.limit = 100; draw(current()); }));
  f.append(hzChips());
  const sel = $(`<select aria-label="Theme"><option value="">All themes</option>${themesList.map(t => `<option>${esc(t)}</option>`).join("")}</select>`); sel.value = U.theme; f.append(sel);
  const sel2 = $(`<select aria-label="Sub-theme"><option value="">All sub-themes</option>${subList.map(t => `<option>${esc(t)}</option>`).join("")}</select>`); sel2.value = U.sub || ""; f.append(sel2);
  const qi = $('<input type="search" placeholder="Search ticker or name">'); qi.value = U.q; f.append(qi);
  app.append(card);
  const body = card.querySelector("tbody"), moreRow = card.querySelector(".more-row");
  const filtered = () => T.stocks.filter(s => (U.tier === "All" || (s.rsr ?? 0) >= +U.tier) && (!U.theme || s.themes.includes(U.theme))
    && (!U.sub || s.sub === U.sub) && (!U.q || s.t.toLowerCase().startsWith(U.q) || (s.name || "").toLowerCase().includes(U.q)));
  const draw = (rows) => {
    body.innerHTML = rows.slice(0, U.limit).map(s => `<tr>${stockCells(s, "both")}</tr>`).join("");
    moreRow.innerHTML = rows.length > U.limit ? `<button>Show ${Math.min(100, rows.length - U.limit)} more (${rows.length - U.limit} hidden)</button>` : "";
    const b = moreRow.querySelector("button"); if (b) b.addEventListener("click", () => { U.limit += 100; draw(current()); });
  };
  const current = sortable(card.querySelector("table"), cols, filtered, draw, U.sort);
  sel.addEventListener("change", (e) => { U.theme = e.target.value; U.limit = 100; draw(current()); });
  sel2.addEventListener("change", (e) => { U.sub = e.target.value; U.limit = 100; draw(current()); });
  qi.addEventListener("input", (e) => { U.q = e.target.value.trim().toLowerCase(); U.limit = 100; draw(current()); });
  draw(current());
}

/* =================== TradingView export =================== */
// Sections in priority order. TradingView keeps a symbol once per list, so a
// ticker that qualifies for several sections appears in the first one only.
const EXPORT_DEFS = [
  { id: "strongest", on: true, label: "Top 10 stocks · any theme", why: "The 10 strongest stocks in the whole market, in a theme or not (Leaders → Any theme)",
    get: (T, L) => (L.strongest || []).slice(0, 10).map(r => r.t) },
  { id: "bursts", on: true, label: "Momentum bursts · 2LYNCH 5+", why: "Today's 4% breakouts meeting 5+ of the 2LYNCH checks (whole market)",
    get: (T, L) => L.bursts.filter(r => r.lynch >= 5).map(r => r.t) },
  { id: "ant", on: true, label: "Anticipation · tight coils", why: "Tight, quiet coils in RS 85+ leaders near highs (whole market)",
    get: (T, L) => L.anticipation.map(r => r.t) },
  { id: "lead", on: true, label: "RS line ahead of price ⚑", why: "RS line vs SPY made a 1-year high in the last 5 days while price is still 3%+ below its own high",
    get: (T) => byRS(T.stocks.filter(s => s.rs_lead)) },
  { id: "star", on: true, label: "RS line new high ★", why: "RS line vs SPY at a 1-year high",
    get: (T) => byRS(T.stocks.filter(s => s.rs_nh)) },
  { id: "rs99", on: true, label: "RS Rating 99", why: "Top 1% of the market on 3–12 month performance",
    get: (T) => byRS(T.stocks.filter(s => (s.rsr ?? 0) >= 99)) },
  { id: "risers", on: true, label: "Fast risers · RS +15 in 5 days", why: "Biggest RS Rating gains this week (RS 60+), up to 30",
    get: (T) => T.stocks.filter(s => (s.rsr5 ?? 0) >= 15 && (s.rsr ?? 0) >= 60).sort((a, b) => b.rsr5 - a.rsr5).slice(0, 30).map(s => s.t) },
  { id: "top_themes", on: true, label: "Top 2 themes", why: "Members of the two strongest themes, strongest RS first", multi: true,
    get: (T) => rankedGroups(T.themes).slice(0, 2).map(g => ["Top theme · " + g.theme, byRS(members(T, g))]) },
  { id: "top_subs", on: true, label: "Top 3 sub-themes (new names)", why: "The three strongest peer groups not already covered by the sections above", multi: true,
    get: (T, L, seen) => rankedGroups(T.subthemes || []).filter(g => g.members.filter(t => !seen.has(t)).length >= Math.max(2, g.members.length / 2))
      .slice(0, 3).map(g => ["Top sub-theme · " + g.theme, byRS(members(T, g))]) },
  { id: "bottom_themes", on: true, label: "Bottom 2 themes (short watch)", why: "Members of the two weakest themes, weakest RS first", multi: true,
    get: (T) => rankedGroups(T.themes).slice(-2).reverse().map(g => ["Bottom theme · " + g.theme, byRS(members(T, g)).reverse()]) },
  { id: "eps", on: false, label: "Episodic pivots (watch only)", why: "Big gaps on heavy volume in the last 5 sessions; check the catalyst first",
    get: (T, L) => L.eps.map(r => r.t) },
];
const byRS = (list) => list.slice().sort((a, b) => (b.rsr ?? -1) - (a.rsr ?? -1)).map(s => s.t);
const rankedGroups = (rows) => rows.slice().filter(g => g.n >= 3).sort((a, b) => (a.s_rank ?? a.rank) - (b.s_rank ?? b.rank));
const members = (T, g) => { const M = stockMap(); return g.members.map(t => M[t]).filter(Boolean); };
const EXPORT_ON = Object.fromEntries(EXPORT_DEFS.map(d => [d.id, d.on]));

function buildExport() {
  const T = getT(), L = DATA.themes.lists || { bursts: [], anticipation: [], eps: [] }, tv = DATA.themes.tv || {};
  const seen = new Set(), sections = [];
  let dupes = 0;
  EXPORT_DEFS.forEach(d => {
    if (!EXPORT_ON[d.id]) return;
    const parts = d.multi ? d.get(T, L, seen) : [[d.label, d.get(T, L, seen)]];
    parts.forEach(([name, ticks]) => {
      const keep = [];
      ticks.forEach(t => { if (!t) return; if (seen.has(t)) { dupes++; return; } seen.add(t); keep.push(t); });
      if (keep.length) sections.push({ id: d.id, name, ticks: keep });
    });
  });
  const clean = (s) => s.replace(/[,#\n]/g, " ").replace(/\s+/g, " ").trim();
  const text = sections.map(s => ["###" + clean(s.name), ...s.ticks.map(t => tv[t] || t)].join(",")).join(",");
  return { text, sections, total: seen.size, dupes };
}

function openExport() {
  const old = document.querySelector(".xmodal"); if (old) old.remove();
  const asOf = longDate(getT().date) + (LIVE_T ? " (live prices)" : " close");
  const m = $(`<div class="xmodal" role="dialog" aria-modal="true" aria-label="Export to TradingView"><div class="card xbox">
    <div class="xhead"><h2>Export to TradingView</h2><button class="xclose" aria-label="Close">✕</button></div>
    <p class="meta">A .txt watchlist with one section per group, as of ${asOf}. In TradingView: open the watchlist menu → <b>Upload list…</b> → choose the file.</p>
    <div class="xlist"></div>
    <div class="xsum meta"></div>
    <textarea class="xprev" readonly rows="4" aria-label="Preview"></textarea>
    <div class="xbtns"><button class="xdl primary">Download .txt</button><button class="xcopy">Copy to clipboard</button></div></div></div>`);
  const list = m.querySelector(".xlist");
  const refresh = () => {
    const ex = buildExport();
    const counts = Object.fromEntries(ex.sections.map(s => [s.name, s.ticks.length]));
    list.querySelectorAll("[data-count]").forEach(el => {
      const d = EXPORT_DEFS.find(x => x.id === el.dataset.count);
      if (!EXPORT_ON[d.id]) { el.textContent = "off"; return; }
      const names = ex.sections.filter(s => s.id === d.id);
      el.textContent = names.length ? names.map(s => `${s.ticks.length}`).join(" + ") + " tickers" : "none today";
      const sub = el.parentElement.querySelector(".xgroups");
      if (sub) sub.textContent = d.multi ? names.map(s => s.name.split(" · ")[1]).join(" · ") : "";
    });
    m.querySelector(".xsum").textContent = `${ex.total} tickers in ${ex.sections.length} sections${ex.dupes ? ` · ${ex.dupes} repeats left in their first section only` : ""}`;
    m.querySelector(".xprev").value = ex.text;
    return ex;
  };
  EXPORT_DEFS.forEach(d => {
    const row = $(`<label class="xrow"><input type="checkbox" ${EXPORT_ON[d.id] ? "checked" : ""}><span><b>${d.label}</b><small>${d.why}</small><small class="xgroups"></small></span><span class="xcount meta" data-count="${d.id}"></span></label>`);
    row.querySelector("input").addEventListener("change", (e) => { EXPORT_ON[d.id] = e.target.checked; refresh(); });
    list.append(row);
  });
  const fname = () => `breadth-watchlist-${getT().date}.txt`;
  m.querySelector(".xdl").addEventListener("click", () => {
    const blob = new Blob([refresh().text], { type: "text/plain" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fname();
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  m.querySelector(".xcopy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(refresh().text); e.target.textContent = "Copied"; }
    catch (err) { m.querySelector(".xprev").select(); e.target.textContent = "Press Ctrl+C"; }
    setTimeout(() => { e.target.textContent = "Copy to clipboard"; }, 1500);
  });
  const close = () => m.remove();
  m.querySelector(".xclose").addEventListener("click", close);
  m.addEventListener("click", (e) => { if (e.target === m) close(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  document.body.append(m);
  refresh();
}

/* =================== KQ watchlist export =================== */
// Three sections from the daily KQ screen (breadth/kq.py). Screen proxies only:
// every name still needs a full chart grade before it is traded.
const KQ_DEFS = [
  { id: "basing", on: true, label: "KQ Basing - watch for trigger", why: "Passes the screen and is still coiling near the rising 10/20, tightest range first" },
  { id: "extended", on: true, label: "KQ Extended - wait for handle", why: "Already 1.5+ ATR above the 20-day: needs a sideways handle before an entry, closest to ready first" },
  { id: "reject", on: true, label: "KQ Not this setup or failing a rule", why: "News/volume event, flat 20-day MA (rule 3) or loose, choppy base (rule 5). For study, not entries" },
];
const KQ_ON = Object.fromEntries(KQ_DEFS.map(d => [d.id, d.on]));

function buildKQ() {
  const K = DATA.kq, tv = K.tv || {};
  const sections = KQ_DEFS.filter(d => KQ_ON[d.id] && (K[d.id] || []).length).map(d => ({ id: d.id, name: d.label, ticks: K[d.id].map(r => r.t) }));
  const clean = (s) => s.replace(/[,#\n]/g, " ").replace(/\s+/g, " ").trim();
  const text = sections.map(s => ["###" + clean(s.name), ...s.ticks.map(t => tv[t] || t)].join(",")).join(",");
  return { text, sections, total: sections.reduce((n, s) => n + s.ticks.length, 0) };
}

function openKQ() {
  const old = document.querySelector(".xmodal"); if (old) old.remove();
  const K = DATA.kq, c = K.cfg;
  const m = $(`<div class="xmodal" role="dialog" aria-modal="true" aria-label="KQ watchlist"><div class="card xbox">
    <div class="xhead"><h2>KQ breakout watchlist</h2><button class="xclose" aria-label="Close">✕</button></div>
    <p class="meta">Screen for Kristjan's basic breakout as of the ${longDate(K.date)} close: ${K.candidates} of ${fmt(K.screened)} stocks pass
      (ADR ≥ ${c.min_adr}%, $${c.min_dvol / 1e6}M+ a day, top ${100 - c.top_pct}% over 1/3/6 months, above a rising 20 over the 50, a ${c.min_leg * 100}%+ leg in ${c.leg_days} days, ≤ ${-c.max_off * 100}% off the high).
      In TradingView: watchlist menu → <b>Upload list…</b> → choose the file.</p>
    <div class="xlist"></div>
    <div class="xsum meta"></div>
    <textarea class="xprev" readonly rows="4" aria-label="Preview"></textarea>
    <div class="xbtns"><button class="xdl primary">Download .txt</button><button class="xcopy">Copy to clipboard</button></div>
    <p class="kqnote">A screen, not a grade. End-of-day data only; earnings dates are not checked. Send each chart for a full grade before trading it.</p></div></div>`);
  const list = m.querySelector(".xlist");
  const refresh = () => {
    const ex = buildKQ();
    list.querySelectorAll("[data-count]").forEach(el => {

    });
    m.querySelector(".xsum").textContent = `${ex.total} tickers in ${ex.sections.length} sections`;
    m.querySelector(".xprev").value = ex.text;
    return ex;
  };
  const num = (v, suf = "") => v == null ? "–" : `${v}${suf}`;
  KQ_DEFS.forEach(d => {
    const rows = K[d.id] || [];
    const wrap = $(`<div><label class="xrow"><input type="checkbox" ${KQ_ON[d.id] ? "checked" : ""}><span><b>${d.label}</b><small>${d.why}</small></span><span class="xcount meta" data-count="${d.id}"></span></label></div>`);
    wrap.querySelector("input").addEventListener("change", (e) => { KQ_ON[d.id] = e.target.checked; refresh(); });
    if (rows.length) {
      const det = $(`<details class="kqsec"><summary>Show the ${rows.length} names</summary><table class="kqtab"><thead><tr><th>Ticker</th><th>Why</th><th class="n">ADR</th><th class="n">$M/day</th><th class="n">Off high</th></tr></thead><tbody></tbody></table></details>`);
      const tb = det.querySelector("tbody");
      rows.forEach(r => { const tr = document.createElement("tr");
        tr.innerHTML = `<td class="t"></td><td class="w"></td><td class="n">${num(r.adr, "%")}</td><td class="n">${num(r.dvol)}</td><td class="n">${num(r.off, "%")}</td>`;
        tr.querySelector(".t").textContent = r.t; tr.querySelector(".t").title = r.name || "";
        tr.querySelector(".w").textContent = r.why; tb.append(tr); });
      wrap.append(det);
    }
    list.append(wrap);
  });
  m.querySelector(".xdl").addEventListener("click", () => {
    const blob = new Blob([refresh().text], { type: "text/plain" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `kq-watchlist-${K.date}.txt`;
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  });
  m.querySelector(".xcopy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(refresh().text); e.target.textContent = "Copied"; }
    catch (err) { m.querySelector(".xprev").select(); e.target.textContent = "Press Ctrl+C"; }
    setTimeout(() => { e.target.textContent = "Copy to clipboard"; }, 1500);
  });
  const close = () => m.remove();
  m.querySelector(".xclose").addEventListener("click", close);
  m.addEventListener("click", (e) => { if (e.target === m) close(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  document.body.append(m);
  refresh();
}
