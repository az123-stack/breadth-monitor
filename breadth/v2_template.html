<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Market Monitor v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: sticky bar = main tabs, second row = sub-tabs of the open tab; one page per sub-tab. Phones: main tabs in a bottom bar, sub-tabs scroll sideways. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --sunk:#eaeef3; --line:#d9dfe7; --line-2:#c3ccd8;
  --ink:#121820; --ink-2:#47525f; --ink-3:#717d8b;
  --accent:#2448c8; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --up:#16804a; --up-soft:#dff2e7; --dn:#c0352b; --dn-soft:#fbe5e2; --warn:#a46200; --warn-soft:#fbefd9;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --panel:#141a22; --sunk:#1b232d; --line:#26303c; --line-2:#36424f;
  --ink:#e6ebf1; --ink-2:#a6b1bd; --ink-3:#7b8794;
  --accent:#7d9bff; --accent-ink:#0d1117; --accent-soft:#1c2747;
  --up:#3fbf7a; --up-soft:#12301f; --dn:#ef6b5e; --dn-soft:#3a1916; --warn:#e5a33a; --warn-soft:#3a2a0f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#141a22; --sunk:#1b232d; --line:#26303c; --line-2:#36424f;
  --ink:#e6ebf1; --ink-2:#a6b1bd; --ink-3:#7b8794;
  --accent:#7d9bff; --accent-ink:#0d1117; --accent-soft:#1c2747;
  --up:#3fbf7a; --up-soft:#12301f; --dn:#ef6b5e; --dn-soft:#3a1916; --warn:#e5a33a; --warn-soft:#3a2a0f;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.up{color:var(--up)} .dn{color:var(--dn)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header: main tabs + sub-tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .top{display:flex;align-items:center;gap:20px;height:52px}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 12px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;font-weight:500}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink-3);min-width:180px}
.search input{border:0;background:transparent;outline:0;color:var(--ink);font:inherit;width:100%}
.mode{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);white-space:nowrap;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.iconbtn{height:32px;min-width:32px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.subnav{border-top:1px solid var(--line);background:var(--bg)}
.subnav .wrap{display:flex;gap:4px;height:42px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{flex:none;padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.subnav a:hover{background:var(--sunk);color:var(--ink)}
.subnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.subnav .ev{margin-left:auto;flex:none}

main{padding-block:20px 100px;min-height:70vh}
.page-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 14px}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.page-h p{margin:0;color:var(--ink-3);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h3{font-size:15px;font-weight:600;margin:0}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.5}
.ev-proven{background:var(--accent);color:var(--accent-ink)}
.ev-info{border:1px solid var(--line-2);color:var(--ink-2)}
.ev-unproven{border:1px dashed var(--line-2);color:var(--ink-3)}
.ev-noedge{background:var(--sunk);color:var(--ink-3);text-decoration:line-through}
.v-focus{background:var(--up-soft);color:var(--up)}
.v-selective{background:var(--warn-soft);color:var(--warn)}
.v-avoid{background:var(--dn-soft);color:var(--dn)}
.st{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-blossom{background:var(--up-soft);color:var(--up)}
.st-ignition,.st-first{background:var(--warn-soft);color:var(--warn)}
.st-build{background:var(--accent-soft);color:var(--accent)}
.st-fading{background:var(--dn-soft);color:var(--dn)}
.st-other{background:var(--sunk);color:var(--ink-3)}
.star{color:#d99a00}

/* posture */
.posture{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.posture .call{padding:18px 20px;border-left:5px solid var(--up)}
.eyebrow{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.posture h2{font-size:28px;line-height:1.15;margin:6px 0;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.posture p{margin:0;color:var(--ink-2);max-width:60ch}
.meter{display:flex;gap:3px;margin-top:14px}
.meter b{flex:1;height:6px;border-radius:2px;background:var(--sunk)} .meter b.on{background:var(--up)}
.meter-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.posture .play{padding:16px 20px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.play h4,.mini-h{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.today{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;font-size:11.5px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);line-height:1.25;vertical-align:bottom}
th small{display:block;font-size:10.5px;font-weight:400}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
th[aria-sort="descending"]::after{content:" ↓"} th[aria-sort="ascending"]::after{content:" ↑"}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:hover>td{background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
th.n{font-family:var(--ui)}
.tk{font-family:var(--num);font-weight:500;font-size:13.5px;color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--line-2)}
.tk:hover{color:var(--accent);border-color:var(--accent)}
.cell2{display:flex;flex-direction:column;line-height:1.3}
.cell2 small{color:var(--ink-3);font-size:11.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-go{color:var(--up)} .s-zone{color:var(--warn)} .s-wait{color:var(--ink-3)}
.dist{font-size:11.5px;color:var(--ink-3)}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
.sticky1 tbody tr:hover>td:first-child{background:var(--sunk)}

/* themes table */
.gname{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gsub{font-size:11.5px;color:var(--ink-3)}
.tag{font-size:11px;font-weight:500;padding:0 7px;border-radius:999px;white-space:nowrap}
.tag-step{background:var(--up-soft);color:var(--up)} .tag-set{background:var(--accent-soft);color:var(--accent)}
.sbar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin-right:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent)}
.sc{display:inline-flex;align-items:center;gap:5px}
.sc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sc.hi::before{background:var(--up)} .sc.mid::before{background:var(--warn)} .sc.lo::before{background:var(--dn)}
.trail{display:block;width:120px;height:22px}
.heat{font-family:var(--num);text-align:right}
.mv-up{color:var(--up)} .mv-dn{color:var(--dn)}
tr.grp{cursor:pointer}
tr.grp.open>td{background:var(--sunk)}
tr.drawer>td{padding:0;background:var(--bg)}
.drawer-in{padding:12px 14px 14px 28px;border-left:3px solid var(--accent)}
.drawer-in table{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.caret{display:inline-block;width:12px;color:var(--ink-3);transition:transform .12s}
tr.open .caret{transform:rotate(90deg)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--num);font-size:11px;opacity:.75;margin-left:4px}
.fsel{height:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:0 8px;font:inherit;font-size:13px;max-width:280px}
.fsearch{height:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:13px;width:180px}
.btn{height:30px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{font-size:12.5px;color:var(--up);min-height:1em}
.ck{width:16px;height:16px;accent-color:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--ink-3)}
.tile .v{font-family:var(--num);font-size:21px;font-weight:500;letter-spacing:-.02em}
.tile .c{font-size:12px;color:var(--ink-2)}
.tile svg{width:100%;height:34px;margin-top:4px;display:block}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.grow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmeta{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.more{padding:10px 14px;font-size:12.5px;color:var(--ink-2)}

/* planned pages */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.plan .panel{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.plan h4{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan p{margin:0;color:var(--ink-2);font-size:13px}
.plan .from{font-size:12px;color:var(--ink-3)}
.notice{border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;color:var(--ink-2);font-size:13px;margin-bottom:14px}

/* article */
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px clamp(18px,4vw,48px) 36px}
.kicker{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap}
.paper h2{font-family:var(--read);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.12;letter-spacing:-.015em;margin:10px 0 8px;text-wrap:balance}
.byline{font-size:12.5px;color:var(--ink-3);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.prose{font-family:var(--read);font-size:18px;line-height:1.62;max-width:66ch}
.prose p{margin:0 0 1em} .prose ul{margin:0 0 1em;padding-left:1.2em} .prose li{margin-bottom:.5em} .prose strong{font-weight:600}
.aside{display:flex;flex-direction:column;gap:12px} .aside .panel{padding:14px}

/* shared page pieces */
.gate{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:14px}
.gate b{font-size:15px}
.gate.go{border-left:4px solid var(--up);border-radius:0 8px 8px 0} .gate.wait{border-left:4px solid var(--warn);border-radius:0 8px 8px 0} .gate.warn{border-left:4px solid var(--dn);border-radius:0 8px 8px 0}
.evline{font-size:12.5px;color:var(--ink-2)}
.sect{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sect h2{font-size:15px;font-weight:600;margin:0}
.sect span{font-size:12.5px;color:var(--ink-3)}
.checks{display:inline-flex;gap:3px;vertical-align:middle}
.checks i{width:10px;height:10px;border-radius:2px;background:var(--sunk);border:1px solid var(--line-2)}
.checks i.on{background:var(--up);border-color:var(--up)}
.mini{display:inline-flex;gap:4px;flex-wrap:wrap}
.mini span{font-family:var(--num);font-size:11.5px;padding:0 5px;border-radius:3px;background:var(--sunk);color:var(--ink-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-3);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:5px}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-bottom:14px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pick .tkr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.pick .tkr b{font-family:var(--num);font-size:20px}
.pick p{margin:0;font-size:12.5px;color:var(--ink-2)}
.pick .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.pick .kv span:nth-child(odd){color:var(--ink-3)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--ui);font-size:11px;fill:var(--ink-3)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.cbox{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.cbox h3{margin:0 0 2px;font-size:14px;font-weight:600}
.cbox .sub{font-size:12px;color:var(--ink-3);margin-bottom:6px}
.evlist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.evlist li{font-size:13px;display:flex;gap:10px;align-items:baseline}
.evlist .d{font-family:var(--num);font-size:12px;color:var(--ink-3);min-width:56px}
.mtile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mtile .v{font-family:var(--num);font-size:20px;font-weight:500}
.mtile .chg{display:flex;gap:10px;font-family:var(--num);font-size:12px}
.hm td{padding:0;border:0;height:16px}
.hm td.nm{padding:0 8px 0 0;font-size:12px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;background:var(--panel)}
.hm td.c{width:7px;min-width:7px}

.tabbar{display:none}
@media (max-width:900px){
  .nav,.search,.hide-sm,.brand .muted,.xs-hide{display:none}
  .bar .top{gap:10px}
  .posture,.today,.article{grid-template-columns:minmax(0,1fr)}
  .posture h2{font-size:23px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{flex:1;text-align:center;padding:8px 0 7px;font-size:11px;color:var(--ink-3);text-decoration:none;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar a span{display:block;font-size:17px;line-height:1.15}
  .prose{font-size:17px}
  .fsearch{width:100%}
  .subnav .ev{display:none}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
</style>
</head>
<body>

<header class="bar">
  <div class="wrap top">
    <div class="brand"><i aria-hidden="true"></i>Market Monitor <span class="muted" style="font-weight:400">v2</span></div>
    <nav class="nav" id="nav" aria-label="Main tabs"></nav>
    <div class="bar-right">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="Ticker or group" aria-label="Find a ticker or group"></label>
      <div class="mode" title="Where the numbers come from"><span class="dot" id="modeDot"></span><span id="modeText"></span></div>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">◐ <span id="themeLbl">Auto</span></button>
    </div>
  </div>
  <div class="subnav"><div class="wrap" id="subnav"></div></div>
</header>

<main class="wrap" id="main"></main>

<nav class="tabbar" id="tabbar" aria-label="Main tabs"></nav>

<script>
const S = /*__DATA__*/null || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f2 = x => x == null ? "–" : Number(x).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct = (x,d=1) => x == null ? "–" : (x>0?"+":"") + Number(x).toFixed(d) + "%";
const day = d => new Date(d+"T12:00:00").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- site map: main tabs -> sub-tabs ---------- */
const MAP = [
  {id:"today", name:"Today", icon:"◉", subs:[{id:"today", name:"Today", ev:"proven", render:pageToday}]},
  {id:"market", name:"Market", icon:"∿", subs:[
    {id:"market-breadth", name:"Breadth", ev:"proven", render:pageBreadth},
    {id:"market-money", name:"Money flow", ev:"info", render:pageMoney},
    {id:"market-macro", name:"Macro", ev:"info", render:pageMacro},
    {id:"market-live", name:"Pre-market & live", ev:"info", plan:[
      ["Futures and gappers","Pre-market futures, gap breadth, gappers, possible EPs.","Pre-market tab","info"],
      ["Who's moving the index","S&P / Nasdaq / Russell contribution by stock, sector and sub-theme.","Pre-market, Intraday","info"],
      ["In play and late movers","Relative volume, gap-and-go vs fading, second-half movers.","Intraday tab","info"]]}]},
  {id:"groups", name:"Groups", icon:"▦", subs:[
    {id:"groups-themes", name:"Themes", ev:"proven", render:pageThemes},
    {id:"groups-lifecycle", name:"Lifecycle", ev:"proven", render:pageLife},
    {id:"groups-lighting", name:"Lighting up", ev:"proven", render:pageLighting},
    {id:"groups-stairs", name:"Stair steps", ev:"info", render:pageStairs},
    {id:"groups-rotation", name:"Rotation", ev:"proven", render:pageRotation},
    {id:"groups-timeline", name:"Timeline", ev:"info", render:pageTimeline}]},
  {id:"setups", name:"Setups", icon:"☰", subs:[
    {id:"setups-all", name:"All setups", ev:"proven", render:pageSetups},
    {id:"setups-launch", name:"Launch list", ev:"proven", render:pageLaunch},
    {id:"setups-box", name:"Box trades", ev:"proven", render:pageBox},
    {id:"setups-dips", name:"Lined-up & dips", ev:"proven", render:pageDips},
    {id:"setups-sow", name:"Strength on weakness", ev:"info", render:pageSow},
    {id:"setups-hve", name:"Record volume", ev:"info", render:pageHve},
    {id:"setups-export", name:"Export lists", ev:"proven", plan:[
      ["TradingView lists","Build one list from any setups, groups or picks, then copy or download in TradingView format.","Header buttons","proven"],
      ["KQ breakout screen","Basing, extended, failing.","Header button","info"]]}]},
  {id:"read", name:"Read", icon:"¶", subs:[
    {id:"read-latest", name:"Latest", ev:"info", render:pageRead},
    {id:"read-stories", name:"Trade stories", ev:"info", plan:[
      ["Open storylines","Up to 6 developing stories with timeline, thesis, groups and catalysts.","Trade Stories tab","info"]]},
    {id:"read-earnings", name:"Earnings", ev:"info", plan:[
      ["Earnings clusters","Reports that together point to a theme, and the members yet to report.","Trade Stories tab","info"]]},
    {id:"read-archive", name:"Archive", ev:"info", plan:[
      ["Every chapter","Morning, data and after-the-close chapters, each on its own page.","New","info"]]}]},
  {id:"lab", name:"Lab", icon:"⚗", subs:[
    {id:"lab-experiments", name:"Experiments", ev:"unproven", plan:[
      ["Washout thrust","High-beta leaders after deep washouts. Only 2 cases.","Breadth tab","unproven"],
      ["Volume tilt, hidden buying","Context reads with some forward signal, not proven.","Breadth tab","info"],
      ["Long / short pulse","The old sheet's 0–10 scores. Today it says Caution while the proven posture says Press, which is why it moves here.","Themes tab","unproven"],
      ["Who won the close, market health","Tested: no forward edge found.","Breadth tab","noedge"]]},
    {id:"lab-evidence", name:"Evidence", ev:"proven", plan:[
      ["Layer registry","Every layer and where it sits: idea, tested, info, proven, approved, live.","New","proven"]]},
    {id:"lab-research", name:"Research log", ev:"info", plan:[
      ["Finding cards","Every study, including the ones that failed.","New","info"],
      ["Integrator plan","Saturday's ranked list of what to build next.","Decision cards (retired)","info"]]}]},
];
const EVL = {proven:"Proven", info:"Info", unproven:"Unproven", noedge:"No edge"};
const evb = k => `<span class="badge ev-${k}">${EVL[k]}</span>`;
const ALL_SUBS = MAP.flatMap(m => m.subs.map(s => ({...s, main:m})));
const lastSub = LS.get("v2sub", {});

function route(){
  const h = location.hash.slice(1);
  let sub = ALL_SUBS.find(s => s.id === h);
  if (!sub){ const m = MAP.find(m => m.id === h) || MAP[0]; const want = lastSub[m.id]; sub = ALL_SUBS.find(s => s.main === m && s.id === want) || ALL_SUBS.find(s => s.main === m); }
  lastSub[sub.main.id] = sub.id; LS.set("v2sub", lastSub);
  const link = m => `#${lastSub[m.id] || m.subs[0].id}`;
  $("#nav").innerHTML = MAP.map(m => `<a href="${link(m)}" ${m===sub.main?'aria-current="page"':""}>${m.name}</a>`).join("");
  $("#tabbar").innerHTML = MAP.map(m => `<a href="${link(m)}" ${m===sub.main?'aria-current="page"':""}><span aria-hidden="true">${m.icon}</span>${m.name}</a>`).join("");
  $("#subnav").innerHTML = sub.main.subs.length > 1
    ? sub.main.subs.map(s => `<a href="#${s.id}" ${s===sub?'aria-current="page"':""}>${s.name}</a>`).join("") + `<span class="ev">${evb(sub.ev)}</span>`
    : `<span class="muted" style="font-size:13px">Posture, your trades and the groups to focus on, in one screen</span><span class="ev">${evb("proven")}</span>`;
  const main = $("#main");
  if (sub.render){
    try { sub.render(main); }
    catch (e) { console.error(e); main.innerHTML = `<div class="page-h"><h1>${esc(sub.name)}</h1></div><div class="notice">This page appears after the next data run (its data isn't in today's build). The other pages still work.</div>`; }
  } else pagePlanned(main, sub);
  document.title = `${sub.name === sub.main.name ? sub.name : sub.main.name + " · " + sub.name} · Market Monitor v2`;
  window.scrollTo(0,0);
}
addEventListener("hashchange", route);

/* theme + clock mode */
const THEMES = ["auto","light","dark"]; let theme = LS.get("v2theme","auto");
function applyTheme(){ theme==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",theme); $("#themeLbl").textContent = theme[0].toUpperCase()+theme.slice(1); }
$("#themeBtn").onclick = () => { theme = THEMES[(THEMES.indexOf(theme)+1)%3]; LS.set("v2theme",theme); applyTheme(); };
applyTheme();
$("#modeText").innerHTML = `Close<span class="xs-hide"> · ${day(S.asof)}</span>`;

/* ---------- shared bits ---------- */
function spark(vals, color){
  const v = vals.filter(x=>x!=null), lo=Math.min(...v), hi=Math.max(...v), W=160, H=34, n=vals.length;
  const X=i=>(i/(n-1))*W, Y=x=>H-3-((x-lo)/((hi-lo)||1))*(H-6);
  const pts = vals.map((x,i)=>x==null?null:[X(i),Y(x)]).filter(Boolean);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(""); const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]} ${H} L0 ${H} Z" fill="${color}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}
const stCls = s => ({"Blossom":"st-blossom","Ignition":"st-ignition","First push":"st-first","Quiet build":"st-build","Fading":"st-fading"}[s]||"st-other");
const vb = v => `badge v-${v.toLowerCase()}`;
function copyTv(text, out, name){
  const n = text.split(",").filter(x=>x && !x.startsWith("###")).length;
  const done = msg => { if (out){ out.textContent = msg; setTimeout(()=>out.textContent="", 4000); } };
  let saved = false;
  try {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
    a.download = (name || "market-monitor").replace(/[^a-z0-9]+/gi,"-").toLowerCase() + "-" + (S.asof||"") + ".txt";
    document.body.appendChild(a); a.click(); a.remove(); saved = true;
  } catch (e) {}
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>done(`${saved?"Downloaded":"Copied"} ${n} tickers for TradingView${saved?" (also copied)":""}`), ()=>done(saved?`Downloaded ${n} tickers for TradingView`:"Couldn't copy here"));
  else done(saved?`Downloaded ${n} tickers for TradingView`:"Couldn't copy here");
}
const tvList = sections => sections.filter(s=>s[1].length).map(([name,ts])=>["###"+name.replace(/[,#]/g," "), ...ts.map(t=>S.tv[t]||tvGuess(t))].join(",")).join(",");
const tvGuess = t => t; /* sample: exchange map only covers listed names; the live page has the full map */
function heatBg(x, scale){ if (x==null) return ""; const a = Math.min(Math.abs(x)/scale,1)*38; return `background:color-mix(in srgb, var(${x>=0?"--up":"--dn"}) ${a.toFixed(0)}%, transparent)`; }

/* ---------- planned page ---------- */
function pagePlanned(el, sub){
  el.innerHTML = `<div class="page-h"><h1>${esc(sub.main.name)} · ${esc(sub.name)}</h1><p>This page is built in a later step. Here is what will live on it.</p></div>
    <div class="plan">${sub.plan.map(([t,d,from,ev])=>`<div class="panel"><h4>${esc(t)} ${evb(ev)}</h4><p>${esc(d)}</p><span class="from">Today in v1: ${esc(from)}</span></div>`).join("")}</div>`;
}

/* ---------- Today ---------- */
function stopFromText(s){ const m = s.match(/\$([\d,.]+)/); return m ? +m[1].replace(/,/g,"") : null; }
function pageToday(el){
  const pb = S.playbook, WIN = 25, L = S.last, B = S.breadth, post = pb.state === "thrust" && pb.since != null;
  const TONE = {thrust:"--up", strong:"--up", mixed:"--warn", weak:"--dn"}[pb.state] || "--ink-3";
  const LOC = {at9:"At the 9-week EMA", near:"Near the 9-week EMA", up:"Up off the 9-week EMA", far:"Extended"};
  const trades = [
    ...(S.picks||[]).map(p => ({t:p.t, why:`Launch ${p.grade} · ${p.stage}`, sub:p.sub, last:p.price, trig:null, stop:stopFromText(p.stop), st:p.loc==="at9"?"zone":"wait", stTxt:LOC[p.loc]||p.loc})),
    ...(S.lined||[]).slice(0,5).map(x => { const trig=x.hi, stop=Math.max(x.lo, trig*(1-x.adr/100)), go=x.c>trig;
      return {t:x.t, why:"Lined-up · BUY group", sub:x.g, last:x.c, trig, stop, st:go?"go":(x.t3?"zone":"wait"), stTxt:go?"Over trigger":(x.t3?"Dipped into 9/21":"Near the ribbon"), earn:x.earn}; })];
  const buys = (S.groups||[]).filter(g=>g.buy), watch = (S.groups||[]).filter(g=>g.watch);
  const th = S.thresholds || {}, t21 = L.t2108;
  const t21c = t21 == null ? "" : t21 <= (th.oversold ?? 20) ? "oversold zone" : t21 >= (th.overbought ?? 70) ? "overbought zone" : "middle of its range";
  const tr = S.trade || {}, trc = tr.state ? `${tr.above ?? "–"} sessions · ${tr.state}` : "";
  el.innerHTML = `
  <div class="posture"><div class="call" style="border-left-color:var(${TONE})">
      <div class="eyebrow">${evb("proven")}<span>Posture · from backtested layers only · ${day(S.asof)} close</span></div>
      <h2>${post ? `Press: post-thrust window, day ${pb.since} of ${WIN}` : esc(pb.label)}</h2>
      <p>${esc(pb.advice)}${S.lc_size ? ` Lined-up buys at ${esc(S.lc_size)} size.` : ""}</p>
      ${post ? `<div class="meter" aria-hidden="true">${Array.from({length:WIN},(_,i)=>`<b class="${i<pb.since?"on":""}"></b>`).join("")}</div>
      <div class="meter-l"><span>Thrust</span><span>${WIN-pb.since} sessions left</span><span>Window ends</span></div>` : ""}</div>
    <div class="play">${["Focus","Selective","Avoid"].map(v=>`<div><h4>${v}</h4><div class="plist">${pb.rows.filter(r=>r.verdict===v).map(r=>`<span class="${vb(v)}">${esc(r.name)} <span class="num" style="opacity:.8">${r.r>0?"+":""}${r.r.toFixed(2)}R</span></span>`).join("")||'<span class="muted">None</span>'}</div></div>`).join("")}</div></div>
  <div class="today"><div class="stack">
    <div class="panel"><div class="ph"><h3>Your trades today</h3><span class="sub">Launch picks + lined-up buys</span><span class="right"><span class="toast" id="tToast"></span><button class="btn" id="tCopy">⬇ TradingView</button></span></div>
      <div class="tw"><table class="sticky1"><thead><tr><th>Ticker</th><th>Why</th><th class="n">Last</th><th class="n">Trigger</th><th class="n">Stop</th><th>Status</th></tr></thead><tbody>
      ${trades.length?"":'<tr><td colspan="6" class="muted" style="padding:16px 14px;white-space:normal">No launch picks or lined-up buys today.</td></tr>'}${trades.map(r=>`<tr><td><a class="tk" href="#">${r.t}</a></td>
        <td><div class="cell2"><span>${esc(r.why)}${r.earn?` <span class="badge v-selective">Earnings ${esc(r.earn.slice(5))}</span>`:""}</span><small>${esc(r.sub)}</small></div></td>
        <td class="n">${f2(r.last)}</td>
        <td class="n">${r.trig?f2(r.trig)+`<div class="dist">${pct((r.trig/r.last-1)*100)}</div>`:'<span class="muted" style="font-family:var(--ui);font-size:12px">Flag break</span>'}</td>
        <td class="n">${r.stop?f2(r.stop)+`<div class="dist">${pct((r.stop/r.last-1)*100)}</div>`:"–"}</td>
        <td><span class="status s-${r.st}">${esc(r.stTxt)}</span></td></tr>`).join("")}</tbody></table></div></div>
    <div class="tiles">
      <div class="tile"><span class="l">Up 4% / down 4%</span><span class="v">${L.up4} / ${L.dn4}</span><span class="c">40-day avg up ${Math.round(L.up4_avg40)}</span>${spark(B.up4,"var(--up)")}</div>
      <div class="tile"><span class="l">T2108 (above 40-day)</span><span class="v">${t21==null?"–":t21.toFixed(1)+"%"}</span><span class="c">${t21c}</span>${spark(B.t2108,"var(--accent)")}</div>
      <div class="tile"><span class="l">$ in falling stocks</span><span class="v">${L.dn_share.toFixed(1)}%</span><span class="c">under 40% = money coming in</span>${spark(B.dn_share,"var(--warn)")}</div>
      <div class="tile"><span class="l">The trade</span><span style="font-weight:600;font-size:15px;line-height:1.3;margin-top:4px">${esc(tr.name||"No clear trade")}</span><span class="c">${esc(trc)}${trc?" · ":""}<a href="#market-money">Money flow ›</a></span></div>
    </div></div>
    <div class="panel"><div class="ph"><h3>Groups in BUY</h3><span class="right"><a href="#groups-lifecycle" style="font-size:12.5px">Lifecycle ›</a></span></div>
      ${buys.map(g=>`<div class="grow"><span class="nm">${esc(g.g)}</span><span class="st ${stCls(g.stage)}">${g.stage}</span>
        <div class="gmeta"><span class="num">${g.strength.toFixed(0)}</span><span class="sbar"><i style="width:${g.strength}%"></i></span><span>${esc(g.sector)} · day ${g.days}</span></div></div>`).join("")}
      <div class="more">${watch.length} groups on watch · <a href="#groups-themes">Themes table ›</a></div></div></div>`;
  $("#tCopy").onclick = () => copyTv(tvList([["Launch picks",(S.picks||[]).map(p=>p.t)],["Lined-up buys",(S.lined||[]).slice(0,5).map(x=>x.t)]]), $("#tToast"), "todays-trades");
}

/* ---------- Groups · Themes (the v1 Themes tab, rebuilt) ---------- */
const TH = Object.assign({kind:"themes", rankBy:"str", cls:"all", stair:"all", horizon:"short", q:"", sort:null, dir:-1, open:null, sec:""}, LS.get("v2themes", {}));
const STAIRF = [["all","All"],["star_any","★ + setting/stepping"],["any","Setting or stepping"],["stepping","Stepping up"],["setting","Setting up"],["star","★ Leading"]];
const stairPass = (g,k) => { const [s,, lead] = g.stair; return k==="all" || (k==="star_any"&&lead&&s!=="none") || (k==="any"&&s!=="none") || (k===s) || (k==="star"&&lead); };
const clsPass = (g,k) => k==="all" || (k==="strong"&&g.sc>=7) || (k==="weak"&&g.sc<=2) || (k==="buy"&&g.stage&&g.stage[2]==="buy");
const ROT = {"Early Rotation":["Early","↗"],"Mid Rotation":["Mid","↑"],"Late Rotation":["Late","→"],"Neutral":["Neutral","·"],"Cooling":["Cooling","↘"],"Weak":["Weak","↓"]};
function trailSvg(v){
  const W=120,H=22,n=v.length,bw=W/n; return `<svg class="trail" viewBox="0 0 ${W} ${H}" aria-hidden="true">${v.map((x,i)=>{const h=Math.max(1.5,(x??0)/100*H);return `<rect x="${(i*bw+.4).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-.8).toFixed(1)}" height="${h.toFixed(1)}" rx=".6" fill="var(--accent)" opacity="${(.35+.65*(x??0)/100).toFixed(2)}"/>`}).join("")}</svg>`;
}
function pageThemes(el){
  const rows = () => {
    const src = TH.kind==="themes" ? S.themes : S.subs, q = TH.q.trim().toLowerCase();
    let r = src.filter(g => clsPass(g,TH.cls) && stairPass(g,TH.stair) && (TH.kind!=="subs" || !TH.sec || g.sec===TH.sec) && (!q || g.n.toLowerCase().includes(q) || g.m.some(t=>t.toLowerCase()===q)));
    const k = TH.sort || (TH.rankBy==="str" ? "rk" : "sc"), dir = TH.sort ? TH.dir : (TH.rankBy==="str" ? 1 : -1);
    return r.sort((a,b)=>{ const x=a[k], y=b[k]; if (x==null) return 1; if (y==null) return -1; return (typeof x==="string" ? x.localeCompare(y) : x-y)*dir || a.rk-b.rk; });
  };
  let cols, isSub;
  function draw(){
    cols = TH.horizon==="short" ? [["d1","Today",3],["d5","5D",8],["d15","15D",12],["d30","30D",18],["rs","RS",40,"3-mo %"]] : [["d30","30D",18],["d90","90D",50],["rs","RS",40,"3-mo %"]];
    isSub = TH.kind==="subs";
    LS.set("v2themes", {kind:TH.kind, rankBy:TH.rankBy, cls:TH.cls, stair:TH.stair, horizon:TH.horizon, sec:TH.sec});
    const src = TH.kind==="themes" ? S.themes : S.subs, R = rows();
    const seg = (name, val, opts) => `<span class="seg" data-g="${name}">${opts.map(([k,l])=>`<button data-v="${k}" aria-pressed="${val===k}">${l}</button>`).join("")}</span>`;
    const sh = (k,l,small,n) => `<th class="sortable ${n?"n":""}" data-k="${k}" aria-sort="${TH.sort===k?(TH.dir<0?"descending":"ascending"):"none"}">${l}${small?`<small>${small}</small>`:""}</th>`;
    el.innerHTML = `<div class="page-h"><h1>${isSub?"Sub-themes":"Themes"}</h1><p>${src.length} ${isSub?"peer groups":"themes"} · click a row for its stocks · sorted by ${TH.rankBy==="str"?"Strength":"Score /8"} unless you click a header</p></div>
    <div class="panel">
      <div class="controls">
        ${seg("kind",TH.kind,[["themes","Themes"],["subs","Sub-themes"]])}
        ${seg("rankBy",TH.rankBy,[["str","Rank by Strength"],["sc","by Score /8"]])}
        ${seg("cls",TH.cls,[["all","All"],["strong","Strong"],["weak","Weak"]].concat(isSub?[["buy","In BUY"]]:[]))}
        ${seg("horizon",TH.horizon,[["short","Short-term"],["long","Long-term"]])}
        ${isSub?`<select class="fsel" id="thSec" aria-label="Filter by sector"><option value="">All sectors</option>${[...new Set(S.subs.map(g=>g.sec).filter(Boolean))].sort().map(s=>`<option ${TH.sec===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
        <input class="fsearch" id="thq" placeholder="Search name or ticker" value="${esc(TH.q)}" aria-label="Search themes">
        <span class="right" style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="toast" id="thToast"></span><button class="btn" id="thCopy">⬇ TradingView list</button></span>
      </div>
      <div class="chips" aria-label="Stair step filter">${STAIRF.map(([k,l])=>`<button class="chip" data-stair="${k}" aria-pressed="${TH.stair===k}">${l}<span class="c">${src.filter(g=>stairPass(g,k)&&clsPass(g,TH.cls)).length}</span></button>`).join("")}</div>
      <div class="tw"><table class="sticky1" id="thT"><thead><tr>
        ${sh("n", isSub?"Sub-theme":"Theme")}${sh("rk","Rank","",1)}${sh("str","Strength","0–100")}${sh("sc","Score","/ 8",1)}${sh("mv5","Rank Δ","5 days",1)}
        <th class="hide-sm">Trail<small>strength, 30 days</small></th>${isSub?sh("stageN","Stage","lifecycle"):sh("rot","Rotation")}
        ${cols.map(([k,l,,s])=>sh(k,l,s||"",1)).join("")}</tr></thead><tbody>
      ${R.map(g=>{ const [s,since,lead]=g.stair, rot=ROT[g.rot]||[g.rot||"–",""], open=TH.open===g.n;
        return `<tr class="grp ${open?"open":""}" data-g="${esc(g.n)}" aria-expanded="${open}">
          <td style="white-space:normal;min-width:210px"><div class="gname"><span class="caret" aria-hidden="true">▸</span>${esc(g.n)}${lead?'<span class="star" title="Top 30% on 60-day return">★</span>':""}
            ${s==="stepping"?`<span class="tag tag-step">Stepping up · day ${since}</span>`:s==="setting"?`<span class="tag tag-set">Setting up · day ${since}</span>`:""}</div>
            <div class="gsub" style="padding-left:18px">${g.etf?esc(g.etf)+" · ":""}${isSub&&g.sec?esc(g.sec)+" · ":""}${g.k} stocks</div></td>
          <td class="n">${g.rk}</td>
          <td><span class="sbar"><i style="width:${g.str}%"></i></span><span class="num">${Math.round(g.str)}</span></td>
          <td class="n"><span class="sc ${g.sc>=7?"hi":g.sc>=4?"mid":"lo"}">${g.sc}</span></td>
          <td class="n ${g.mv5>0?"mv-up":g.mv5<0?"mv-dn":"muted"}">${g.mv5>0?"▲"+g.mv5:g.mv5<0?"▼"+(-g.mv5):"·"}</td>
          <td class="hide-sm">${trailSvg(g.trail)}</td>

      if (TH.sort===k) TH.dir*=-1; else { TH.sort=k; TH.dir = (k==="n"||k==="rk"||k==="rot")?1:-1; } draw(); };

/* ---------- Read · Latest ---------- */
function mdLite(md){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null;
  md.split("\n").forEach(line=>{ const li=line.match(/^\s*[-*] (.*)/); if(li){(list||=[]).push("<li>"+inline(li[1])+"</li>");return;} if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;} if(line.trim()) out.push("<p>"+inline(line)+"</p>"); });
  if(list) out.push("<ul>"+list.join("")+"</ul>"); return out.join("");
}
function pageRead(el){
  const st = S.story; if (!st) throw new Error("no story");
  const cut = st.md.lastIndexOf("\n", 2600);
  el.innerHTML = `<div class="article"><article class="paper">
    <div class="kicker"><span>${day(st.date)} · ${st.slot==="pm"?"After the close":"Morning"}</span><span>The daily story</span></div>

    <div class="panel"><h4 class="mini-h">Earlier</h4><div class="ink2" style="font-size:13px">Every chapter will get its own page in the Archive.</div></div></aside></div>`;
  if (!pageRead.fetched){ pageRead.fetched = 1;
    fetch("../story.json", {cache:"no-store"}).then(r=>r.json()).then(j=>{ const ch=(j.chapters||[]).filter(c=>c.slot!=="data"), c=ch[ch.length-1];

/* ---------- shared: sortable table ---------- */
function sortTable(host, cfg){
  /* cfg: {cols:[{k,l,sub,n,cls,html(r),v(r)}], rows, sort, dir, rowAttr(r), after(r)} */
  const st = cfg.state || (cfg.state = {sort:cfg.sort, dir:cfg.dir ?? -1});
  const G = cfg.groupBy, GS = cfg.gstore || st;
  function draw(){
    const col = cfg.cols.find(c=>c.k===st.sort), val = c => r => c.v ? c.v(r) : r[c.k];
    let base = cfg.rows, gsel = "";
    if (G){
      const cnt = {}; cfg.rows.forEach(r=>{ const g=G(r)||"No sub-theme"; cnt[g]=(cnt[g]||0)+1; });
      if (GS.grp && !cnt[GS.grp]) GS.grp = "";
      if (GS.grp) base = cfg.rows.filter(r=>(G(r)||"No sub-theme")===GS.grp);
      const names = Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]||a.localeCompare(b));
      gsel = `<div class="controls gsel"><label class="ink2" style="font-size:12.5px;display:flex;align-items:center;gap:8px">${cfg.groupLabel||"Sub-theme"}
        <select class="fsel" aria-label="Filter by ${cfg.groupLabel||"sub-theme"}"><option value="">All (${cfg.rows.length})</option>${names.map(n=>`<option value="${esc(n)}" ${GS.grp===n?"selected":""}>${esc(n)} (${cnt[n]})</option>`).join("")}</select></label>
        ${GS.grp?`<button class="chip" data-clear aria-pressed="true">${esc(GS.grp)} ✕</button>`:""}<span class="muted" style="font-size:12px">${names.length} ${(cfg.groupLabel||"sub-theme").toLowerCase()}${names.length===1?"":"s"} in this list</span></div>`;
    }
    const rows = col ? [...base].sort((a,b)=>{ const x=val(col)(a), y=val(col)(b); if (x==null&&y==null) return 0; if (x==null) return 1; if (y==null) return -1;
      return (typeof x==="string" ? x.localeCompare(y) : x-y) * st.dir; }) : base;
    host.innerHTML = `${gsel}<div class="tw"><table class="sticky1"><thead><tr>${cfg.cols.map(c=>`<th class="${c.nosort?"":"sortable"} ${c.n?"n":""} ${c.cls||""}" data-k="${c.k}" ${c.nosort?"":`aria-sort="${st.sort===c.k?(st.dir<0?"descending":"ascending"):"none"}"`}>${c.l}${c.sub?`<small>${c.sub}</small>`:""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr ${cfg.rowAttr?cfg.rowAttr(r):""}>${cfg.cols.map(c=>`<td class="${c.n?"n":""} ${c.cls||""}" ${c.style?`style="${c.style(r)}"`:""}>${c.html?c.html(r):esc(r[c.k]??"–")}</td>`).join("")}</tr>${cfg.after?cfg.after(r):""}`).join("") ||
      `<tr><td colspan="${cfg.cols.length}" class="muted" style="padding:18px 14px;white-space:normal">${cfg.empty||"Nothing matches these filters."}</td></tr>`}</tbody></table></div>`;
    host.querySelector("thead").onclick = e => { const th=e.target.closest("th.sortable"); if(!th) return; const k=th.dataset.k;
      if (st.sort===k) st.dir*=-1; else { st.sort=k; const c=cfg.cols.find(c=>c.k===k); st.dir = c.n || c.num ? -1 : 1; } draw(); };
    if (G){ host.querySelector(".fsel").onchange = e => { GS.grp = e.target.value; saveUI(); draw(); };
      const c = host.querySelector("[data-clear]"); if (c) c.onclick = () => { GS.grp = ""; saveUI(); draw(); }; }
    cfg.shown = rows;
    if (cfg.onDraw) cfg.onDraw(host, rows);
  }
  cfg.redraw = draw; draw(); return cfg;
}

/* ---------- Groups · Stair steps ---------- */
function stairStrip(r){
  const n=r.h_nuz.length, W=8, H=26, w=n*W;

/* ---------- Setups · Box trades ---------- */
const BOX_TAG = {
  retest_long: {go:["Just bounced off the old top","s-go"], at:["At the old top (support)","s-zone"], inside:["Slipped back under the top","s-wait"], coming:["Coming back to the box","s-wait"]},
  trap_long: {failed:["Just reclaimed the box (spring)","s-go"], far:["Broke through the ceiling","s-go"], falling:["Rising through the box","s-wait"]}};
const BOX_PLAN = {
  "retest_long:go":"Buy next open, stop under the retest low.", "retest_long:at":"Wait for the bounce: a close above the day's high and above the line.",
  "retest_long:inside":"A bounce back over the line is still the entry.", "retest_long:coming":"Set an alert at the line.",
  "trap_long:failed":"Buy next open, stop 0.5 ADR under the old bottom, target the box top.", "trap_long:far":"Buy next open, stop under the 5-day low.",
  "trap_long:falling":"Watch for the ceiling break. Dead if it closes back under the old bottom."};
function pageBox(el){
  const X = S.boxes, U = UI2.box ||= {typ:"all", tag:"act", grade:"AB", star:false};
  if (!X) throw new Error("no boxes");
  const actNow = r => (r.type==="retest_long" && (r.tag==="go"||r.tag==="at")) || (r.type==="trap_long" && (r.tag==="failed"||r.tag==="far"));
  const pass = r => (U.typ==="all"||r.type===U.typ) && (U.tag==="all" || (U.tag==="act" ? actNow(r) : !actNow(r))) &&
    (U.grade==="all" || U.grade.includes(r.grade)) && (!U.star || r.glead);
  const IXT = {trap_short:"failed breakout, falling back through the box", trap_long:"failed breakdown, rising back through the box", retest_long:"breakout retest", retest_short:"breakdown retest"};
  const favs = X.rows.filter(r=>r.fav).sort((a,b)=>(b.tag==="at"?0:1)-(a.tag==="at"?0:1) || (b.exp??-9)-(a.exp??-9) || (b.rs||0)-(a.rs||0)).slice(0,5);
  function draw(){
    saveUI();
    const rows = X.rows.filter(pass);
    el.innerHTML = `<div class="page-h"><h1>Box trades</h1><p>Long side only: retests of a broken box top and springs back into a box (shorts tested badly; they're in the Lab) · ${day(X.date)} close</p></div>
      <div class="gate go"><b>${esc(X.state||"")}</b><span class="evline">${X.tiles.map(x=>`${esc(x.name)}: <b>${esc(x.verdict)}</b> (${Rv(x.R)} a trade, ${Math.round((x.win||0)*100)}% win, n ${x.n})`).join(" · ")}. Indexes: ${X.idx.map(i=>i.type?`${i.t} ${IXT[i.type]||i.type}${i.lvl?` (line ${f2(i.lvl)})`:""}`:`${i.t} no box trade`).join(" · ")}.</span></div>
      <div class="sect"><h2>Favorites</h2><span>acting now, grade A–B, in a ★ leading group, at least 1.5 : 1 reward to risk (retest bounce in ★ groups: +0.23R vs −0.02R, both halves)</span></div>
      <div class="picks">${favs.map(r=>`<div class="pick"><div class="tkr"><b>${esc(r.t)}</b>${grade(r.grade)}<span class="status ${BOX_TAG[r.type][r.tag][1]}">${esc(BOX_TAG[r.type][r.tag][0])}</span></div>
        <div class="muted" style="font-size:12.5px">${esc(r.sub||"")} · ${r.kind==="range"?"wide range":"tight box"}, ${r.wks} weeks</div>
        <div>${lvlChart(r.px,[[r.top,"var(--up)",0],[r.bot,"var(--dn)",0],[r.stop,"var(--dn)",1]],230,44)}</div>
        <div class="kv"><span>Price</span><span class="num">${f2(r.price)}</span><span>Line</span><span class="num">${f2(r.lvl)}</span><span>Stop / target</span><span class="num">${f2(r.stop)} / ${f2(r.target)}</span><span>Reward : risk</span><span class="num">${r.rr==null?"–":r.rr.toFixed(1)+" : 1"}</span><span>Past trades like it</span><span class="num">${Rv(r.exp)} · n ${r.en??"–"}</span></div>
        <p>${esc(BOX_PLAN[r.type+":"+r.tag]||"")}</p></div>`).join("") || '<div class="notice">No favorites today.</div>'}</div>
      <div class="sect"><h2>All long box trades</h2><span>${rows.length} shown of ${X.rows.length}</span></div>
      <div class="panel">
        ${chipRow("typ", [["all","Both trades"],["retest_long","Retest bounce"],["trap_long","Spring"]], U.typ, k=>X.rows.filter(r=>k==="all"||r.type===k).length)}
        ${chipRow("tag", [["act","Acting now"],["wait","Setting up"],["all","All"]], U.tag)}
        ${chipRow("grade", [["A","Grade A"],["AB","A + B"],["all","All grades"]], U.grade)}
        <div class="controls"><label class="ink2" style="font-size:12.5px;display:flex;gap:6px;align-items:center"><input type="checkbox" class="ck" id="bxStar" ${U.star?"checked":""}> ★ leading group only</label>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="toast" id="bxToast"></span><button class="btn" id="bxCopy">⬇ TradingView list</button></span></div>
        <div id="bxT"></div>
        <div class="legend"><span>Chart: price with the box top (green), bottom (red) and stop (dashed)</span><span>Past trades = average R of trades with the same type, market state and proven confluences</span></div></div>`;
    ["typ","tag","grade"].forEach(k => el.querySelector(`[data-chips="${k}"]`).onclick = e => { const b=e.target.closest("button"); if(b){U[k]=b.dataset.v; draw();} });
    $("#bxStar").onchange = e => { U.star = e.target.checked; draw(); };
    let tbl; $("#bxCopy").onclick = () => copyTv(tvList([["Box favorites", favs.map(r=>r.t)], ["Box trades", tbl.shown.map(r=>r.t).filter(t=>!favs.some(f=>f.t===t))]]), $("#bxToast"), "box-trades");
    tbl = sortTable($("#bxT"), {rows, sort:"exp", dir:-1, groupBy:r=>r.sub, gstore:U, cols:[
      {k:"t", l:"Ticker", html:r=>`${tk(r.t)}${r.fav?' <span class="star" title="Favorite">★</span>':""}`},
      {k:"tag", l:"Where it is", v:r=>(actNow(r)?0:1)+r.tag, html:r=>`<span class="status ${BOX_TAG[r.type][r.tag][1]}">${esc(BOX_TAG[r.type][r.tag][0])}</span><div class="gsub">${r.type==="trap_long"?"Spring":"Retest"} · ${r.kind==="range"?"wide range":"tight box"} · ${r.wks}w</div>`},
      {k:"chart", l:"Box", nosort:1, html:r=>lvlChart(r.px,[[r.top,"var(--up)",0],[r.bot,"var(--dn)",0],[r.stop,"var(--dn)",1]])},
      {k:"grade", l:"Grade", html:r=>grade(r.grade)},
      {k:"exp", l:"Past trades", sub:"avg R", n:1, html:r=>`${Rv(r.exp)}<div class="dist">${r.win==null?"":Math.round(r.win*100)+"% win · "}n ${r.en??"–"}</div>`},
      {k:"price", l:"Price", n:1, html:r=>f2(r.price)}, {k:"lvl", l:"Line", n:1, html:r=>f2(r.lvl)},
      {k:"stop", l:"Stop", n:1, html:r=>f2(r.stop)}, {k:"target", l:"Target", n:1, html:r=>f2(r.target)},
      {k:"rr", l:"Reward : risk", n:1, html:r=>r.rr==null?"–":r.rr.toFixed(1)},
      {k:"sub", l:"Group", html:r=>`${esc(r.sub||"–")}${r.glead?' <span class="star">★</span>':""}${r.gst!=="none"?`<div class="gsub">group ${r.gst==="stepping"?"stepping up":"setting up"}${r.own?` · stock ${r.own==="nuzzle"?"nuzzled":r.own==="lift"?"lifting":"broke its step"}`:""}</div>`:r.own?`<div class="gsub">stock ${r.own==="nuzzle"?"nuzzled":r.own==="lift"?"lifting":"broke its step"}</div>`:""}`, style:()=>"white-space:normal;min-width:160px"},
      {k:"rs", l:"RS", n:1}]});
  }
  draw();
}

/* ---------- Setups · Lined-up & dips ---------- */
const LOC_TXT = {reclaim21:"Reclaimed the 21", reclaim9:"Reclaimed the 9", on21:"On the 21", on9:"On the 9", under21:"Under the 21", between:"Between the 9 and 21", above:"Over the 9"};
function pageDips(el){
  const X = S.lineup, U = UI2.dips ||= {lu:"zone", nz:"nuzzle", dp:"wick"};
  if (!X) throw new Error("no lineup");
  const gate = X.weak ? ["warn","Hold off: breadth is weak, lined-up dips lose here"] : X.size==="full" ? ["go","Full size: breadth is strong"] : ["wait",`${X.size==="half"?"Half":"Normal"} size: breadth is mixed (10-day ratio ${X.ratio10})`];
  const E = X.ev || {}, TR = X.tracker || {}, PE = X.pev || {};
  function draw(){
    saveUI();
    const lu = X.rows.filter(r => U.lu==="all" ? true : U.lu==="zone" ? r.st==="zone" : r.st==="zone"||r.st==="near");
    const nz = X.nuzzle.filter(r => U.nz==="all" ? true : r.state===U.nz);
    const dp = X.dips.filter(r => U.dp==="all" ? true : U.dp==="wick" ? r.f.some(f=>f.startsWith("wick")||f.startsWith("reclaim")) : r.f.some(f=>f.startsWith("under")));
    el.innerHTML = `<div class="page-h"><h1>Lined-up & dips</h1><p>Leaders of BUY groups pulling into their 9 / 21 EMAs, plus the other EMA entries · ${day(S.asof)} close (live prices come in a later step; the current dashboard has them now)</p></div>
      <div class="gate ${gate[0]}"><b>${esc(gate[1])}</b><span class="evline">Backtest: buying the break of a dip-day high in BUY groups ${Rv(E.buy&&E.buy.R)} a trade (n ${E.buy&&E.buy.n}, halves ${Rv(E.buy&&E.buy.h1)} / ${Rv(E.buy&&E.buy.h2)}) vs ${Rv(E.other&&E.other.R)} elsewhere; watch-only groups ${Rv(E.watch&&E.watch.R)}.</span></div>
      <div class="sect"><h2>Lined-up buys</h2><span>trigger = the dip day's high, stop = the dip low (max 1 ADR) · ${X.rows.filter(r=>r.st==="zone").length} in the zone</span></div>
      <div class="panel">${chipRow("lu", [["zone","In the zone"],["zn","Zone + near"],["all","All BUY-group leaders"]], U.lu, k=>X.rows.filter(r=>k==="all"?true:k==="zone"?r.st==="zone":r.st==="zone"||r.st==="near").length)}
        <div class="controls"><span class="muted" style="font-size:12.5px">Live track record since ${TR.since?day(TR.since):"–"}: ${(TR.all||{}).n||0} signals, ${(TR.all||{}).filled||0} filled, ${(TR.all||{}).closed||0} closed${(TR.all||{}).R!=null?`, avg ${Rv(TR.all.R)}`:""}.</span>
          <span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="toast" id="luToast"></span><button class="btn" id="luCopy">⬇ TradingView list</button></span></div>
        <div id="luT"></div></div>
      <div class="sect"><h2>EMA pullbacks in leading groups</h2><span>leaders nuzzling the daily 9 / 21 ribbon · ${PE.nuzzle&&PE.nuzzle.proven?"proven":"unproven"}: ${Rv(PE.nuzzle&&PE.nuzzle.lead&&PE.nuzzle.lead.R)} in leading groups vs ${Rv(PE.nuzzle&&PE.nuzzle.none&&PE.nuzzle.none.R)} elsewhere</span></div>
      <div class="panel">${chipRow("nz", [["nuzzle","Nuzzling now"],["touched","Touched this week"],["close","Close above"],["all","All"]], U.nz, k=>X.nuzzle.filter(r=>k==="all"||r.state===k).length)}<div id="nzT"></div></div>
      <div class="sect"><h2>High tight flags</h2><span>30%+ leg, tight flag near the high · unproven: ${Rv(PE.flag&&PE.flag.lead&&PE.flag.lead.R)} in leading groups, halves disagree</span></div>
      <div class="panel" id="flT"></div>
      <div class="sect"><h2>Dip buys · box and weekly names</h2><span>wicks under the 9 or 21 EMA and back · an entry location, no edge on its own</span></div>
      <div class="panel">${chipRow("dp", [["wick","Wicked & back"],["under","Under now"],["all","All"]], U.dp)}<div id="dpT"></div></div>`;
    ["lu","nz","dp"].forEach(k => el.querySelector(`[data-chips="${k}"]`).onclick = e => { const b=e.target.closest("button"); if(b){U[k]=b.dataset.v; draw();} });
    let t1; $("#luCopy").onclick = () => copyTv(tvList([["Lined-up buys", t1.shown.map(r=>r.t)]]), $("#luToast"), "lined-up-buys");
    t1 = sortTable($("#luT"), {rows:lu, sort:"st", dir:1, groupBy:r=>r.g, gstore:(U.g1 ||= {}), empty:"Nothing in the zone at the last close.", cols:[
      {k:"t", l:"Ticker", html:r=>`${tk(r.t)}${r.earn?` <span class="badge v-selective">Earnings ${esc(r.earn.slice(5))}</span>`:""}`},
      {k:"st", l:"State", v:r=>({zone:0,near:1}[r.st]??2)+(r.precise?0:.5), html:r=>`<span class="status ${r.st==="zone"?"s-zone":"s-wait"}">${r.st==="zone"?"In the zone":r.st==="near"?"Near the ribbon":"Not yet"}</span><div class="gsub">${esc(LOC_TXT[r.loc]||r.loc)}${r.loc==="above"?` · ${r.d9} ADR`:""}</div>`},
      {k:"g", l:"Group", html:r=>`${esc(r.g)} <span class="st ${stCls(r.stage)}">${esc(r.stage||"")}</span><div class="gsub">${r.kind==="buy"?"BUY":"ready"}${r.lead?" · leaders":""}</div>`, style:()=>"white-space:normal;min-width:180px"},
      {k:"price", l:"Last", n:1, html:r=>f2(r.price)},
      {k:"trigger", l:"Trigger", n:1, html:r=>`${f2(r.trigger)}<div class="dist">${pct((r.trigger/r.price-1)*100)}</div>`},
      {k:"stop", l:"Stop", n:1, html:r=>`${f2(r.stop)}<div class="dist">${pct((r.stop/r.price-1)*100)}</div>`},
      {k:"rs", l:"RS", n:1}, {k:"adr", l:"ADR", n:1, html:r=>r.adr==null?"–":r.adr+"%"}]});
    sortTable($("#nzT"), {rows:nz, sort:"rs", dir:-1, groupBy:r=>r.sub, gstore:(U.g2 ||= {}), cols:[
      {k:"t", l:"Ticker", html:r=>tk(r.t)}, {k:"state", l:"State", html:r=>`${r.state==="nuzzle"?"Nuzzling":r.state==="touched"?"Touched":"Close above"}${r.ago?` <span class="muted">· ${r.ago}d ago</span>`:""}`},
      {k:"sub", l:"Group", style:()=>"white-space:normal;min-width:160px"},
      {k:"price", l:"Price", n:1, html:r=>f2(r.price)}, {k:"e9", l:"9 EMA", n:1, html:r=>f2(r.e9)}, {k:"e21", l:"21 EMA", n:1, html:r=>f2(r.e21)},
      {k:"stop", l:"Stop", n:1, html:r=>r.stop?f2(r.stop):"–"}, {k:"rs", l:"RS", n:1}, {k:"adr", l:"ADR", n:1, html:r=>r.adr+"%"}]});
    sortTable($("#flT"), {rows:X.flags, sort:"to", dir:1, empty:"No high tight flags today.", cols:[
      {k:"t", l:"Ticker", html:r=>tk(r.t)}, {k:"sub", l:"Group", html:r=>`${esc(r.sub||"–")}${r.lead?' <span class="star">★</span>':""}`, style:()=>"white-space:normal;min-width:160px"},
      {k:"price", l:"Price", n:1, html:r=>f2(r.price)}, {k:"pivot", l:"Pivot", n:1, html:r=>f2(r.pivot)}, {k:"to", l:"To pivot", sub:"ADRs", n:1},
      {k:"stop", l:"Stop", n:1, html:r=>f2(r.stop)}, {k:"risk", l:"Risk", n:1, html:r=>r.risk+"%"}, {k:"leg", l:"Leg", n:1, html:r=>"+"+r.leg+"%"},
      {k:"depth", l:"Flag depth", n:1, html:r=>r.depth+"%"}, {k:"days", l:"Days", n:1}, {k:"rs", l:"RS", n:1}]});
    const FL = {wick9:"Wicked the 9", wick21:"Wicked the 21", reclaim9:"Reclaimed the 9", reclaim21:"Reclaimed the 21", under9:"Under the 9", under21:"Under the 21"};
    sortTable($("#dpT"), {rows:dp, sort:"rs", dir:-1, groupBy:r=>r.sub, gstore:(U.g3 ||= {}), cols:[
      {k:"t", l:"Ticker", html:r=>tk(r.t)}, {k:"f", l:"What it did", v:r=>r.f.join(), html:r=>r.f.map(f=>FL[f]).join(" · ")+(r.up?"":' <span class="muted">· 9 under 21</span>')},
      {k:"strip", l:"Last 10 days", nosort:1, html:r=>`<span style="display:inline-flex;gap:2px">${r.strip.map(s=>`<i title="${["above","wick","under the 9","under the 21"][s]}" style="width:7px;height:12px;border-radius:2px;background:${["var(--up)","var(--warn)","var(--accent)","var(--dn)"][s]};opacity:${s?1:.35}"></i>`).join("")}</span>`},
      {k:"sub", l:"Group", style:()=>"white-space:normal;min-width:150px"},
      {k:"price", l:"Price", n:1, html:r=>f2(r.price)}, {k:"e9", l:"9 EMA", n:1, html:r=>f2(r.e9)}, {k:"e21", l:"21 EMA", n:1, html:r=>f2(r.e21)}, {k:"rs", l:"RS", n:1}]});
  }
  draw();
}

/* ---------- Groups · Lifecycle ---------- */
function pageLife(el){
  const X = S.life, U = UI2.life ||= {f:"signal"};
  if (!X) throw new Error("no lifecycle");
  const E = X.ev || {}, x = k => E[k] && E[k].xs!=null ? pct(E[k].xs*100) : "–";
  const gate = X.weak ? ["warn","Hold off: weak breadth (BUY groups ≈ average there)"] : X.size==="full" ? ["go","BUY groups: full size"] : ["wait",`BUY groups: ${X.size||"half"} size (10-day ratio ${X.ratio10}, full size needs 1.5 in the last 15 sessions)`];
  const STAGES = ["Forgotten","First push","Ignition","Quiet build","Blossom","Fading"];
  const keyOf = {"Forgotten":"forgotten","First push":"push","Ignition":"ignition","Quiet build":"build","Blossom":"blossom","Fading":"fade"};
  const all = Object.entries(X.all||{}).map(([g,a])=>({g, stage:a[0], days:a[2], last:a[3], ago:a[4], sig:a[5]}));
  function draw(){
    saveUI();
    const rows = X.rows.filter(r => U.f==="signal" ? (r.buy||r.ready||r.watch) : U.f==="buy" ? r.buy : U.f==="watch" ? r.watch : true);
    el.innerHTML = `<div class="page-h"><h1>Theme lifecycle</h1><p>Every sub-theme's stage on the way from forgotten to blossom, and when to act · ${day(S.asof)} close</p></div>
      <div class="gate ${gate[0]}"><b>${esc(gate[1])}</b><span class="evline">BUY groups beat the average group by ${x("buy")} over 20 sessions (t ${E.buy&&E.buy.t}, halves ${E.buy?pct(E.buy.h1*100)+" / "+pct(E.buy.h2*100):"–"}); ${X.w2b?Math.round(X.w2b.rate*100)+"% of WATCH groups turned BUY within "+X.w2b.within+" sessions":""}.</span></div>
      <div class="tiles" style="margin-bottom:14px">${STAGES.map(s=>{const n=all.filter(a=>a.stage===s).length;return `<div class="tile"><span class="l"><span class="st ${stCls(s)}">${s}</span></span><span class="v">${n}</span><span class="c">20 sessions after: ${x(keyOf[s])} vs avg group</span></div>`;}).join("")}</div>
      ${X.alerts.length?`<div class="notice"><b>New in the last 3 sessions:</b> ${X.alerts.map(a=>`${esc(a.g)} → ${a.kind==="buy"?"BUY":a.kind} (${esc(a.stage)}, day ${a.days})`).join(" · ")}</div>`:""}
      <div class="panel">${chipRow("f", [["signal","BUY, ready or watch"],["buy","BUY"],["watch","Watch"],["all","All staged groups"]], U.f, k=>X.rows.filter(r=>k==="signal"?(r.buy||r.ready||r.watch):k==="buy"?r.buy:k==="watch"?r.watch:true).length)}
        <div class="controls"><span class="muted" style="font-size:12.5px">Click a group for its reasons and tickers</span><span style="margin-left:auto;display:flex;gap:8px;align-items:center"><span class="toast" id="lfToast"></span><button class="btn" id="lfCopy">⬇ TradingView list</button></span></div>
        <div id="lfT"></div></div>`;
    el.querySelector('[data-chips="f"]').onclick = e => { const b=e.target.closest("button"); if(b){U.f=b.dataset.v; draw();} };
    let open = U.open, tbl;
    $("#lfCopy").onclick = () => copyTv(tvList(tbl.shown.map(r=>[r.g+" ("+(r.buy?"BUY":r.watch?"watch":r.stage)+")", r.picks.map(p=>p.t).concat(r.wait.map(p=>p.t))])), $("#lfToast"), "theme-lifecycle");
    tbl = sortTable($("#lfT"), {rows, sort:"sig", dir:-1, groupBy:r=>r.sec, groupLabel:"Sector", gstore:U,
      rowAttr:r=>`class="grp ${open===r.g?"open":""}" data-g="${esc(r.g)}"`,
      after:r=> open!==r.g ? "" : `<tr class="drawer"><td colspan="9"><div class="drawer-in"><div class="mini" style="margin-bottom:8px">${r.why.map(w=>`<span>${esc(w)}</span>`).join("")}</div>
        ${r.picks.length?`<div class="tw"><table><thead><tr><th>Buy candidates</th><th>Entry</th><th class="n">Price</th><th class="n">Trigger</th><th class="n">Stop</th><th class="n">RS</th><th>Plan</th></tr></thead><tbody>${r.picks.map(p=>`<tr><td>${tk(p.t)}${p.earn?` <span class="badge v-selective">Earnings ${esc(p.earn.slice(5))}</span>`:""}</td><td>${esc(p.entry||"")}</td><td class="n">${f2(p.price)}</td><td class="n">${p.trigger?f2(p.trigger):"–"}</td><td class="n">${p.stop?f2(p.stop):"–"}</td><td class="n">${p.rs??"–"}</td><td style="white-space:normal;min-width:220px">${esc(p.plan||"")}</td></tr>`).join("")}</tbody></table></div>`:'<div class="muted">No member at an entry right now.</div>'}
        ${r.wait.length?`<div class="gsub" style="margin-top:8px">Too extended, wait for a pullback: ${r.wait.map(w=>esc(w.t)+(w.vs21!=null?` (${w.vs21} ADR over the 21)`:"")).join(", ")}</div>`:""}</div></td></tr>`,
      onDraw:host=>{ host.querySelector("tbody").onclick = e => { if (e.target.closest(".drawer")) return; const tr=e.target.closest("tr.grp"); if(!tr) return; open = U.open = (open===tr.dataset.g?null:tr.dataset.g); saveUI(); tbl.redraw(); }; },
      cols:[
      {k:"g", l:"Group", html:r=>`<div class="gname"><span class="caret">▸</span>${esc(r.g)}${r.lead?'<span class="star" title="Leaders present">★</span>':""}</div><div class="gsub" style="padding-left:18px">${esc(r.sec||"")}</div>`, style:()=>"white-space:normal;min-width:200px"},
      {k:"sig", l:"Signal", v:r=>r.buy?3:r.ready?2:r.watch?1:0, html:r=>r.buy?'<span class="badge v-focus">BUY</span>':r.ready?'<span class="badge v-selective">Ready</span>':r.watch?`<span class="badge ev-info">Watch${r.hot?" · igniting":""}</span>`:'<span class="muted">–</span>'},
      {k:"stage", l:"Stage", v:r=>STAGES.indexOf(r.stage), html:r=>`<span class="st ${stCls(r.stage)}">${esc(r.stage)}</span> <span class="muted">day ${r.days}</span>`},
      {k:"tier", l:"Money flow", html:r=>esc(r.tier||"–")},
      {k:"br", l:"Breadth", sub:"above 21 EMA", n:1, html:r=>r.br==null?"–":Math.round(r.br*100)+"%"},

/* ---------- shared: SVG charts (viewBox scales to the box width) ---------- */
function axisY(lo,hi,W,H,pad,fmt){ const ticks=[lo,(lo+hi)/2,hi]; return ticks.map(v=>{const y=pad+(H-2*pad)*(1-(v-lo)/((hi-lo)||1)); return `<line x1="34" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="30" y="${(y+4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;}).join(""); }
function lineChart(series, opts={}){
  const W=opts.w||420, H=opts.h||170, pad=12, L=34, n=Math.max(...series.map(s=>s.v.length));
  const all=series.flatMap(s=>s.v).concat(opts.bands?opts.bands.flatMap(b=>[b[0]]):[]).filter(x=>x!=null);
  let lo=opts.lo??Math.min(...all), hi=opts.hi??Math.max(...all); if (lo===hi){lo-=1;hi+=1;}
  const X=i=>L+(W-L-4)*(i/(n-1||1)), Y=v=>pad+(H-2*pad)*(1-(v-lo)/(hi-lo));
  const band=(opts.bands||[]).map(([v,c])=>`<line x1="${L}" x2="${W}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="${c}" stroke-dasharray="4 3"/>`).join("");
  const paths=series.map(s=>{const d=s.v.map((v,i)=>v==null?"":(i&&s.v[i-1]!=null?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(""); return `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w||1.6}" ${s.dash?'stroke-dasharray="4 3"':""}/>`;}).join("");
  const xl=opts.dates?`<text x="${L}" y="${H-1}">${esc(opts.dates[0].slice(5))}</text><text x="${W-4}" y="${H-1}" text-anchor="end">${esc(opts.dates[opts.dates.length-1].slice(5))}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"chart")}">${axisY(lo,hi,W,H,pad,opts.fmt||(v=>Math.round(v)))}${band}${paths}${xl}</svg>`;
}
function mirrorBars(up, dn, opts={}){
  const W=opts.w||420, H=opts.h||170, L=34, n=up.length, mx=Math.max(...up,...dn,1), mid=H/2, bw=(W-L-4)/n;
  const bars=up.map((u,i)=>{const x=L+i*bw, hu=(u/mx)*(mid-8), hd=(dn[i]/mx)*(mid-8); return `<rect x="${x.toFixed(1)}" y="${(mid-hu).toFixed(1)}" width="${(bw*.75).toFixed(1)}" height="${hu.toFixed(1)}" fill="var(--up)"/><rect x="${x.toFixed(1)}" y="${mid}" width="${(bw*.75).toFixed(1)}" height="${hd.toFixed(1)}" fill="var(--dn)" opacity=".8"/>`;}).join("");
  const xl=opts.dates?`<text x="${L}" y="${H-1}">${esc(opts.dates[0].slice(5))}</text><text x="${W-4}" y="${H-1}" text-anchor="end">${esc(opts.dates[opts.dates.length-1].slice(5))}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"bars")}"><line x1="${L}" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line-2)"/><text x="30" y="14" text-anchor="end">${Math.round(mx)}</text><text x="30" y="${H-12}" text-anchor="end">${Math.round(mx)}</text>${bars}${xl}</svg>`;
}
const heatCell = (v, scale) => v==null ? "" : `style="${heatBg(v, scale)}"`;

/* ---------- Groups · Rotation ---------- */
const TIER_C = {confirmed:"var(--up)", steady:"var(--accent)", new:"var(--warn)", fading:"var(--ink-3)", bouncing:"var(--warn)", outflow:"var(--dn)", neutral:"var(--line-2)"};
function rrg(rows){
  const W=560,H=380, xs=rows.map(r=>r.x).concat(rows.flatMap(r=>r.tail.map(t=>t[0]))), ys=rows.map(r=>r.y).concat(rows.flatMap(r=>r.tail.map(t=>t[1])));
  const pad=(a)=>{const lo=Math.min(...a,99), hi=Math.max(...a,101), m=Math.max(100-lo,hi-100)*1.05; return [100-m,100+m];};
  const [x0,x1]=pad(xs), [y0,y1]=pad(ys), X=v=>30+(W-40)*(v-x0)/(x1-x0), Y=v=>10+(H-40)*(1-(v-y0)/(y1-y0));
  const q=(x,y,txt,a)=>`<text x="${x}" y="${y}" text-anchor="${a}" style="font-size:12px;fill:var(--ink-3)">${txt}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Relative rotation graph">
    <line x1="${X(100)}" x2="${X(100)}" y1="10" y2="${H-30}" stroke="var(--line-2)"/><line x1="30" x2="${W-10}" y1="${Y(100)}" y2="${Y(100)}" stroke="var(--line-2)"/>
    ${q(W-14,24,"Leading","end")}${q(W-14,H-36,"Weakening","end")}${q(36,H-36,"Lagging","start")}${q(36,24,"Improving","start")}
    ${rows.map(r=>`<path d="${r.tail.map((t,i)=>(i?"L":"M")+X(t[0]).toFixed(1)+" "+Y(t[1]).toFixed(1)).join("")}" fill="none" stroke="${TIER_C[r.tier]||"var(--line-2)"}" stroke-width="1" opacity=".5"/><circle cx="${X(r.x).toFixed(1)}" cy="${Y(r.y).toFixed(1)}" r="3.5" fill="${TIER_C[r.tier]||"var(--line-2)"}"><title>${esc(r.g)}: ${esc(r.tier)}</title></circle>`).join("")}
    <text x="${W/2}" y="${H-8}" text-anchor="middle">relative strength vs SPY →</text></svg>`;
}

  const X = S.timeline; if (!X) throw new Error("no timeline");
  const U = UI2.tl ||= {kind:"subs", top:"40", sec:""};
  const src = X[U.kind] || [], d = X.dates, n = d.length;
  const rows = src.filter(r=>!U.sec || r.sec===U.sec).sort((a,b)=>(b.h[b.h.length-1]??-1)-(a.h[a.h.length-1]??-1)).slice(0, U.top==="all"?999:+U.top);
  const col = v => v==null ? "transparent" : `color-mix(in srgb, ${v>=50?"var(--up)":"var(--dn)"} ${Math.round(Math.abs(v-50)*1.6)}%, var(--panel))`;
  el.innerHTML = `<div class="page-h"><h1>Strength timeline</h1><p>Each row a group, each cell a session (oldest left), colored by Strength: green strong, red weak · ${d.length} sessions to ${day(d[n-1])}</p></div>
    <div class="panel"><div class="controls"><span class="seg" data-g="kind"><button data-v="subs" aria-pressed="${U.kind==="subs"}">Sub-themes</button><button data-v="themes" aria-pressed="${U.kind==="themes"}">Themes</button></span>
      <span class="seg" data-g="top">${[["20","Top 20"],["40","Top 40"],["all","All"]].map(([k,l])=>`<button data-v="${k}" aria-pressed="${U.top===k}">${l}</button>`).join("")}</span>
      ${U.kind==="subs"?`<select class="fsel" id="tlSec" aria-label="Filter by sector"><option value="">All sectors</option>${[...new Set(X.subs.map(r=>r.sec).filter(Boolean))].sort().map(s=>`<option ${U.sec===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}</div>
      <div class="tw" style="padding:10px 14px"><table class="hm"><tbody>${rows.map(r=>`<tr><td class="nm" title="${esc(r.n)}">${esc(r.n)}</td>${r.h.map((v,i)=>`<td class="c" title="${esc(d[i])}: ${v??"–"}" style="background:${col(v)}"></td>`).join("")}<td class="nm num" style="padding-left:8px">${r.h[r.h.length-1]??"–"}</td></tr>`).join("")}</tbody></table></div>
      <div class="legend"><span>Sorted by today's Strength · hover a cell for the date and value</span><span>${esc(d[0])} → ${esc(d[n-1])}</span></div></div>`;
  el.querySelectorAll(".seg[data-g]").forEach(sg => sg.onclick = e => { const b=e.target.closest("button"); if(b){U[sg.dataset.g]=b.dataset.v; if(sg.dataset.g==="kind") U.sec=""; saveUI(); pageTimeline(el);} });
  const s=$("#tlSec"); if (s) s.onchange = () => { U.sec=s.value; saveUI(); pageTimeline(el); };
}

route();
</script>
</body>
</html>
