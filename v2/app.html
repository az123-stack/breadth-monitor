<title>Market Monitor v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: sticky bar = main tabs, second row = sub-tabs of the open tab; one page per sub-tab. Phones: main tabs in a bottom bar, sub-tabs scroll sideways. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --sunk:#eaeef3; --line:#d9dfe7; --line-2:#c3ccd8;
  --ink:#121820; --ink-2:#47525f; --ink-3:#717d8b;
  --accent:#2448c8; --accent-ink:#ffffff; --accent-soft:#e3e9fb;
  --up:#16804a; --up-soft:#dff2e7; --dn:#c0352b; --dn-soft:#fbe5e2; --warn:#a46200; --warn-soft:#fbefd9;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --read:"Newsreader",Georgia,"Times New Roman",serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --panel:#141a22; --sunk:#1b232d; --line:#26303c; --line-2:#36424f;
  --ink:#e6ebf1; --ink-2:#a6b1bd; --ink-3:#7b8794;
  --accent:#7d9bff; --accent-ink:#0d1117; --accent-soft:#1c2747;
  --up:#3fbf7a; --up-soft:#12301f; --dn:#ef6b5e; --dn-soft:#3a1916; --warn:#e5a33a; --warn-soft:#3a2a0f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#141a22; --sunk:#1b232d; --line:#26303c; --line-2:#36424f;
  --ink:#e6ebf1; --ink-2:#a6b1bd; --ink-3:#7b8794;
  --accent:#7d9bff; --accent-ink:#0d1117; --accent-soft:#1c2747;
  --up:#3fbf7a; --up-soft:#12301f; --dn:#ef6b5e; --dn-soft:#3a1916; --warn:#e5a33a; --warn-soft:#3a2a0f;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.up{color:var(--up)} .dn{color:var(--dn)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header: main tabs + sub-tabs */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.bar .top{display:flex;align-items:center;gap:20px;height:52px}
.brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:2px;background:var(--accent);display:inline-block;transform:rotate(45deg)}
.nav{display:flex;gap:2px;height:100%}
.nav a{display:flex;align-items:center;padding:0 12px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;font-weight:500}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink-3);min-width:180px}
.search input{border:0;background:transparent;outline:0;color:var(--ink);font:inherit;width:100%}
.mode{display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);white-space:nowrap;font-size:12.5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.iconbtn{height:32px;min-width:32px;padding:0 9px;border:1px solid var(--line);border-radius:var(--r);background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.iconbtn:hover{border-color:var(--line-2);color:var(--ink)}
.subnav{border-top:1px solid var(--line);background:var(--bg)}
.subnav .wrap{display:flex;gap:4px;height:42px;align-items:center;overflow-x:auto;scrollbar-width:none}
.subnav .wrap::-webkit-scrollbar{display:none}
.subnav a{flex:none;padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap}
.subnav a:hover{background:var(--sunk);color:var(--ink)}
.subnav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.subnav .ev{margin-left:auto;flex:none}

main{padding-block:20px 100px;min-height:70vh}
.page-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:0 0 14px}
.page-h h1{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
.page-h p{margin:0;color:var(--ink-3);font-size:13px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ph{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h3{font-size:15px;font-weight:600;margin:0}
.ph .sub{color:var(--ink-3);font-size:12.5px}
.ph .right{margin-left:auto;display:flex;gap:8px;align-items:center}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 7px;border-radius:4px;white-space:nowrap;line-height:1.5}
.ev-proven{background:var(--accent);color:var(--accent-ink)}
.ev-info{border:1px solid var(--line-2);color:var(--ink-2)}
.ev-unproven{border:1px dashed var(--line-2);color:var(--ink-3)}
.ev-noedge{background:var(--sunk);color:var(--ink-3);text-decoration:line-through}
.v-focus{background:var(--up-soft);color:var(--up)}
.v-selective{background:var(--warn-soft);color:var(--warn)}
.v-avoid{background:var(--dn-soft);color:var(--dn)}
.st{font-size:11.5px;font-weight:500;padding:1px 8px;border-radius:999px;white-space:nowrap}
.st-blossom{background:var(--up-soft);color:var(--up)}
.st-ignition,.st-first{background:var(--warn-soft);color:var(--warn)}
.st-build{background:var(--accent-soft);color:var(--accent)}
.st-fading{background:var(--dn-soft);color:var(--dn)}
.st-other{background:var(--sunk);color:var(--ink-3)}
.star{color:#d99a00}

/* posture */
.posture{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
.posture .call{padding:18px 20px;border-left:5px solid var(--up)}
.eyebrow{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.posture h2{font-size:28px;line-height:1.15;margin:6px 0;letter-spacing:-.02em;font-weight:600;text-wrap:balance}
.posture p{margin:0;color:var(--ink-2);max-width:60ch}
.meter{display:flex;gap:3px;margin-top:14px}
.meter b{flex:1;height:6px;border-radius:2px;background:var(--sunk)} .meter b.on{background:var(--up)}
.meter-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.posture .play{padding:16px 20px;background:var(--sunk);display:flex;flex-direction:column;gap:10px}
.play h4,.mini-h{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.plist{display:flex;flex-wrap:wrap;gap:6px}
.today{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;margin-top:16px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;font-size:11.5px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel);line-height:1.25;vertical-align:bottom}
th small{display:block;font-size:10.5px;font-weight:400}
th.sortable{cursor:pointer;user-select:none} th.sortable:hover{color:var(--ink)}
th[aria-sort="descending"]::after{content:" ↓"} th[aria-sort="ascending"]::after{content:" ↑"}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
tbody tr:hover>td{background:var(--sunk)}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
th.n{font-family:var(--ui)}
.tk{font-family:var(--num);font-weight:500;font-size:13.5px;color:var(--ink);text-decoration:none;border-bottom:1px dotted var(--line-2)}
.tk:hover{color:var(--accent);border-color:var(--accent)}
.cell2{display:flex;flex-direction:column;line-height:1.3}
.cell2 small{color:var(--ink-3);font-size:11.5px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-go{color:var(--up)} .s-zone{color:var(--warn)} .s-wait{color:var(--ink-3)}
.dist{font-size:11.5px;color:var(--ink-3)}
.sticky1 th:first-child,.sticky1 td:first-child{position:sticky;left:0;z-index:1;background:var(--panel)}
.sticky1 tbody tr:hover>td:first-child{background:var(--sunk)}

/* themes table */
.gname{font-weight:500;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gsub{font-size:11.5px;color:var(--ink-3)}
.tag{font-size:11px;font-weight:500;padding:0 7px;border-radius:999px;white-space:nowrap}
.tag-step{background:var(--up-soft);color:var(--up)} .tag-set{background:var(--accent-soft);color:var(--accent)}
.sbar{display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--sunk);vertical-align:middle;margin-right:8px;overflow:hidden}
.sbar i{display:block;height:100%;background:var(--accent)}
.sc{display:inline-flex;align-items:center;gap:5px}
.sc::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.sc.hi::before{background:var(--up)} .sc.mid::before{background:var(--warn)} .sc.lo::before{background:var(--dn)}
.trail{display:block;width:120px;height:22px}
.heat{font-family:var(--num);text-align:right}
.mv-up{color:var(--up)} .mv-dn{color:var(--dn)}
tr.grp{cursor:pointer}
tr.grp.open>td{background:var(--sunk)}
tr.drawer>td{padding:0;background:var(--bg)}
.drawer-in{padding:12px 14px 14px 28px;border-left:3px solid var(--accent)}
.drawer-in table{background:var(--panel);border:1px solid var(--line);border-radius:6px}
.caret{display:inline-block;width:12px;color:var(--ink-3);transition:transform .12s}
tr.open .caret{transform:rotate(90deg)}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;padding:5px 11px;cursor:pointer;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-family:var(--num);font-size:11px;opacity:.75;margin-left:4px}
.fsearch{height:30px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);padding:0 10px;font:inherit;font-size:13px;width:180px}
.btn{height:30px;padding:0 12px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--panel);cursor:pointer;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.toast{font-size:12.5px;color:var(--up);min-height:1em}
.ck{width:16px;height:16px;accent-color:var(--accent)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tile{background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:12px;color:var(--ink-3)}
.tile .v{font-family:var(--num);font-size:21px;font-weight:500;letter-spacing:-.02em}
.tile .c{font-size:12px;color:var(--ink-2)}
.tile svg{width:100%;height:34px;margin-top:4px;display:block}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.grow .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gmeta{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.more{padding:10px 14px;font-size:12.5px;color:var(--ink-2)}

/* planned pages */
.plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.plan .panel{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.plan h4{margin:0;font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan p{margin:0;color:var(--ink-2);font-size:13px}
.plan .from{font-size:12px;color:var(--ink-3)}
.notice{border:1px dashed var(--line-2);border-radius:8px;padding:12px 14px;color:var(--ink-2);font-size:13px;margin-bottom:14px}

/* article */
.article{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px}
.paper{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px clamp(18px,4vw,48px) 36px}
.kicker{font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap}
.paper h2{font-family:var(--read);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.12;letter-spacing:-.015em;margin:10px 0 8px;text-wrap:balance}
.byline{font-size:12.5px;color:var(--ink-3);padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:18px}
.prose{font-family:var(--read);font-size:18px;line-height:1.62;max-width:66ch}
.prose p{margin:0 0 1em} .prose ul{margin:0 0 1em;padding-left:1.2em} .prose li{margin-bottom:.5em} .prose strong{font-weight:600}
.aside{display:flex;flex-direction:column;gap:12px} .aside .panel{padding:14px}

.tabbar{display:none}
@media (max-width:900px){
  .nav,.search,.hide-sm,.brand .muted,.xs-hide{display:none}
  .bar .top{gap:10px}
  .posture,.today,.article{grid-template-columns:minmax(0,1fr)}
  .posture h2{font-size:23px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a{flex:1;text-align:center;padding:8px 0 7px;font-size:11px;color:var(--ink-3);text-decoration:none;font-weight:500}
  .tabbar a[aria-current="page"]{color:var(--accent)}
  .tabbar a span{display:block;font-size:17px;line-height:1.15}
  .prose{font-size:17px}
  .fsearch{width:100%}
  .subnav .ev{display:none}
}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
</style>

<header class="bar">
  <div class="wrap top">
    <div class="brand"><i aria-hidden="true"></i>Market Monitor <span class="muted" style="font-weight:400">v2</span></div>

    <div class="bar-right">
      <label class="search"><span aria-hidden="true">⌕</span><input id="q" placeholder="Ticker or group" aria-label="Find a ticker or group"></label>

      <button class="iconbtn" id="themeBtn" aria-label="Switch light or dark">◐ <span id="themeLbl">Auto</span></button>
    </div>
  </div>
  <div class="subnav"><div class="wrap" id="subnav"></div></div>
</header>

<main class="wrap" id="main"></main>

function spark(vals, color){
  const v = vals.filter(x=>x!=null), lo=Math.min(...v), hi=Math.max(...v), W=160, H=34, n=vals.length;
  const X=i=>(i/(n-1))*W, Y=x=>H-3-((x-lo)/((hi-lo)||1))*(H-6);
  const pts = vals.map((x,i)=>x==null?null:[X(i),Y(x)]).filter(Boolean);
  const d = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(""); const last = pts[pts.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d} L${last[0]} ${H} L0 ${H} Z" fill="${color}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}
const stCls = s => ({"Blossom":"st-blossom","Ignition":"st-ignition","First push":"st-first","Quiet build":"st-build","Fading":"st-fading"}[s]||"st-other");
const vb = v => `badge v-${v.toLowerCase()}`;
function copyTv(text, out){
  const n = (text.match(/:/g)||[]).length;
  const done = msg => { out.textContent = msg; setTimeout(()=>out.textContent="", 3500); };
  if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(()=>done(`Copied ${n} tickers for TradingView`), ()=>done("Copy is blocked in this preview; it works on the live page"));
  else done("Copy is blocked in this preview; it works on the live page");
}

function heatBg(x, scale){ if (x==null) return ""; const a = Math.min(Math.abs(x)/scale,1)*38; return `background:color-mix(in srgb, var(${x>=0?"--up":"--dn"}) ${a.toFixed(0)}%, transparent)`; }

        <td><div class="cell2"><span>${esc(r.setup)}</span><small><span class="${vb(r.verdict)}" style="padding:0 5px">${r.verdict}</span></small></div></td>
        <td class="hide-sm ink2" style="white-space:normal;min-width:150px">${esc(r.group||"–")}</td><td class="n">${r.rs}</td><td class="n">${r.grp??"–"}</td>
        <td class="n">${pct(r.off_hi)}</td><td class="n">${pct(r.e21)}</td><td class="n">${r.adr?.toFixed(1)}%</td></tr>`).join("")}</tbody></table></div></div>`;
    el.querySelectorAll(".chips")[0].onclick=e=>{const b=e.target.closest("button");if(!b)return;const v=b.dataset.v;SU.v.has(v)?SU.v.delete(v):SU.v.add(v);if(!SU.v.size)SU.v.add(v);SU.s.clear();draw();};
    el.querySelectorAll(".chips")[1].onclick=e=>{const b=e.target.closest("button");if(!b)return;const s=b.dataset.s;if(!s)SU.s.clear();else SU.s.has(s)?SU.s.delete(s):SU.s.add(s);draw();};
    el.querySelector("thead").onclick=e=>{const th=e.target.closest("th.sortable");if(!th)return;if(SU.sort===th.dataset.k)SU.dir*=-1;else{SU.sort=th.dataset.k;SU.dir=["t","setup","group"].includes(th.dataset.k)?1:-1;}draw();};
    el.querySelector("tbody").onchange=e=>{const c=e.target;if(!c.dataset.id)return;c.checked?SU.off.delete(c.dataset.id):SU.off.add(c.dataset.id);draw();};
    $("#ckAll").onchange=e=>{shown().forEach(r=>e.target.checked?SU.off.delete(r.t+r.setup):SU.off.add(r.t+r.setup));draw();};
    $("#sCopy").onclick=()=>{const by={};shown().filter(r=>!SU.off.has(r.t+r.setup)).forEach(r=>{(by[r.setup]||=[]).includes(r.t)||by[r.setup].push(r.t)});copyTv(tvList(Object.entries(by)),$("#sToast"));};
  }
  draw();
}

/* ---------- Read · Latest ---------- */
function mdLite(md){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null;
  md.split("\n").forEach(line=>{ const li=line.match(/^\s*[-*] (.*)/); if(li){(list||=[]).push("<li>"+inline(li[1])+"</li>");return;} if(list){out.push("<ul>"+list.join("")+"</ul>");list=null;} if(line.trim()) out.push("<p>"+inline(line)+"</p>"); });
  if(list) out.push("<ul>"+list.join("")+"</ul>"); return out.join("");
}
function pageRead(el){
  const st = S.story, cut = st.md.lastIndexOf("\n", 2600);
  el.innerHTML = `<div class="article"><article class="paper">
    <div class="kicker"><span>${day(st.date)} · ${st.slot==="pm"?"After the close":"Morning"}</span><span>The daily story</span></div>
    <h2>${esc(st.title)}</h2>
    <div class="byline">Written from the Market Monitor data with linked sources · ${day(st.date)}</div>
    <div class="prose">${mdLite(st.md.slice(0, cut>0?cut:2600))}</div></article>
    <aside class="aside"><div class="panel"><h4 class="mini-h">Groups in this story</h4><div class="plist"><span class="st st-other">Memory &amp; Storage</span><span class="st st-other">Neoclouds</span><span class="st st-blossom">Cybersecurity</span><span class="st st-ignition">Enterprise SaaS</span></div></div>
    <div class="panel"><h4 class="mini-h">Earlier</h4><div class="ink2" style="font-size:13px">Each chapter gets its own page and link in the Archive.</div></div></aside></div>`;
}
