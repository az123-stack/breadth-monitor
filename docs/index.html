<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breadth Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --surface-0: #f4f3f0;
  --surface-1: #fcfcfb;
  --border: #e3e1dc;
  --grid: #ebe9e4;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #7a7974;
  --up: #2a78d6;
  --down: #e34948;
  --s1: #2a78d6;
  --s2: #eb6834;
  --neutral-mid: #f0efec;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --tint-strong: 34%;
  --tint-light: 14%;
  --pos: #16a34a; --neg: #dc2626;
  --t1: 16%; --t2: 32%; --t3: 52%;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --up: #3987e5; --down: #e66767; --s1: #3987e5; --s2: #d95926; --neutral-mid: #383835;
    --tint-strong: 40%; --tint-light: 18%;
    --pos: #22c55e; --neg: #ef4444; --t1: 18%; --t2: 34%; --t3: 55%;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
  --up: #3987e5; --down: #e66767; --s1: #3987e5; --s2: #d95926; --neutral-mid: #383835;
  --tint-strong: 40%; --tint-light: 18%;
  --pos: #22c55e; --neg: #ef4444; --t1: 18%; --t2: 34%; --t3: 55%;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.meta { color: var(--text-secondary); font-size: 13px; }
.num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; }

/* Regime */
.regime { display: grid; grid-template-columns: 6px 1fr; overflow: hidden; margin-bottom: 14px; }
.regime .bar { background: var(--tone); }
.regime .body { padding: 16px 18px; }
.regime .label { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
.regime .label svg { flex: none; color: var(--tone); }
.regime .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); margin-bottom: 4px; }
.regime p { margin: 6px 0 0; color: var(--text-secondary); max-width: 760px; }
.regime ul { margin: 8px 0 0; padding-left: 18px; color: var(--text-secondary); font-size: 13px; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { padding: 12px 14px; }
.tile .k { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
.tile .v { font-size: 26px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; }
.tile .s { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
@media (max-width: 900px) { .tiles { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } .tile .v { font-size: 22px; } }

/* Charts */
.charts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin-bottom: 14px; }
.chart { padding: 14px 16px 8px; position: relative; min-width: 0; }
.chart h2, .tablecard h2 { font-size: 14px; font-weight: 600; margin: 0; }
.chart .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-secondary); margin: 4px 0 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 1px; vertical-align: 3px; width: 14px; }
.chart .plot { display: flex; align-items: flex-start; }
.chart .scroller { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-bottom: 4px; }
.chart .scroller { cursor: grab; scrollbar-color: var(--text-muted) var(--grid); }
.chart .scroller.dragging { cursor: grabbing; user-select: none; }
.chart .scroller::-webkit-scrollbar { height: 10px; }
.chart .scroller::-webkit-scrollbar-track { background: var(--grid); border-radius: 5px; }
.chart .scroller::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 5px; }
.chartbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; }
.chartbar .range { font-size: 13px; color: var(--text-secondary); }
.chartbar .range b { color: var(--text-primary); font-weight: 600; }
.navbtns { display: inline-flex; gap: 6px; }
.navbtns button { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; }
.navbtns button:hover { background: var(--neutral-mid); }
.navbtns button:disabled { opacity: .4; cursor: default; }
.chart svg { display: block; overflow: visible; }
.chart svg.yaxis { flex: none; }
.chart .hint { font-size: 11.5px; color: var(--text-muted); margin-left: auto; }
.chart svg text { fill: var(--text-muted); font-size: 11px; font-family: Inter, system-ui, sans-serif; }
.tip {
  position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12);
  opacity: 0; transition: opacity .08s; white-space: nowrap; z-index: 2;
}
.tip b { display: block; margin-bottom: 3px; font-weight: 600; }
.tip div { display: flex; justify-content: space-between; gap: 14px; color: var(--text-secondary); }
.tip span:last-child { color: var(--text-primary); }

/* Table */
.tablecard { padding: 14px 0 0; }
.tablecard .head { display: flex; justify-content: space-between; align-items: center; padding: 0 16px 10px; gap: 10px; flex-wrap: wrap; }
.toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.toggle button { background: none; border: 0; padding: 5px 10px; font: inherit; font-size: 12px; color: var(--text-secondary); cursor: pointer; }
.toggle button[aria-pressed="true"] { background: var(--neutral-mid); color: var(--text-primary); font-weight: 600; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { padding: 6px 10px; text-align: right; white-space: nowrap; border-top: 1px solid var(--grid); }
th { position: sticky; top: 0; background: var(--surface-1); font-weight: 600; color: var(--text-secondary); font-size: 11.5px; vertical-align: bottom; line-height: 1.25; }
th small { display: block; font-weight: 400; color: var(--text-muted); }
td:first-child, th:first-child { text-align: left; position: sticky; left: 0; background: var(--surface-1); z-index: 1; }
td.grp, th.grp { border-left: 1px solid var(--border); }
td.u2 { background: color-mix(in srgb, var(--up) var(--tint-strong), transparent); }
td.u1 { background: color-mix(in srgb, var(--up) var(--tint-light), transparent); }
td.d2 { background: color-mix(in srgb, var(--down) var(--tint-strong), transparent); }
td.d1 { background: color-mix(in srgb, var(--down) var(--tint-light), transparent); }
.key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-muted); padding: 10px 16px 14px; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; }
.signals { padding: 14px 16px 10px; margin-bottom: 14px; }
.signals .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.signals h2 { font-size: 14px; font-weight: 600; margin: 0; }
.signals .more { background: none; border: 0; color: var(--text-secondary); font: inherit; font-size: 12.5px; cursor: pointer; text-decoration: underline; }
.sig { display: grid; grid-template-columns: 22px 92px 1fr; gap: 4px 10px; align-items: start; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--grid); padding: 8px 4px; font: inherit; color: inherit; cursor: pointer; border-radius: 6px; }
.sig:hover { background: var(--neutral-mid); }
.sig svg { margin-top: 1px; }
.sig .d { color: var(--text-secondary); font-size: 13px; }
.sig .t { font-weight: 600; font-size: 13.5px; }
.sig .t small { display: block; font-weight: 400; color: var(--text-secondary); font-size: 12.5px; margin-top: 1px; }
.sig.minor .t { font-weight: 500; }
@media (max-width: 520px) { .sig { grid-template-columns: 22px 1fr; } .sig .d { grid-column: 2; } .sig .t { grid-column: 2; } }
/* ---------- green/red return fills ---------- */
.g1 { background: color-mix(in srgb, var(--pos) var(--t1), transparent); }
.g2 { background: color-mix(in srgb, var(--pos) var(--t2), transparent); }
.g3 { background: color-mix(in srgb, var(--pos) var(--t3), transparent); font-weight: 600; }
.r1 { background: color-mix(in srgb, var(--neg) var(--t1), transparent); }
.r2 { background: color-mix(in srgb, var(--neg) var(--t2), transparent); }
.r3 { background: color-mix(in srgb, var(--neg) var(--t3), transparent); font-weight: 600; }
/* ---------- browse ---------- */
.browsebar { padding: 10px 14px; margin-bottom: 10px; }
.browsebar .filters { justify-content: flex-start; }
.browse { display: grid; gap: 8px; }
.bucket { overflow: hidden; }
.bucket summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 10px 14px; cursor: pointer; flex-wrap: wrap; }
.bucket summary::-webkit-details-marker { display: none; }
.bucket summary::before { content: "▸"; color: var(--text-muted); transition: transform .12s; }
.bucket[open] summary::before { transform: rotate(90deg); }
.bucket .bname { font-weight: 600; flex: 1 1 260px; min-width: 0; }
.bucket .bname small { display: block; font-weight: 400; color: var(--text-muted); font-size: 12px; }
.bucket .bret { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.bucket .bret span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; padding: 3px 7px; border-radius: 6px; min-width: 74px; text-align: right; }
.bucket .bret em { font-style: normal; font-family: Inter, system-ui, sans-serif; color: var(--text-muted); margin-right: 5px; font-size: 11px; }
.bucket .bbody { border-top: 1px solid var(--grid); padding: 6px 0 4px; }
/* ---------- tabs ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: 0 0 16px; }
.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; padding: 8px 14px; font: inherit; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--text-primary); border-bottom-color: var(--s1); font-weight: 600; }
.livebar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 9px 14px; margin-bottom: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); font-size: 13px; color: var(--text-secondary); }
.livebar b { color: var(--text-primary); }
.livebar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); flex: none; }
.livebar .dot.on { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.livebar button { margin-left: auto; background: var(--surface-0); border: 1px solid var(--border); border-radius: 8px; padding: 4px 12px; font: inherit; font-size: 12.5px; color: var(--text-primary); cursor: pointer; }
/* ---------- pulse ---------- */
.pulse { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
@media (max-width: 760px) { .pulse { grid-template-columns: 1fr; } }
.pside { padding: 14px 16px; }
.pside .kicker { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
.pside .big { display: flex; align-items: baseline; gap: 10px; margin: 4px 0 2px; flex-wrap: wrap; }
.pside .big b { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
.pside .big span { color: var(--text-secondary); font-size: 13px; }
.pside .lbl { font-weight: 600; font-size: 14.5px; }
.meter { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin: 8px 0 10px; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.parts { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.parts td { border-top: 1px solid var(--grid); padding: 5px 6px 5px 0; text-align: left; white-space: normal; vertical-align: top; }
.parts td.pts { text-align: right; white-space: nowrap; font-family: "JetBrains Mono", ui-monospace, monospace; }
.parts td.note { color: var(--text-muted); }
.spark { display: block; margin-top: 8px; }
/* ---------- tables ---------- */
.tcard { padding: 12px 0 0; margin-bottom: 14px; }
.tcard .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 0 16px 10px; }
.tcard h2 { font-size: 14px; font-weight: 600; margin: 0; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.filters input, .filters select { background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font: inherit; font-size: 13px; }
.filters input { width: 170px; }
.chips { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.chips button { background: none; border: 0; padding: 5px 10px; font: inherit; font-size: 12.5px; color: var(--text-secondary); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--neutral-mid); color: var(--text-primary); font-weight: 600; }
table.grid th { cursor: pointer; user-select: none; }
table.grid th[aria-sort] { color: var(--text-primary); }
table.grid th[aria-sort="descending"]::after { content: " ▾"; }
table.grid th[aria-sort="ascending"]::after { content: " ▴"; }
table.grid td.l, table.grid th.l { text-align: left; }
table.grid tr.trow { cursor: pointer; }
table.grid tr.trow:hover td { background: color-mix(in srgb, var(--neutral-mid) 60%, transparent); }
table.grid tr.open td { background: var(--neutral-mid); }
table.grid td.tname { font-weight: 600; white-space: nowrap; }
@media (max-width: 520px) { table.grid td.tname { white-space: normal; min-width: 128px; max-width: 150px; } }
table.grid td.tname small { display: block; font-weight: 400; color: var(--text-muted); font-size: 11.5px; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.trail { display: inline-flex; gap: 1px; vertical-align: middle; }
.trail i { width: 4px; border-radius: 1px; background: var(--s1); display: inline-block; }
.mv { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
.mv.up { color: var(--good); } .mv.dn { color: var(--critical); }
tr.drill > td { padding: 0 0 10px 0; background: var(--surface-0); }
.drillbox { padding: 10px 12px 4px; }
.drillbox .meta { margin: 0 0 6px; }
.drillbox table { font-size: 12px; }
.tier { display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 5px; font-weight: 700; font-size: 11.5px; text-align: center; }
.tier.A { background: color-mix(in srgb, var(--good) 28%, transparent); }
.tier.B { background: color-mix(in srgb, var(--warning) 26%, transparent); }
.tier.C { background: var(--neutral-mid); color: var(--text-secondary); }
.more-row { text-align: center; padding: 10px; }
.more-row button { background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 14px; font: inherit; font-size: 13px; color: var(--text-primary); cursor: pointer; }
.note { color: var(--text-muted); font-size: 12px; padding: 0 16px 14px; line-height: 1.55; }
.note a { color: var(--text-secondary); }
footer { color: var(--text-muted); font-size: 12px; margin-top: 18px; line-height: 1.6; }
footer a { color: var(--text-secondary); }
.empty { padding: 40px; text-align: center; color: var(--text-secondary); }

  bear:    { color: "var(--critical)", icon: '<path d="M4 8l5 5 4-4 7 7M14 16h6v-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' },
  warn:    { color: "var(--warning)",  icon: '<path d="M12 3l9.5 17h-19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 10v4.5M12 17.2v.3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
  neutral: { color: "var(--text-muted)", icon: '<path d="M4 12h16M4 7h10M4 17h13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>' },
};

let TAB = "breadth";
try { const h = location.hash.slice(1); if (["breadth", "themes", "browse", "stocks"].includes(h)) TAB = h; } catch (e) {}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (!DATA || !DATA.rows || !DATA.rows.length) {
    app.innerHTML = '<div class="card empty">No data yet. Run the backfill workflow once to load history.</div>';
    return;
  }
  const last = DATA.rows[DATA.rows.length - 1], gen = new Date(DATA.generated);
  app.append($(`<header>
    <div><h1>Market Breadth Monitor</h1>
    <div class="meta">Data through ${longDate(last.date)}</div></div>
    <div class="meta">Updated ${gen.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })} · ${fmt(DATA.history_days)} days of history</div>
  </header>`));
  const tabs = $(`<nav class="tabs" role="tablist">
    <button role="tab" data-tab="breadth">Breadth</button>
    <button role="tab" data-tab="themes">Themes</button>
    <button role="tab" data-tab="browse">Browse</button>
    <button role="tab" data-tab="stocks">Stocks</button></nav>`);
  app.append(tabs);
  const panel = $('<div class="panel"></div>');
  app.append(panel);
  const show = () => {
    tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === TAB));
    panel.innerHTML = "";
    if (TAB === "themes") renderThemes(panel);
    else if (TAB === "stocks") renderStocks(panel);
    else if (TAB === "browse") renderBrowse(panel);
    else renderBreadth(panel);
  };
  tabs.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    TAB = b.dataset.tab;
    try { history.replaceState(null, "", "#" + TAB); } catch (e) {}
    show();
  }));
  show();
}

function renderBreadth(app) {
  const rows = DATA.rows, last = rows[rows.length - 1], R = DATA.regime, P = DATA.percentiles || {};

  const tone = TONES[R.tone] || TONES.neutral;
  app.append($(`<section class="card regime" style="--tone:${tone.color}">
    <div class="bar"></div>
    <div class="body">
      <div class="kicker">Market regime</div>
      <div class="label"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">${tone.icon}</svg>${R.label}</div>
      <p>${R.advice}</p>
      <ul>${R.reasons.map(r => `<li>${r}</li>`).join("")}</ul>
    </div></section>`));

  const pct = (k) => P[k] != null ? `${ord(P[k])} percentile of your history` : "building history";
  const tiles = [
    ["Up 4%+ today", fmt(last.up4), last.up4_avg40 != null ? `40-day avg ${fmt(last.up4_avg40)}` : pct("up4")],
    ["Down 4%+ today", fmt(last.dn4), pct("dn4")],
    ["5-day ratio", fmt(last.ratio5, 2), pct("ratio5")],
    ["10-day ratio", fmt(last.ratio10, 2), pct("ratio10")],
    ["T2108", fmt(last.t2108, 1), "% of stocks above 40-day MA"],
    ["Up / down 25% qtr", `${fmt(last.up25q)} / ${fmt(last.dn25q)}`, "65-day moves"],
  ];
  const tl = $('<section class="tiles"></section>');
  tiles.forEach(([k, v, s]) => tl.append($(`<div class="card tile"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`)));
  app.append(tl);
  IDX = Object.fromEntries(rows.map((r, i) => [r.date, i]));
  EVBY = {}; (DATA.events || []).forEach(e => { (EVBY[e.date] = EVBY[e.date] || []).push(e); });
  app.append(signalsCard());

  const bar = $(`<div class="chartbar"><div class="range"></div><div class="navbtns">
    <button data-go="-1" aria-label="Show earlier dates">‹ Earlier</button>
    <button data-go="1" aria-label="Show later dates">Later ›</button>
    <button data-go="end">Latest</button></div></div>`);
  app.append(bar);
  const charts = $('<section class="charts"></section>');
  app.append(charts);
  const view = Math.max(260, Math.round(charts.clientWidth - 34 - AXW));
  pxDay = view < 600 ? 4 : 7;                          // ~3 months visible on a phone, ~6 on desktop
  W = Math.max(view, rows.length * pxDay + M.l + M.r);
  H = view < 560 ? 190 : 210;
  charts.append(chartBreakouts(rows));
  charts.append(chartTrend(rows));
  charts.append(chartRatios(rows));
  charts.append(chartT2108(rows));
  syncScroll([...charts.querySelectorAll(".scroller")], bar, rows);
  app.append(table(rows));

  app.append($(`<footer>
    <b>Definitions.</b> Universe: US common stocks, close ≥ $3. 4% days: close ≥ 4% above (or below) the prior close on volume above the prior day and ≥ 100k.
    5/10-day ratio: sum of 4% up days ÷ sum of 4% down days over the window. 25%/qtr: change over 65 trading days; month: 20 days; 34-day: 13%.
    Slower metrics and T2108 use stocks with 20-day avg volume ≥ 100k. Table shading compares each value with your own history (darker = beyond the 10th/90th percentile).
    Regime thresholds are starter values; calibrate them in <code>breadth/config.py</code>.
    · <a href="breadth.csv">Download full history (CSV)</a></footer>`));
}

/* ---------- signal events ---------- */
const EV_STYLE = {
  thrust:        { color: "var(--good)",     dash: "",     short: "Thrust",     icon: "up" },
  followthrough: { color: "var(--good)",     dash: "4 3",  short: "Follow-thru", icon: "up" },
  washout:       { color: "var(--critical)", dash: "",     short: "Washout",    icon: "down" },
  buyers:        { color: "var(--up)",       dash: "",     short: "Buyers",     icon: "up" },
  sellers:       { color: "var(--down)",     dash: "",     short: "Sellers",    icon: "down" },
  extended:      { color: "var(--warning)",  dash: "",     short: "Extended",   icon: "warn" },
};
const EV_ICON = {
  up:   '<path d="M3 13l5-5 3 3 6-6M12 5h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  down: '<path d="M3 7l5 5 3-3 6 6M12 15h5v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
  warn: '<path d="M10 3l8 14H2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8.5v3.5M10 14.6v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
};
const evIcon = (e) => `<svg width="18" height="18" viewBox="0 0 20 20" style="color:${EV_STYLE[e.kind].color}" aria-hidden="true">${EV_ICON[EV_STYLE[e.kind].icon]}</svg>`;
let EVBY = {}, IDX = {}, scrollToIndex = () => {};

// Major events: a thin vertical line through every chart. withTags: label pills at the top.
function eventLines(c, x, withTags) {
  let lastX = -1e9, row = 0;
  (DATA.events || []).forEach(e => {
    const i = IDX[e.date]; if (i == null) return;
    const st = EV_STYLE[e.kind];
    if (e.tier !== "major") return;
    S("line", { x1: x(i), x2: x(i), y1: M.t - 6, y2: c.h - M.b, stroke: st.color, "stroke-width": 1.5, "stroke-dasharray": st.dash, opacity: 0.85 }, c.svg);
    if (withTags) {
      const g = S("g", {}, c.svg);
      row = x(i) - lastX < 70 ? (row + 1) % 2 : 0; lastX = x(i);
      const tx = S("text", { x: x(i) + 5, y: M.t + 4 + row * 13, style: `fill:${st.color};font-weight:600;font-size:10.5px` }, g);
      tx.textContent = st.short;
    }
  });
}
// Minor events: a small marker on a line series.
function eventMarkers(c, x, y, rows, key, kinds) {
  (DATA.events || []).forEach(e => {
    if (!kinds.includes(e.kind)) return;
    const i = IDX[e.date]; if (i == null || rows[i][key] == null) return;
    const st = EV_STYLE[e.kind], cx = x(i), cy = y(rows[i][key]);
    const up = st.icon !== "down";
    S("path", { d: up ? `M${cx},${cy - 13} l6,9 h-12z` : `M${cx},${cy + 13} l6,-9 h-12z`, fill: st.color, stroke: "var(--surface-1)", "stroke-width": 1.5 }, c.svg);
  });
}

function signalsCard() {
  const evs = (DATA.events || []).slice().reverse();
  const el = $(`<section class="card signals"><div class="head"><h2>Signals</h2><button class="more"></button></div><div class="list"></div></section>`);
  if (!evs.length) { el.querySelector(".list").innerHTML = '<div class="meta">No signals yet.</div>'; el.querySelector(".more").remove(); return el; }
  const list = el.querySelector(".list"), more = el.querySelector(".more");
  let all = false;
  const draw = () => {
    list.innerHTML = "";
    evs.slice(0, all ? evs.length : 3).forEach(e => {
      const b = $(`<button class="sig ${e.tier}">${evIcon(e)}<span class="d">${new Date(e.date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span><span class="t">${e.label}<small>${e.detail}</small></span></button>`);
      b.addEventListener("click", () => scrollToIndex(IDX[e.date]));
      list.append(b);
    });
    more.textContent = all ? "Show fewer" : `Show all ${evs.length}`;
    more.style.display = evs.length > 3 ? "" : "none";
  };
  more.addEventListener("click", () => { all = !all; draw(); });
  draw();
  return el;
}

/* ---------- small SVG chart kit ---------- */
function syncScroll(list, bar, rows) {
  let lock = false;
  const range = bar.querySelector(".range"), btns = bar.querySelectorAll("button");
  const label = () => {
    const sc = list[0];
    const i0 = Math.max(0, Math.floor((sc.scrollLeft - M.l) / pxDay));
    const i1 = Math.min(rows.length - 1, Math.floor((sc.scrollLeft + sc.clientWidth - M.l) / pxDay) - 1);
    const fmtD = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    range.innerHTML = `Showing <b>${fmtD(rows[i0].date)}</b> – <b>${fmtD(rows[Math.max(i0, i1)].date)}</b>`;
    const max = sc.scrollWidth - sc.clientWidth;
    btns[0].disabled = sc.scrollLeft <= 1;
    btns[1].disabled = btns[2].disabled = sc.scrollLeft >= max - 1;
  };
  const setAll = (v) => { list.forEach(o => { o.scrollLeft = v; }); label(); };
  list.forEach(sc => {
    sc.addEventListener("scroll", () => {
      if (lock) return; lock = true;
      list.forEach(o => { if (o !== sc) o.scrollLeft = sc.scrollLeft; });
      label();
      requestAnimationFrame(() => { lock = false; });
    }, { passive: true });
    // Click-and-drag to pan (mouse); touch devices already swipe natively.
    let drag = null;
    sc.addEventListener("pointerdown", (e) => {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      drag = { x: e.clientX, left: sc.scrollLeft, moved: false };
    });
    window.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x;
      if (Math.abs(dx) > 3) { drag.moved = true; sc.classList.add("dragging"); }
      if (drag.moved) setAll(drag.left - dx);
    });
    window.addEventListener("pointerup", () => { if (drag) { drag = null; sc.classList.remove("dragging"); } });
  });
  btns.forEach(b => b.addEventListener("click", () => {
    const sc = list[0], page = sc.clientWidth * 0.8;
    const v = b.dataset.go === "end" ? sc.scrollWidth : sc.scrollLeft + Number(b.dataset.go) * page;
    list.forEach(o => o.scrollTo({ left: v, behavior: "smooth" }));
  }));
  scrollToIndex = (i) => {
    if (i == null) return;
    const sc = list[0], v = M.l + i * pxDay - sc.clientWidth / 2;
    list.forEach(o => o.scrollTo({ left: v, behavior: "smooth" }));
    list[0].closest(".charts").scrollIntoView({ behavior: "smooth", block: "start" });
  };
  requestAnimationFrame(() => setAll(list[0].scrollWidth));
}
let W = 1100, H = 210, pxDay = 7;
const M = { t: 14, r: 26, b: 24, l: 26 };
const AXW = 40;          // fixed y-axis column outside the scroll area
function frame(title, legend, height = H) {
  const el = $(`<div class="card chart"><h2>${title}</h2><div class="legend">${legend}</div><div class="plot"><div class="scroller"></div></div></div>`);
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${height}`);
  svg.setAttribute("width", W); svg.setAttribute("height", height);
  svg.setAttribute("role", "img"); svg.setAttribute("aria-label", title);
  el.querySelector(".scroller").append(svg);
  const ax = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  ax.setAttribute("class", "yaxis"); ax.setAttribute("viewBox", `0 0 ${AXW} ${height}`);
  ax.setAttribute("width", AXW); ax.setAttribute("height", height);
  el.querySelector(".plot").append(ax);
  const tip = $('<div class="tip"></div>'); el.append(tip);
  return { el, svg, ax, tip, h: height, scroller: el.querySelector(".scroller") };
}
const S = (tag, attrs, parent) => { const n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.append(n); return n; };

function yLabel(c, yy, text) { const tx = S("text", { x: 4, y: yy + 4 }, c.ax); tx.textContent = text; }
function axes(c, rows, y, ticks, fmtY) {
  const svg = c.svg, h = c.h;
  const g = S("g", {}, svg);
  ticks.forEach(t => {
    S("line", { x1: M.l, x2: W - M.r, y1: y(t), y2: y(t), stroke: "var(--grid)", "stroke-width": 1 }, g);
    yLabel(c, y(t), fmtY(t));
  });
  const n = rows.length, x = (i) => M.l + (i + 0.5) * (W - M.l - M.r) / n;
  const step = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(W / 130))));
  for (let i = n - 1; i >= 0; i -= step) {
    const tx = S("text", { x: x(i), y: h - 6, "text-anchor": "middle" }, g); tx.textContent = shortDate(rows[i].date);
  }
  return x;
}

function hover(c, rows, x, lines) {
  const n = rows.length, bw = (W - M.l - M.r) / n;
  const cross = S("line", { y1: M.t, y2: c.h - M.b, stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "3 3", opacity: 0 }, c.svg);
  const hit = S("rect", { x: M.l, y: 0, width: W - M.l - M.r, height: c.h, fill: "transparent" }, c.svg);
  const move = (ev) => {
    const pt = ev.touches ? ev.touches[0] : ev;
    const r = c.svg.getBoundingClientRect();
    const sx = (pt.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(n - 1, Math.floor((sx - M.l) / bw)));
    const row = rows[i];
    cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("opacity", 1);
    c.tip.innerHTML = `<b>${longDate(row.date)}</b>` + lines.map(([lab, f]) => `<div><span>${lab}</span><span class="num">${f(row)}</span></div>`).join("")
      + (EVBY[row.date] || []).map(e => `<div style="margin-top:4px"><span style="color:${EV_STYLE[e.kind].color};font-weight:600">● ${e.label}</span><span></span></div>`).join("");
    const er = c.el.getBoundingClientRect();     // SVG elements have no offsetTop/Left
    const px = r.left - er.left + x(i) * r.width / W;
    const tw = c.tip.offsetWidth;
    const right = px + 14 + tw < er.width - 4;    // sit beside the crosshair, flip near the edge
    c.tip.style.left = (right ? px + 14 : Math.max(4, px - 14 - tw)) + "px";
    c.tip.style.top = (r.top - er.top + 4) + "px";
    c.tip.style.opacity = 1;
  };
  const leave = () => { cross.setAttribute("opacity", 0); c.tip.style.opacity = 0; };
  hit.addEventListener("mousemove", move); hit.addEventListener("touchmove", move, { passive: true });
  hit.addEventListener("touchstart", move, { passive: true });
  hit.addEventListener("mouseleave", leave); hit.addEventListener("touchend", leave);
}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v || 1))); return Math.ceil((v || 1) / p * 2) / 2 * p; }
function path(rows, x, y, key) {
  let d = "", pen = false;
  rows.forEach((r, i) => { const v = r[key]; if (v == null) { pen = false; return; } d += (pen ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1); pen = true; });
  return d;
}
function endLabel(svg, x, y, rows, key, text, color) {
  for (let i = rows.length - 1; i >= 0; i--) if (rows[i][key] != null) {
    S("circle", { cx: x(i), cy: y(rows[i][key]), r: 4, fill: color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    return;
  }
}

function chartBreakouts(rows) {
  const c = frame("Stocks up / down 4%+ per day",
    '<span><i style="background:var(--up)"></i>Up 4%+</span><span><i style="background:var(--down)"></i>Down 4%+</span><span><i class="line" style="background:var(--text-secondary)"></i>40-day avg of up 4%+</span><span><i class="line" style="background:var(--text-muted);height:0;border-top:2px dashed var(--text-muted)"></i>Thrust level (2× avg)</span>');
  // Scale to normal days, not the rare spike: cap at the 95th percentile of the
  // window (or the thrust line), and label any bar that runs past the top.
  const vals = rows.flatMap(r => [r.up4 || 0, r.dn4 || 0]).sort((a, b) => a - b);
  const p95 = vals[Math.floor(vals.length * 0.95)] || 1;
  const thrustMax = Math.max(...rows.map(r => (r.up4_avg40 || 0) * 2));
  const mx = niceMax(Math.max(p95, thrustMax) * 1.05);
  const mid = M.t + (c.h - M.t - M.b) / 2, half = (c.h - M.t - M.b) / 2;
  const cap = (v) => Math.min(v, mx);
  const y = (v) => mid - cap(v) / mx * half;
  const yd = (v) => mid + cap(v) / mx * half;
  const x = axes(c, rows, y, [mx, mx / 2, 0], v => fmt(v));
  [mx / 2, mx].forEach(t => { S("line", { x1: M.l, x2: W - M.r, y1: yd(t), y2: yd(t), stroke: "var(--grid)" }, c.svg); yLabel(c, yd(t), fmt(t)); });
  const bw = (W - M.l - M.r) / rows.length, w = Math.max(1, bw - 2);
  const clipped = [];
  rows.forEach((r, i) => {
    const x0 = x(i) - w / 2;
    if (r.up4) S("rect", { x: x0, y: y(r.up4), width: w, height: mid - y(r.up4), rx: Math.min(2, w / 3), fill: "var(--up)" }, c.svg);
    if (r.dn4) S("rect", { x: x0, y: mid, width: w, height: yd(r.dn4) - mid, rx: Math.min(2, w / 3), fill: "var(--down)" }, c.svg);
    if (r.up4 > mx) clipped.push([i, r.up4, true]);
    if (r.dn4 > mx) clipped.push([i, r.dn4, false]);
  });
  S("line", { x1: M.l, x2: W - M.r, y1: mid, y2: mid, stroke: "var(--text-muted)", "stroke-width": 1 }, c.svg);
  eventLines(c, x, false);
  const thr = rows.map(r => ({ v: r.up4_avg40 != null ? r.up4_avg40 * 2 : null }));
  S("path", { d: path(thr, x, y, "v"), fill: "none", stroke: "var(--text-muted)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }, c.svg);
  S("path", { d: path(rows, x, y, "up4_avg40"), fill: "none", stroke: "var(--text-secondary)", "stroke-width": 2, "stroke-linejoin": "round" }, c.svg);
  clipped.forEach(([i, v, up]) => {
    const tx = S("text", { x: x(i), y: up ? M.t - 2 : c.h - M.b + 12, "text-anchor": "middle", style: "fill:var(--text-primary);font-weight:600" }, c.svg);
    tx.textContent = fmt(v) + (up ? " ▲" : " ▼");
  });
  hover(c, rows, x, [["Up 4%+", r => fmt(r.up4)], ["Down 4%+", r => fmt(r.dn4)], ["40-day avg", r => fmt(r.up4_avg40)], ["Thrust level", r => r.up4_avg40 == null ? "–" : fmt(r.up4_avg40 * 2)]]);
  return c.el;
}

function chartTrend(rows) {
  const c = frame("Breakout trend: 20-day vs 40-day averages",
    '<span><i class="line" style="background:var(--up)"></i>20-day avg up 4%+</span><span><i class="line" style="background:var(--text-secondary)"></i>40-day avg up 4%+</span><span><i class="line" style="background:var(--down)"></i>20-day avg down 4%+</span><span>▲▼ buyers / sellers take control</span><span>│ major signal (see Signals)</span>', 200);
  // Zoomed to the averages' own range so turns are visible.
  const keys = ["up4_avg20", "up4_avg40", "dn4_avg20"];
  const vs = rows.flatMap(r => keys.map(k => r[k])).filter(v => v != null);
  const lo = Math.max(0, Math.floor(Math.min(...vs) / 25) * 25), hi = Math.ceil(Math.max(...vs) / 25) * 25;
  const y = (v) => M.t + (1 - (v - lo) / (hi - lo || 1)) * (c.h - M.t - M.b);
  const step = hi - lo <= 100 ? 25 : 50, ticks = [];
  for (let t = Math.ceil(lo / step) * step; t <= hi; t += step) ticks.push(t);
  const x = axes(c, rows, y, ticks, v => fmt(v));
  S("path", { d: path(rows, x, y, "dn4_avg20"), fill: "none", stroke: "var(--down)", "stroke-width": 2, "stroke-linejoin": "round" }, c.svg);
  S("path", { d: path(rows, x, y, "up4_avg40"), fill: "none", stroke: "var(--text-secondary)", "stroke-width": 2, "stroke-linejoin": "round" }, c.svg);
  S("path", { d: path(rows, x, y, "up4_avg20"), fill: "none", stroke: "var(--up)", "stroke-width": 2, "stroke-linejoin": "round" }, c.svg);
  eventLines(c, x, true);
  eventMarkers(c, x, y, rows, "up4_avg20", ["buyers", "sellers"]);

let LIVE = null;          // { fetched: Date, spyDate: "YYYY-MM-DD", spyTime: string, prices: {t: p} }
let LIVE_ERR = null, LIVE_T = null, LIVE_BUSY = false;
const UI = { hz: "short",
  themes: { view: "theme", cls: "All", q: "", open: new Set(), sort: ["rank", 1] },
  browse: { view: "theme", order: "rank", q: "", open: new Set(), all: false },
  stocks: { tier: "All", theme: "", sub: "", q: "", limit: 100, sort: ["setup", -1] } };

function parseLiveCSV(text) {
  const prices = {}; let spyTime = null;
  text.split(/\r?\n/).forEach(line => {
    const i = line.indexOf(","); if (i < 0) return;
    const k = line.slice(0, i).trim().replace(/^"|"$/g, ""), v = line.slice(i + 1).trim().replace(/^"|"$/g, "");
    if (k === "_spytime") spyTime = v;
    else if (k && k[0] !== "_" && k !== "ticker") { const n = parseFloat(v.replace(/[$,]/g, "")); if (isFinite(n) && n > 0) prices[k.toUpperCase()] = n; }
  });
  let spyDate = null;
  const m = spyTime && spyTime.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) spyDate = `${m[3]}-${m[1].padStart(2, "0")}-${m[2].padStart(2, "0")}`;
  return { prices, spyTime, spyDate };
}

async function fetchLive() {
  if (!DATA.live_url || !DATA.themes || LIVE_BUSY) return;
  LIVE_BUSY = true;
  try {
    const url = DATA.live_url + (DATA.live_url.includes("?") ? "&" : "?") + "cb=" + Date.now();
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const parsed = parseLiveCSV(await r.text());
    if (!Object.keys(parsed.prices).length) throw new Error("no prices in sheet");
    LIVE = { ...parsed, fetched: new Date() }; LIVE_ERR = null;
    LIVE_T = liveActive() ? computeLive(DATA.themes, LIVE.prices, LIVE.spyDate) : null;
  } catch (e) { LIVE_ERR = String(e.message || e); }
  LIVE_BUSY = false;
  if (TAB === "themes" || TAB === "stocks" || TAB === "browse") rerenderPanel();
}
const liveActive = () => !!(LIVE && LIVE.spyDate && DATA.themes && LIVE.spyDate > DATA.themes.date);
const getT = () => LIVE_T || DATA.themes;

function liveMetrics(T, prices) {
  const K = T.ref_keys, M = {}, bad = [];
  const ix = Object.fromEntries(K.map((k, i) => [k, i]));
  for (const t in T.refs) {
    const r = T.refs[t], p = prices[t], c1 = r[ix.c1];
    if (p == null || !c1) continue;
    if (Math.abs(p / c1 - 1) > 0.5) { bad.push(t); continue; }  // wrong listing or bad print
    const ret = (k) => (ix[k] != null && r[ix[k]]) ? p / r[ix[k]] - 1 : null;
    const m = { price: p, today: p / c1 - 1, d3: ret("c3"), d5: ret("c5"), d15: ret("c15"), d20: ret("c20"), d30: ret("c30"),
                d60: ret("c60"), d90: ret("c90"), d180: ret("c180") };
    m.rs = r[ix.c63] ? (p / r[ix.c63] - 1) * 100 : null;
    const z = (v) => v ?? 0;
    m.st = (m.today * 3 + z(m.d3) + z(m.d5) * 2) / 6;
    m.lt = (m.today + z(m.d3) + z(m.d5) * 2 + z(m.d15) * 2 + z(m.d20) * 2 + z(m.d30) * 3) / 11;
    [[8, "ema8"], [21, "ema21"], [50, "ema50"]].forEach(([n, k]) => {
      const e = r[ix[k]]; if (e == null) { m["e" + n] = null; return; }
      const a = 2 / (n + 1), en = p * a + e * (1 - a); m["e" + n] = p / en - 1;
    });
    M[t] = m;
  }
  return { M, bad };
}

function rotationOf(a) {
  const t = a.today ?? 0, d5 = a.d5 ?? 0, d15 = a.d15 ?? 0, d30 = a.d30 ?? 0;
  if (d30 > 0.05 && t < 0 && d5 < 0) return "Late / Cooling";
  if (t > 0 && d5 > 0.03 && d15 > 0.05 && d30 > 0.05) return "Mid Rotation";
  if (t > 0 && d30 > 0.05) return "Early Rotation";
  return "Neutral";
}
const blabel = (x) => x >= 0.7 ? "Wide" : x >= 0.4 ? "Moderate" : "Narrow";
const mean = (a) => { const v = a.filter(x => x != null && isFinite(x)); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };

function setupScoreJS(ts, s) {
  const ok = (v) => v != null && isFinite(v);
  let p = ts >= 7 ? 2 : ts >= 4 ? 1 : 0;
  if (ok(s.d15) && ok(s.d30) && s.d15 > 0 && s.d30 > 0) p += (ok(s.rs) && s.rs > 0 && ok(s.lt) && s.lt > 0.02) ? 2 : 1;
  const near = (v) => ok(v) && v >= -0.03 && v <= 0.01;
  if (near(s.e8) || near(s.e21)) p += 2;
  if (ok(s.today) && s.today > 0) p += 1;
  if (ok(s.d5) && ok(s.d15) && ok(s.d30) && s.d5 < 0.02 && s.d15 > 0.05 && s.d30 > 0.05) p += 1;
  if (ok(s.rs) && s.rs > 0) p += 1;
  if (ok(s.d5) && ok(s.today) && Math.abs(s.d5) < 0.02 && Math.abs(s.today) < 0.03 && s.d15 > 0.05 && s.d30 > 0.05) p += 1;
  return p;
}

function pulseJS(rows) {
  const N = Math.max(rows.length, 1), cnt = (f) => rows.filter(f).length;
  const strong = cnt(r => r.score >= 7), weak = cnt(r => r.score <= 2);
  const green = cnt(r => r.today > 0) / N, red = cnt(r => r.today < 0) / N;
  const mid = cnt(r => r.rotation === "Mid Rotation"), cool = cnt(r => r.rotation === "Late / Cooling");
  const stW = cnt(r => r.st_label === "Wide") / N, stN = cnt(r => r.st_label === "Narrow") / N, ltW = cnt(r => r.lt_label === "Wide") / N;
  const negRS = cnt(r => r.rs < 0);
  const tiers = (x, a, b, c) => x >= a ? 3 : x >= b ? 2 : x >= c ? 1 : 0, two = (x, a, b) => x >= a ? 2 : x >= b ? 1 : 0;
  const P = (name, value, pts, max, note) => ({ name, value, pts, max, note });
  const lp = [
    P("Strong themes (7+/8)", `${strong} of ${N}`, tiers(strong / N, .25, .15, .08), 3, strong / N >= .25 ? "Wide leadership — high conviction to trade long" : strong / N >= .08 ? "Some leaders — be selective" : "Few leaders — sit on hands"),
    P("Themes green today", `${Math.round(green * 100)}% of themes`, two(green, .55, .35), 2, green >= .55 ? "Majority green — good day to trade long" : green >= .35 ? "Mixed — selective only" : "Mostly red — avoid longs"),
    P("Mid-rotation themes", `${mid} themes`, mid >= 5 ? 2 : mid >= 3 ? 1 : 0, 2, mid >= 5 ? "Strong rotation — multiple themes accelerating" : mid >= 3 ? "Rotation present — follow the leaders" : "Little rotation — wait"),
    P("Short-term breadth wide", `${Math.round(stW * 100)}% of themes`, two(stW, .35, .15), 2, stW >= .35 ? "Broad participation — confirms the move" : "Narrow breadth — thin leadership"),
    P("Long-term breadth wide", `${Math.round(ltW * 100)}% of themes`, ltW >= .4 ? 1 : 0, 1, ltW >= .4 ? "Strong structural base — trend has legs" : "LT breadth thin — reversal risk"),
  ];
  const sp = [
    P("Weak themes (0–2/8)", `${weak} of ${N}`, tiers(weak / N, .25, .15, .08), 3, weak / N >= .25 ? "Many weak themes — strong short environment" : weak / N >= .08 ? "Some weakness — selective shorts" : "Few weak themes — not ideal short day"),
    P("Themes red today", `${Math.round(red * 100)}% of themes`, two(red, .55, .35), 2, red >= .55 ? "Majority red — good day to work the short side" : red >= .35 ? "Mixed — selective shorts only" : "Mostly green — poor short day"),
    P("Late / cooling themes", `${cool} themes`, cool >= 5 ? 2 : cool >= 3 ? 1 : 0, 2, cool >= 5 ? "Multiple themes rolling over — short side has fuel" : cool >= 3 ? "Some themes cooling — watch for failed bounces" : "Little deterioration — shorts premature"),
    P("Short-term breadth narrow", `${Math.round(stN * 100)}% of themes`, two(stN, .35, .15), 2, stN >= .35 ? "Breadth collapsing — distribution underway" : "Breadth still holding — shorts need patience"),
    P("Themes with negative RS", `${negRS} of ${N}`, negRS / N >= .4 ? 1 : 0, 1, negRS / N >= .4 ? "Relative strength deteriorating broadly — structural shorts" : "RS mostly positive still — be patient with shorts"),
  ];
  const L = lp.reduce((s, x) => s + x.pts, 0), S = sp.reduce((s, x) => s + x.pts, 0);
  return { long: L, short: S, long_parts: lp, short_parts: sp,
    long_label: L >= 8 ? "GO — strong broad setup" : L >= 6 ? "LEAN LONG — stay selective" : L >= 4 ? "SELECTIVE — A-tier setups only" : L >= 2 ? "CAUTION — weak breadth, reduce size" : "SIT OUT — no edge today",
    short_label: S >= 8 ? "SHORT SIDE LIVE — strong short setup" : S >= 6 ? "LEAN SHORT — selective shorts only" : S >= 4 ? "SOME SHORT SETUPS — weak themes present" : S >= 2 ? "MOSTLY NEUTRAL — monitor for deterioration" : "NO SHORT EDGE — market too strong to short" };
}

const SHOW_H = ["today", "d5", "d15", "d30", "d60", "d90", "d180"];
function liveGroups(rows0, M, etfMap, bench) {
  const rows = rows0.map(th => {
    const mem = th.members.filter(t => M[t]);
    if (!mem.length) return null;
    const v = (k) => mem.map(t => M[t][k]);
    const a = Object.fromEntries([...SHOW_H, "rs", "lt"].map(k => [k, mean(v(k))]));
    const n = mem.length;
    const st_b = mem.filter(t => M[t].today > 0 && M[t].d5 > 0).length / n;
    const lt_b = mem.filter(t => M[t].d15 > 0 && M[t].d30 > 0).length / n;
    const sig = ["today", "d5", "d15", "d30", "rs", "lt"].filter(k => a[k] != null && a[k] > 0).length;
    const score = sig + (st_b >= 0.5 ? 1 : 0) + (lt_b >= 0.6 ? 1 : 0);
    const etfs = (etfMap && etfMap[th.theme]) || [];
    const etf = etfs.find(e => M[e]) || th.etf;
    const vs = (k) => bench && a[k] != null && bench[k] != null ? a[k] - bench[k] : null;
    return { ...th, ...a, n, score, class: score >= 7 ? "STRONG" : score >= 4 ? "WATCHLIST" : "WEAK", rotation: rotationOf(a),
      st_b, lt_b, st_label: blabel(st_b), lt_label: blabel(lt_b), vs_d5: vs("d5"), vs_d30: vs("d30"), vs_d90: vs("d90"),
      etf, etf_d5: etf && M[etf] ? M[etf].d5 : null, etf_d30: etf && M[etf] ? M[etf].d30 : null,
      trail: [...th.trail.slice(1), score] };
  }).filter(Boolean);
  rows.sort((x, y) => (y.score - x.score) || ((y.rs ?? -1e9) - (x.rs ?? -1e9)));
  rows.forEach((r, i) => { r.rank = i + 1; r.mv5 = r.r_m4 != null ? r.r_m4 - r.rank : null; });
  return rows;
}

function computeLive(T, prices, spyDate) {
  const { M, bad } = liveMetrics(T, prices);
  const bench = T.bench && T.bench.ticker ? M[T.bench.ticker] : null;
  const rows = liveGroups(T.themes, M, T.theme_etfs, bench);
  const subs = liveGroups(T.subthemes || [], M, null, bench);
  const scoreOf = Object.fromEntries(rows.map(r => [r.theme, r.score]));
  const subScore = Object.fromEntries(subs.map(r => [r.theme, r.score]));
  let stocks = T.stocks.filter(s => M[s.t]).map(s => {
    const m = M[s.t], ths = s.themes.slice().sort((a, b) => (scoreOf[b] ?? -1) - (scoreOf[a] ?? -1));
    const best = scoreOf[ths[0]] ?? 0, pts = setupScoreJS(best, m);
    return { ...s, ...m, themes: ths, tscore: best, sscore: subScore[s.sub] ?? null, setup: pts, tier: pts >= 8 ? "A" : pts >= 5 ? "B" : "C" };
  });
  const byRS = stocks.filter(s => s.rs != null).sort((a, b) => b.rs - a.rs);
  byRS.forEach((s, i) => { s.rk = i + 1; s.rk5 = s.rk_m4 != null ? s.rk_m4 - s.rk : null; });
  stocks.sort((a, b) => (b.setup - a.setup) || ((b.rs ?? -1e9) - (a.rs ?? -1e9)));
  const pulse = pulseJS(rows);
  return { ...T, date: spyDate, themes: rows, subthemes: subs, stocks, pulse,
    pulse_hist: [...(T.pulse_hist || []).slice(1), { date: spyDate, long: pulse.long, short: pulse.short }],
    counts: { themes: rows.length, subthemes: subs.length, stocks: stocks.length },
    live: { priced: Object.keys(M).length, total: Object.keys(T.refs).length, bad } };
}

const pct = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + (v * 100).toFixed(d) + "%";
const num = (v, d = 1) => v == null ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(d);
const HZ = { short: ["today", "d5", "d15", "d30"], long: ["d30", "d60", "d90", "d180"] };
const HZ_LABEL = { today: "Today", d5: "5D", d15: "15D", d30: "30D", d60: "60D", d90: "90D", d180: "180D" };
const hz = () => HZ[UI.hz] || HZ.short;
// Green/red fills in 3 steps; the step thresholds scale with the horizon.
const SCALE = { today: 0.015, d3: 0.03, d5: 0.04, d15: 0.08, d20: 0.1, d30: 0.12, d60: 0.18, d90: 0.24, d180: 0.35,
  rs: 20, lt: 0.04, st: 0.025, vs_d5: 0.03, vs_d30: 0.08, vs_d90: 0.15, etf_d5: 0.04, etf_d30: 0.12 };
function tint(v, scale) {
  if (v == null || !scale) return "";
  const a = Math.abs(v) / scale;
  const k = a >= 2 ? "3" : a >= 1 ? "2" : a >= 0.35 ? "1" : "";
  return k ? (v > 0 ? "g" : "r") + k : "";
}
const retCell = (v, k) => `<td class="num ${tint(v, SCALE[k])}">${pct(v)}</td>`;
const CLASS_COLOR = { STRONG: "var(--good)", WATCHLIST: "var(--warning)", WEAK: "var(--critical)" };
const ROT = { "Early Rotation": "🌅 Early", "Mid Rotation": "🚀 Mid", "Late / Cooling": "🔻 Late / cooling", "Neutral": "⏸ Neutral" };
const mvCell = (v) => v == null ? '<span class="mv">–</span>' : v === 0 ? '<span class="mv">·</span>'
  : `<span class="mv ${v > 0 ? "up" : "dn"}">${v > 0 ? "▲" : "▼"}${Math.abs(v)}${Math.abs(v) >= 10 ? (v > 0 ? " 🔥" : " ❄️") : ""}</span>`;
const trailHTML = (tr) => `<span class="trail" title="Score over the last ${tr.length} days">${tr.map(v => v == null ? '<i style="height:2px;opacity:.3"></i>' : `<i style="height:${3 + v * 2}px;opacity:${0.35 + v * 0.08}"></i>`).join("")}</span>`;
const badge = (r) => `<span class="badge" title="${r.class.toLowerCase()}"><i style="background:${CLASS_COLOR[r.class]}"></i><span class="num">${r.score}</span></span>`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function sortable(table, cols, getRows, draw, state) {
  let key = state[0], dir = state[1];
  const ths = table.querySelectorAll(":scope > thead th");
  const mark = () => ths.forEach((th, i) => { if (cols[i].k === key) th.setAttribute("aria-sort", dir > 0 ? "ascending" : "descending"); else th.removeAttribute("aria-sort"); });
  ths.forEach((th, i) => {
    if (!cols[i].k) return;
    th.addEventListener("click", () => {
      if (key === cols[i].k) dir = -dir; else { key = cols[i].k; dir = cols[i].asc ? 1 : -1; }
      state[0] = key; state[1] = dir;
      mark(); draw(sortRows(getRows(), key, dir));
    });
  });
  mark();
  return () => sortRows(getRows(), key, dir);
}
function sortRows(rows, key, dir) {
  return rows.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (x == null && y == null) return 0; if (x == null) return 1; if (y == null) return -1;
    return (typeof x === "string" ? x.localeCompare(y) : x - y) * dir;
  });
}
// A small segmented control bound to a key on a state object.
function chips(label, options, state, key, onChange) {
  const el = $(`<div class="chips" role="group" aria-label="${label}">${options.map(([v, t]) => `<button data-v="${v}" aria-pressed="${state[key] === v}">${t}</button>`).join("")}</div>`);
  el.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state[key] = b.dataset.v; el.querySelectorAll("button").forEach(o => o.setAttribute("aria-pressed", o === b)); onChange();
  }));
  return el;
}
const hzChips = () => chips("Return horizon", [["short", "Short-term"], ["long", "Long-term"]], UI, "hz", rerenderPanel);

function pulseCard(T) {
  const P = T.pulse, H = T.pulse_hist || [];
  const side = (kind) => {
    const v = P[kind], label = P[kind + "_label"], parts = P[kind + "_parts"];
    const col = kind === "long" ? (v >= 6 ? "var(--good)" : v >= 4 ? "var(--warning)" : "var(--critical)")
                                : (v >= 6 ? "var(--critical)" : v >= 4 ? "var(--warning)" : "var(--text-muted)");
    const vals = H.map(h => h[kind]);
    const w = 260, h = 34, n = Math.max(vals.length - 1, 1);
    const pts = vals.map((x, i) => `${(i / n * w).toFixed(1)},${(h - 2 - x / 10 * (h - 4)).toFixed(1)}`).join(" ");
    return `<div class="card pside">
      <div class="kicker">${kind === "long" ? "Long side" : "Short side"}</div>
      <div class="big"><b class="num">${v}<span style="font-size:15px;color:var(--text-muted)"> / 10</span></b><span class="lbl" style="color:var(--text-primary)">${label}</span></div>
      <div class="meter"><i style="width:${v * 10}%;background:${col}"></i></div>
      <table class="parts">${parts.map(p => `<tr><td>${p.name}<br><span style="color:var(--text-muted)">${p.value}</span></td><td class="note">${p.note}</td><td class="pts">${p.pts}/${p.max}</td></tr>`).join("")}</table>
      ${vals.length > 2 ? `<svg class="spark" width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" height="${h}" aria-label="${kind} score, last ${vals.length} days"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="meta" style="font-size:11.5px">Last ${vals.length} trading days</div>` : ""}
    </div>`;
  };
  return $(`<section class="pulse">${side("long")}${side("short")}</section>`);
}

const stockMap = () => { const M = {}; (getT().stocks || []).forEach(s => { M[s.t] = s; }); return M; };
const stockCols = (ranks) => [
  { k: "t", h: "Ticker", l: true, asc: true },
  ...(ranks ? [{ k: "st_rk", h: "ST rank<small>in bucket</small>", asc: true }, { k: "lt_rk", h: "LT rank<small>in bucket</small>", asc: true }] : []),
  { k: "setup", h: "Setup<small>/ 10</small>" }, { k: "rs", h: "RS<small>3-mo %</small>" },
  { k: "rk", h: "RS rank<small>all stocks</small>", asc: true }, { k: "rk5", h: "Rank Δ<small>5 days</small>" },
  ...hz().map(k => ({ k, h: HZ_LABEL[k] })), { k: "st", h: "ST score<small>5D score</small>" }, { k: "lt", h: "LT score" },
  { k: "e8", h: "vs 8 EMA" }, { k: "e21", h: "vs 21 EMA" }, { k: "e50", h: "vs 50 EMA" }, { k: "price", h: "Price" },
];
// sub: "sub" shows the stock's sub-theme under its name, "themes" its themes, "both" both
function stockCells(s, show, ranks) {
  const ema = (v) => { const near = v != null && v >= -0.03 && v <= 0.01; return `<td class="num"${near ? ' style="font-weight:700" title="Within -3% to +1% of this EMA"' : ""}>${pct(v)}</td>`; };
  const th = s.themes[0] + (s.themes.length > 1 ? ` +${s.themes.length - 1}` : "");
  const sub = show === "themes" ? th : show === "sub" ? (s.sub || "") : [s.sub, th].filter(Boolean).join(" · ");
  const rk = (v, n) => `<td class="num"><b>${v ?? "–"}</b><span class="meta">/${n}</span></td>`;
  return `<td class="l tname">${s.t}<small>${esc((s.name || "").slice(0, 26))}${sub ? (s.name ? " · " : "") + esc(sub) : ""}</small></td>
    ${ranks ? rk(s.st_rk, s._n) + rk(s.lt_rk, s._n) : ""}
    <td><span class="tier ${s.tier}">${s.tier}</span> <span class="num">${s.setup}</span></td>
    <td class="num ${tint(s.rs, SCALE.rs)}">${num(s.rs)}</td><td class="num">${s.rk ?? "–"}</td><td>${mvCell(s.rk5)}</td>
    ${hz().map(k => retCell(s[k], k)).join("")}${retCell(s.st, "st")}${retCell(s.lt, "lt")}
    ${ema(s.e8)}${ema(s.e21)}${ema(s.e50)}<td class="num">${s.price == null ? "–" : s.price.toFixed(2)}</td>`;
}
// A bucket's stock table: ST rank (by 5D score) and LT rank (by LT score) within
// the bucket, 1 = strongest, as in the sheet's Theme Drill-Down. Sortable.
const BUCKET_SORT = ["st_rk", 1];
function stockTable(list, show) {
  const n = list.length;
  const rows = list.map(s => ({ ...s, _n: n }));
  const rankBy = (k, out) => rows.filter(r => r[k] != null).sort((a, b) => b[k] - a[k]).forEach((r, i) => { r[out] = i + 1; });
  rankBy("st", "st_rk"); rankBy("lt", "lt_rk");
  const cols = stockCols(true);
  const el = $(`<div class="scroll"><table class="grid"><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody></tbody></table></div>`);
  const body = el.querySelector("tbody");
  const draw = (rs) => { body.innerHTML = rs.map(s => `<tr>${stockCells(s, show, true)}</tr>`).join(""); };
  const current = sortable(el.querySelector("table"), cols, () => rows, draw, BUCKET_SORT);
  draw(current());
  return el;
}
const groupRows = (T, view) => view === "sub" ? (T.subthemes || []) : T.themes;

/* ---------- Themes tab ---------- */
function renderThemes(app) {
  if (!DATA.themes) { app.append($('<div class="card empty">Theme data isn\'t available yet. It appears after the next data run.</div>')); return; }
  const T = getT(), U = UI.themes, sub = U.view === "sub";
  app.append(liveBar());
  if (!sub) app.append(pulseCard(T));
  const H = hz(), vsK = UI.hz === "long" ? "vs_d90" : "vs_d30";
  const cols = [
    { k: "theme", h: sub ? "Sub-theme" : "Theme", l: true, asc: true }, { k: "rank", h: "Rank", asc: true }, { k: "score", h: "Score<small>/ 8</small>" },
    { k: "mv5", h: "Rank Δ<small>5 days</small>" }, { k: null, h: "Trail<small>30 days</small>" }, { k: "rotation", h: "Rotation", l: true, asc: true },
    ...H.map(k => ({ k, h: HZ_LABEL[k] })), { k: "rs", h: "RS<small>3-mo %</small>" },
    { k: vsK, h: `vs SPY<small>${UI.hz === "long" ? "90D" : "30D"}</small>` }, { k: "st_b", h: "ST breadth" }, { k: "lt_b", h: "LT breadth" },
    ...(sub ? [] : [{ k: "etf_d5", h: "ETF<small>5D</small>" }]), { k: "n", h: "Stocks" },
  ];
  const rowsAll = groupRows(T, U.view);
  const card = $(`<section class="card tcard"><div class="head"><h2>${sub ? "Sub-themes" : "Themes"} <span class="meta">· ${rowsAll.length} ${sub ? "peer groups" : "themes"} · click a row for its stocks</span></h2>
    <div class="filters"></div></div>
    <div class="scroll"><table class="grid"><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="note">${sub ? "Sub-themes group stocks by what they actually sell, so names that move on the same news sit together even across themes. Each stock has one sub-theme; edit them in "
      + `<a href="${DATA.repo}/edit/main/data/subthemes.csv" target="_blank" rel="noopener">data/subthemes.csv</a>. Scored with the same rules as themes.`
      : "Score: +1 each for positive average Today, 5D, 15D, 30D, RS and LT score; +1 if at least 50% of the theme's stocks are up today and over 5 days (ST breadth); +1 if at least 60% are up over 15 and 30 days (LT breadth). 7–8 strong, 4–6 watchlist, 0–3 weak."}
    Rank Δ: places gained (▲) or lost (▼) in 5 days. Returns are equal-weighted averages; green and red get darker as the move gets bigger for that horizon.
    ${T.missing && T.missing.length && !sub ? `<br>Tickers with no data (check spelling or listing): ${T.missing.join(", ")}.` : ""}
    ${sub ? "" : `Edit themes in <a href="${DATA.repo}/edit/main/data/themes.csv" target="_blank" rel="noopener">data/themes.csv</a>.`}</div></section>`);
  const f = card.querySelector(".filters");
  f.append(chips("View", [["theme", "Themes"], ["sub", "Sub-themes"]], U, "view", () => { U.open.clear(); rerenderPanel(); }));
  f.append(chips("Class", [["All", "All"], ["STRONG", "Strong"], ["WATCHLIST", "Watchlist"], ["WEAK", "Weak"]], U, "cls", () => draw(current())));
  f.append(hzChips());
  const qi = $('<input type="search" placeholder="Search">'); qi.value = U.q; f.append(qi);
  app.append(card);
  const body = card.querySelector("tbody");
  const filtered = () => rowsAll.filter(r => (U.cls === "All" || r.class === U.cls) && (!U.q || r.theme.toLowerCase().includes(U.q) || (r.group || "").toLowerCase().includes(U.q)));
  const draw = (rows) => {
    body.innerHTML = "";
    rows.forEach(r => {
      const small = sub ? `${esc(r.group)} · ${r.n} stocks` : `${r.etf ? r.etf + " · " : ""}${r.n} stocks`;
      const tr = $(`<table><tr class="trow${U.open.has(r.theme) ? " open" : ""}">
        <td class="l tname">${esc(r.theme)}<small>${small}</small></td><td class="num">${r.rank}</td><td>${badge(r)}</td><td>${mvCell(r.mv5)}</td>
        <td>${trailHTML(r.trail)}</td><td class="l">${ROT[r.rotation] || r.rotation}</td>
        ${H.map(k => retCell(r[k], k)).join("")}<td class="num ${tint(r.rs, SCALE.rs)}">${num(r.rs)}</td>
        <td class="num ${tint(r[vsK], SCALE[vsK])}">${r[vsK] == null ? "–" : (r[vsK] > 0 ? "+" : "") + (r[vsK] * 100).toFixed(1) + " pts"}</td>
        <td class="num">${Math.round(r.st_b * 100)}% <span class="meta">${r.st_label}</span></td>
        <td class="num">${Math.round(r.lt_b * 100)}% <span class="meta">${r.lt_label}</span></td>
        ${sub ? "" : retCell(r.etf_d5, "etf_d5")}<td class="num">${r.n}</td></tr></table>`).querySelector("tr");
      body.append(tr);
      if (U.open.has(r.theme)) body.append(drillRow(r, cols.length, sub));
      tr.addEventListener("click", () => { U.open.has(r.theme) ? U.open.delete(r.theme) : U.open.add(r.theme); draw(current()); });
    });
  };
  const current = sortable(card.querySelector("table"), cols, filtered, draw, U.sort);
  qi.addEventListener("input", (e) => { U.q = e.target.value.trim().toLowerCase(); draw(current()); });
  draw(current());
}
function drillRow(r, span, sub) {
  const M = stockMap();
  const list = r.members.map(t => M[t]).filter(Boolean).sort((a, b) => (b.rs ?? -1e9) - (a.rs ?? -1e9));
  const extra = sub && r.parents && r.parents.length ? ` · in themes: ${r.parents.map(esc).join(", ")}` : "";
  const tr = $(`<table><tr class="drill"><td colspan="${span}"><div class="drillbox">
    <div class="meta">${esc(r.theme)}: ${list.length} stocks · ST rank = by 5D score, LT rank = by LT score, 1 = strongest in this bucket · click a column to sort${extra}</div>
    </div></td></tr></table>`).querySelector("tr");
  tr.querySelector(".drillbox").append(stockTable(list, sub ? "themes" : "sub"));
  tr.addEventListener("click", (e) => e.stopPropagation());
  return tr;
}

/* ---------- Browse tab: every name, bucket by bucket ---------- */
function renderBrowse(app) {
  if (!DATA.themes) { app.append($('<div class="card empty">Theme data isn\'t available yet.</div>')); return; }
  const T = getT(), U = UI.browse, sub = U.view === "sub", M = stockMap();
  app.append(liveBar());
  const bar = $(`<section class="card browsebar"><div class="filters"></div></section>`);
  const f = bar.querySelector(".filters");
  f.append(chips("Group by", [["theme", "By theme"], ["sub", "By sub-theme"]], U, "view", () => { U.open.clear(); U.all = false; rerenderPanel(); }));
  f.append(chips("Order", [["rank", "Strongest first"], ["az", "A–Z"]], U, "order", rerenderPanel));
  f.append(hzChips());
  const btns = $('<div class="navbtns"><button data-a="open">Expand all</button><button data-a="close">Collapse all</button></div>');
  f.append(btns);
  const qi = $('<input type="search" placeholder="Find a ticker, name or bucket">'); qi.value = U.q; f.append(qi);
  app.append(bar);
  let groups = groupRows(T, U.view).slice();
  if (U.order === "az") groups.sort((a, b) => a.theme.localeCompare(b.theme));
  else groups.sort((a, b) => a.rank - b.rank);
  const wrap = $('<div class="browse"></div>');
  app.append(wrap);
  const H = hz();
  const drawAll = () => {
    wrap.innerHTML = "";
    const q = U.q;
    let shown = 0;
    groups.forEach(g => {
      let list = g.members.map(t => M[t]).filter(Boolean);
      const gm = q && (g.theme.toLowerCase().includes(q) || (g.group || "").toLowerCase().includes(q));
      if (q && !gm) list = list.filter(s => s.t.toLowerCase().startsWith(q) || (s.name || "").toLowerCase().includes(q));
      if (q && !list.length) return;
      list.sort((a, b) => (b.rs ?? -1e9) - (a.rs ?? -1e9));
      shown++;
      const isOpen = U.all || U.open.has(g.theme) || (q && list.length <= 30);
      const d = $(`<details class="card bucket"${isOpen ? " open" : ""}>
        <summary><span class="bname">${esc(g.theme)}<small>${sub ? esc(g.group) + " · " : ""}#${g.rank} · ${ROT[g.rotation] || g.rotation} · ${g.n} stocks</small></span>
          ${badge(g)}<span class="bret">${H.map(k => `<span class="${tint(g[k], SCALE[k])}"><em>${HZ_LABEL[k]}</em>${pct(g[k])}</span>`).join("")}</span></summary>
        <div class="bbody"></div></details>`);
      const body = d.querySelector(".bbody");
      const fill = () => { if (!body.childElementCount) body.append(stockTable(list, sub ? "themes" : "sub")); };
      if (isOpen) fill();
      d.addEventListener("toggle", () => {
        if (d.open) { fill(); U.open.add(g.theme); } else { U.open.delete(g.theme); U.all = false; }
      });
      wrap.append(d);
    });
    if (!shown) wrap.innerHTML = '<div class="card empty">Nothing matches that search.</div>';
  };
  btns.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.a === "open") { U.all = true; } else { U.all = false; U.open.clear(); }
    drawAll();
  }));
  qi.addEventListener("input", (e) => { U.q = e.target.value.trim().toLowerCase(); drawAll(); });
  drawAll();
}

/* ---------- Stocks tab ---------- */
function renderStocks(app) {
  if (!DATA.themes) { app.append($('<div class="card empty">Stock data isn\'t available yet. It appears after the next data run.</div>')); return; }
  const T = getT(), U = UI.stocks;
  app.append(liveBar());
  const themesList = T.themes.map(t => t.theme).sort(), subList = (T.subthemes || []).map(t => t.theme).sort();
  const cols = stockCols();
  const card = $(`<section class="card tcard"><div class="head"><h2>Stocks <span class="meta">· ${T.counts.stocks} in your themes</span></h2>
    <div class="filters"></div></div>
    <div class="scroll"><table class="grid"><thead><tr>${cols.map(c => `<th class="${c.l ? "l" : ""}">${c.h}</th>`).join("")}</tr></thead><tbody></tbody></table></div>
    <div class="more-row"></div>
    <div class="note">Under each ticker: company · sub-theme · strongest theme. Setup score (/10, from your sheet): theme strength (0–2), trend: 15D and 30D up, RS and LT positive (0–2), within −3% to +1% of the 8 or 21 EMA (2, shown in bold), up today (1), resting: 5D under 2% after 15D and 30D gains over 5% (1), positive RS (1), coiling (1). A-tier 8+, B-tier 5–7.
    RS is the % change over about 3 months (63 trading days). RS rank is among all stocks here; Rank Δ is places gained (▲) or lost (▼) in 5 days, with 🔥/❄️ for 10+.</div></section>`);
  const f = card.querySelector(".filters");
  f.append(chips("Tier", [["All", "All tiers"], ["A", "A-tier"], ["B", "B-tier"], ["C", "C-tier"]], U, "tier", () => { U.limit = 100; draw(current()); }));
  f.append(hzChips());
  const sel = $(`<select aria-label="Theme"><option value="">All themes</option>${themesList.map(t => `<option>${esc(t)}</option>`).join("")}</select>`); sel.value = U.theme; f.append(sel);
  const sel2 = $(`<select aria-label="Sub-theme"><option value="">All sub-themes</option>${subList.map(t => `<option>${esc(t)}</option>`).join("")}</select>`); sel2.value = U.sub || ""; f.append(sel2);
  const qi = $('<input type="search" placeholder="Search ticker or name">'); qi.value = U.q; f.append(qi);
  app.append(card);
  const body = card.querySelector("tbody"), moreRow = card.querySelector(".more-row");
  const filtered = () => T.stocks.filter(s => (U.tier === "All" || s.tier === U.tier) && (!U.theme || s.themes.includes(U.theme))
    && (!U.sub || s.sub === U.sub) && (!U.q || s.t.toLowerCase().startsWith(U.q) || (s.name || "").toLowerCase().includes(U.q)));
  const draw = (rows) => {
    body.innerHTML = rows.slice(0, U.limit).map(s => `<tr>${stockCells(s, "both")}</tr>`).join("");
    moreRow.innerHTML = rows.length > U.limit ? `<button>Show ${Math.min(100, rows.length - U.limit)} more (${rows.length - U.limit} hidden)</button>` : "";
    const b = moreRow.querySelector("button"); if (b) b.addEventListener("click", () => { U.limit += 100; draw(current()); });
  };
  const current = sortable(card.querySelector("table"), cols, filtered, draw, U.sort);
  sel.addEventListener("change", (e) => { U.theme = e.target.value; U.limit = 100; draw(current()); });
  sel2.addEventListener("change", (e) => { U.sub = e.target.value; U.limit = 100; draw(current()); });
  qi.addEventListener("input", (e) => { U.q = e.target.value.trim().toLowerCase(); U.limit = 100; draw(current()); });
  draw(current());
}

render();
if (DATA && DATA.live_url) fetchLive();
let lastW = window.innerWidth;
window.addEventListener("resize", () => {
  if (Math.abs(window.innerWidth - lastW) < 40) return;
  lastW = window.innerWidth;
  clearTimeout(window._rt);
  window._rt = setTimeout(() => { render(); }, 150);
});
</script>
</body>
</html>
